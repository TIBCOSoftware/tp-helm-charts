  licenseSecretName: ""

appConfig:
  appId: ""
  buildId: ""
  workloadType: "user-app"
  appType: "bw5ce"
  appVersion: "1.0"
  originalAppName: ""
  bw5ceBuildTypeTag: "BW-5.16.2-TRA-5.13.1"
  bw5ceBaseImageTag: "76-5.16.2-V8-5.13.1-V8"
