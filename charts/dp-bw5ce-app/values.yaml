podSecurityContext:
  fsGroup: 2001
  fsGroupChangePolicy: Always
  runAsGroup: 2001
  runAsNonRoot: true
  runAsUser: 2001
  seccompProfile:
    type: RuntimeDefault

bwapp:
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    # enabling readOnlyRootFilesystem may cause issues with supplements where files are copied in system folder example - /etc/krb5.conf
    capabilities:
      drop:
      - ALL
      - CAP_NET_RAW
  resources: {}
  #  limits:
  #    cpu: "1"
  #    memory: 4Gi
  #  requests:
  #    cpu: 250m
  #    memory: 1Gi
  #
  # BW-22761 sizing note. This container holds one JVM per running process:
  # bwengine (unless the EAR turns out to be adapter-only) plus one agent per
  # configured adapter instance. An EAR with N adapter configurations therefore
  # needs roughly N times the adapter heap on top of the engine, and the limit
  # must be raised accordingly - the adapter JVMs are cgroup-aware
  # (-XX:MaxRAMPercentage=80) so they size against this limit, not the node.
  # Conversely an adapter-only app drops the engine's ~319 MiB and can usually
  # be sized down.
  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true
  envs: []
  # - name: foo
  #   value: bar
  envFrom:
    configMapRef: []
    #  - "cm1"
    secretRef: []
    #  - "secret1"
  # The default probes, used by every app that ships no adapter archive at all.
  # Unchanged by BW-22761: bwengine is the only process in such a pod, it serves
  # :8090, and the kubelet's own httpGet is a cheaper and more direct way to ask
  # it than shelling out. Adapter-bearing apps use adapterProbes or
  # adapterOnlyProbes below instead.
  startupProbe:
    failureThreshold: 60
    httpGet:
      path: /health/startup
      port: 8090
      scheme: HTTP
    periodSeconds: 3
    successThreshold: 1
    timeoutSeconds: 5
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /health/liveness
      port: 8090
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 6
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /health/readiness
      port: 8090
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 5
  # BW-22761 follow-up: used by every app that ships an adapter archive, whether
  # or not it also ships a Process Archive - so both the engine+agents pod and
  # the agents-only pod. One set covers both because adapterhealth.sh tells them
  # apart itself, at runtime, by whether start.sh wrote engine.pid.
  #
  # The httpGet probes above only ever see bwengine, so an adapter-bearing app
  # could lose an adapter and stay Ready with it dead - the same silent
  # half-start this work exists to remove. The script checks bwengine when there
  # is one, over the same /health/<kind> endpoint the httpGet probe used, and
  # additionally every adapter instance that reported its initialization trace.
  # No health fidelity is lost by the swap.
  #
  # Set ADAPTER_ALLOW_PARTIAL_STARTUP=true under engineProps to keep the old
  # tolerant behaviour; the probe honours it as well as the startup gate does.
  #
  # Thresholds are identical to the httpGet probes above, so timing is unchanged
  # for an app that moves between the two sets.
  #
  # Deliberately no path detection and no :8090 fallback in the chart. Both were
  # tried and both are duplication: engine.pid detection is the script's
  # onEnginePath, and the HTTP call is its engineHttpOk - which additionally
  # wraps the exchange in coreutils timeout, something a probe one-liner cannot
  # do well. Reimplementing either here would mean two health clients, and only
  # the buildpack's is exercised by its test suite. The script is mode 0775 and
  # owned by the container uid, so it is executed directly with no shell.
  #
  # The consequence, which a fallback would only have masked: these probes
  # require a base image that ships adapterhealth.sh, and one recent enough to
  # know the engine path - an older script checks the adapters but never looks
  # at bwengine. Rollout order is therefore base image first, then this chart,
  # which is the order BW-22761 already specifies. appConfig.bw5ceBaseImageTag
  # is only filled in when empty on an update, and customBaseImagePath bypasses
  # it entirely, so the provisioner must not set adapterApp on an app pinned
  # below that floor.
  adapterProbes:
    startupProbe:
      exec:
        command:
        - /scripts/adapterhealth.sh
        - --startup
      failureThreshold: 60      # 60 x 3s = 180s, the pre-BW-22761 startup budget
      periodSeconds: 3
      successThreshold: 1
      timeoutSeconds: 5
    livenessProbe:
      exec:
        command:
        - /scripts/adapterhealth.sh
        - --liveness
      failureThreshold: 3
      initialDelaySeconds: 10
      periodSeconds: 6
      successThreshold: 1
      timeoutSeconds: 5
    readinessProbe:
      exec:
        command:
        - /scripts/adapterhealth.sh
        - --readiness
      failureThreshold: 3
      initialDelaySeconds: 10
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 5
  lifecycle: {}

