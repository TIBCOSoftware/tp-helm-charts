  customBaseImagePath: ""
  # BW-22761: true when the EAR ships an adapter archive, whether or not it also
  # ships a Process Archive. The one adapter-related input this chart needs.
  #
  # It selects the probe set, which is the only part of this that has to be
  # decided at Helm render time:
  #
  #   adapterApp  EAR contains          pod contains        probes
  #   false       no adapter archive    bwengine only       bwapp.*Probe (httpGet)
  #   true        adapter + process     bwengine + agents   bwapp.adapterProbes
  #   true        adapter only          agents only         bwapp.adapterProbes
  #
  # An app with no adapters keeps the httpGet probes exactly as before - there
  # is nothing for adapterhealth.sh to add when bwengine is the only process in
  # the pod, so it is not worth the exec.
  #
  # Note there is deliberately no adapter-only flag here. Whether to skip
  # bwengine is a question about the EAR's contents, and the container can read
  # the EAR: earutils.sh globs *.aar and *.par out of the exploded artifact and
  # cross-checks TIBCO.xml for a declared .par module, which also catches a
  # process archive that is not at the root of the EAR. That is strictly better
  # evidence than anything the chart can carry, and a chart-supplied value can
  # go stale or disagree - resolveAdapterOnlyApp() has an explicit override for
  # exactly that case, refusing to skip the engine for an EAR that does declare
  # a Process Archive. So the chart sets ADAPTER_ONLY_APP_AUTODETECT instead of
  # deciding, and the runtime answers from the artifact.
  #
  # The buildpack defaults that autodetect to off for one documented reason: an
  # older chart renders the httpGet :8090 probes, and skipping the engine under
  # those turns a wasteful-but-working pod into CrashLoopBackOff. Rendering the
  # exec probes is what lifts that constraint, which is why the same flag drives
  # both - enabling one without the other is precisely the unsafe combination.
  #
  # Computed by the provisioner at analyze time from hasAAR. Until it publishes
  # this, the flag stays false and an adapter-bearing app keeps today's
  # engine-only probes and today's engine: pre-BW-22761 behaviour, not a broken
  # one.
  adapterApp: false

