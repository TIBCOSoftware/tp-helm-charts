global:
  cp:
    dataplaneId: ""
    instanceId: ""
    # CP-DP HAProxy ingress vhost. Default = tunnel vhost (hybrid-ON).
    # The orchestrator overrides host with the reachable-URL host
    # (cpdpproxy.<dp-ns>.svc.cluster.local) when hybrid connectivity is disabled,
    # exactly as for bwprovisioner/flogoprovisioner/o11y-service/tp-dp-mcp-gateway.
    # Rendered through `tpl` in ingress.yaml so the {{ }} default is
    # re-evaluated at install. Keys on global.cp.dataplaneId — the same identifier
    # this chart's ingressClassName (tibco-dp-<dataplaneId>) already uses.
    dpUrl:
      host: "dp-{{ $.Values.global.cp.dataplaneId }}.platform.local"
      port: 443
    # routeResources controls the internal control-plane -> data-plane route (via dp-proxy) for this component.
    # The routing path is split into a configurable prefix + a fixed /integration/infra-mcp-server tail.
    routeResources:
      pathPrefix: /tibco/agent
      controllerServiceDNS: cpdpproxy   # carried for parity with the sibling charts; not read by this chart
      ingress:
        ingressController: ""    # "" (bundled HAProxy, default) | "haProxy" | "nginx" | "traefik" | "openshiftRouter"
        ingressClassName: ""     # required whenever ingressController is non-empty (including "haProxy")
        fqdn: ""                 # required when ingressController is set
        annotations: {}          # user-supplied annotations merged on top of controller defaults
      gatewayapi:
        gatewayAPIControllerName: ""
        gatewayName: ""
        gatewayNamespace: ""
        gatewayHostOrDomainName: ""
        gatewaySectionName: ""
    containerRegistry:
      secret: ""
      url: ""
      repository: "tibco-platform-docker-prod"
    enableResourceConstraints: true
    resources:
      serviceaccount:
        namespace: ""
        serviceAccountName: ""
    logging:
      fluentbit:
        enabled: false
        image:
          tag: 5.0.2
        resources:
          requests:
            cpu: 10m
            memory: 15Mi
          limits:
            cpu: 50m
            memory: 30Mi
        probes:
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/v1/health
              port: 2020
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

# -- Name of a pre-existing image pull Secret in the release namespace. Leave empty on a data
# plane: the platform injects global.cp.containerRegistry.secret. Break-glass only, for a manual
# helm upgrade during development or support triage -- the capability release is
# orchestrator-managed, so this is reconciled away on the next orchestrator-driven upgrade.
# See README.md, "Container registry pull secret".
imagePullSecret: ""

# -- Service account configuration
serviceAccount:
  # Set to false to use a pre-existing service account (BYOSA)
  create: true
  # Override the service account name (defaults to chart fullname)
  name: ""

# -- Container image
image:
  # Lockstep: name and tag move together. Build IDs are name-independent, so a tag
  # published under the old name is unpullable under the new one.
  name: infra-mcp-server
  tag: "128"
  pullPolicy: IfNotPresent

replicaCount: 1

# -- Service ports
service:
  type: ClusterIP
  restPort: 80
  restTargetPort: 8091
  mcpPort: 8092
  mcpTargetPort: 8092

# -- HAProxy ingress for CP-to-DP proxy routing
haproxy:
  enabled: true
  pathPrefix: /tibco/agent/integration/infra-mcp-server
  # MCP sub-path under pathPrefix; must match the CP capability metadata mcpServer.endpointPath.
  mcpPath: /mcp

# -- Application configuration (mounted as environment variables)
config:
  LOG_LEVEL: "info"
  KUBECTL_TIMEOUT: "30"
  HELM_TIMEOUT: "30"

# -- Resource constraints
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
