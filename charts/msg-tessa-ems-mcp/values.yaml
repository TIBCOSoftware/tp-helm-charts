emsmcp:
  image:
  haproxyNoauth: false

# expected CP global injected settings
global:
  cp:
    dpUrl:
      # host: "dp-{{ $.Values.global.cp.dataplaneId }}.platform.local"
      host: ""
      port: 443
    dataplaneId: ""
    routeResources:
      pathPrefix: /tibco/agent   # per-DP prefix; OHC2 control planes send "" or a custom value
      controllerServiceDNS: cpdpproxy   # service DNS for tibtunnel (hybrid connectivity)
      ingress:
        ingressController: ""    # "" | "haProxy" (default) | "nginx" | "traefik" | "openshiftRouter"
        ingressClassName: ""
        fqdn: ""
        annotations: {}
      gatewayapi:
        gatewayAPIControllerName: ""
        gatewayName: ""
        gatewayNamespace: ""
        gatewayHostOrDomainName: ""
        gatewaySectionName: ""
    containerRegistry:
      registry: "ghcr.io"
      repository: "tibco/msg-platform-cicd"
      secret: ""
      pullSecret: ""
      pullPolicy: "Always"

dp:
  pullPolicy:
  routing:
    enabled:
      haProxy: true
      traefik: true
      nginx: true
      openshiftRouter: true
      gatewayapi: true
    gatewayapi:
      # Lowercase cp-provided controller names. Empty list = allow any once the gate above is on.
      allowedControllers:
        - haproxy
        - openshiftrouter
        - traefik
        - nginx
        - istio
        - netscaler
        - gke
        # named in the OHC2 design doc
        - envoy
        - kong
  # Possible chart-level overrides
  # pullPolicy: "Always"
  # pullSecret: "cic2-tcm-ghcr-secret"
  # registry: "ghcr.io"
  # repository: tibco/msg-platform-cicd
  # serviceAccount: provisioner
