{{/*
  Jaeger writes DATE-NAMED daily indices (jaeger-span-YYYY-MM-DD): the Jaeger Elasticsearch
  backend configured in tp-cp-o11y runs without `use_aliases`, so it never writes through the
  jaeger-span-write alias. This template must therefore NOT grant that alias — when it did, every
  new daily index claimed `is_write_index: true` while the previous day's index still held it, so
  from the data plane's second UTC day onward Elasticsearch rejected every bulk write with
  "alias [jaeger-span-write] has more than one write index" and all spans were silently dropped
  (PCP-24038; the alias was added by PCP-15628 / #7225).

  For the same reason there is no `rollover_alias` here and no rollover action in the lifecycle
  policy: retention is age-based, driven off each daily index's creation date. If Jaeger is ever
  switched to `use_aliases: true`, the write alias belongs on a bootstrap index and STILL not in
  this template — Elasticsearch rejects a rollover whose alias is duplicated in a matching index
  template ("Rollover alias [x] can point to multiple indices, found duplicated alias [x] in
  index template [y]").
*/}}

{{ if .Values.index.enabled -}}
apiVersion: es.eck.github.com/v1alpha1
kind: IndexTemplate
metadata:
  name: {{ .Release.Name }}-jaeger-span-index-template
  namespace: elastic-system
spec:
  targetInstance:
    name: {{ .Release.Name }}
  body: |
    {
      "priority": 3,
      "index_patterns": ["*jaeger-span-*"],
      "template": {
        "aliases": {
          "jaeger-span-read": {}
        },
        "settings": {
          "index.number_of_shards": 6,
          "index.number_of_replicas": 1,
          "index.mapping.nested_fields.limit": 50,
          "index.requests.cache.enable": true,
          "lifecycle": {
            "name": "{{ .Release.Name }}-jaeger-index-30d-lifecycle-policy"
          }
        },
        "mappings": {
          "dynamic_templates": [
            {
              "span_tags_map": {
                "mapping": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "path_match": "tag.*"
              }
            },
            {
              "process_tags_map": {
                "mapping": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "path_match": "process.tag.*"
              }
            }
          ],
          "properties": {
            "traceID": {
              "type": "keyword",
              "ignore_above": 256
            },
            "parentSpanID": {
              "type": "keyword",
              "ignore_above": 256
            },
            "spanID": {
              "type": "keyword",
              "ignore_above": 256
            },
            "operationName": {
              "type": "keyword",
              "ignore_above": 256
            },
            "startTime": {
              "type": "long"
            },
            "startTimeMillis": {
              "type": "date",
              "format": "epoch_millis"
            },
            "duration": {
              "type": "long"
            },
            "flags": {
              "type": "integer"
            },
            "logs": {
              "type": "nested",
              "dynamic": false,
              "properties": {
                "timestamp": {
                  "type": "long"
                },
                "fields": {
                  "type": "nested",
                  "dynamic": false,
                  "properties": {
                    "key": {
                      "type": "keyword",
                      "ignore_above": 256
                    },
                    "value": {
                      "type": "keyword",
                      "ignore_above": 256
                    },
                    "tagType": {
                      "type": "keyword",
                      "ignore_above": 256
                    }
                  }
                }
              }
            },
            "process": {
              "properties": {
                "serviceName": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "tag": {
                  "type": "object"
                },
                "tags": {
                  "type": "nested",
                  "dynamic": false,
                  "properties": {
                    "key": {
                      "type": "keyword",
                      "ignore_above": 256
                    },
                    "value": {
                      "type": "keyword",
                      "ignore_above": 256
                    },
                    "tagType": {
                      "type": "keyword",
                      "ignore_above": 256
                    }
                  }
                }
              }
            },
            "references": {
              "type": "nested",
              "dynamic": false,
              "properties": {
                "refType": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "traceID": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "spanID": {
                  "type": "keyword",
                  "ignore_above": 256
                }
              }
            },
            "tag": {
              "type": "object"
            },
            "tags": {
              "type": "nested",
              "dynamic": false,
              "properties": {
                "key": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "value": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "tagType": {
                  "type": "keyword",
                  "ignore_above": 256
                }
              }
            }
          }
        }
      }
    }
{{- end -}}
