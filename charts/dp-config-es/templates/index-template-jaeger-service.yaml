{{/*
  No jaeger-service-write alias and no rollover_alias here, for the same reason as the jaeger-span
  template (see index-template-jaeger-span.yaml): Jaeger writes date-named daily indices, so a
  write alias granted by this template would make every new daily index a second write index and
  Elasticsearch would reject all bulk writes (PCP-24038).
*/}}

{{ if .Values.index.enabled -}}
apiVersion: es.eck.github.com/v1alpha1
kind: IndexTemplate
metadata:
  name: {{ .Release.Name }}-jaeger-service-index-template
  namespace: elastic-system
spec:
  targetInstance:
    name: {{ .Release.Name }}
  body: |
    {
      "priority": 5,
      "index_patterns": ["*jaeger-service-*"],
      "template": {
        "aliases": {
          "jaeger-service-read": {}
        },
        "settings": {
          "index.number_of_shards": 6,
          "index.number_of_replicas": 1,
          "index.mapping.nested_fields.limit": 50,
          "index.requests.cache.enable": true,
          "lifecycle": {
            "name": "{{ .Release.Name }}-jaeger-index-30d-lifecycle-policy"
          }
        },
        "mappings": {
          "dynamic_templates": [
            {
              "span_tags_map": {
                "mapping": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "path_match": "tag.*"
              }
            },
            {
              "process_tags_map": {
                "mapping": {
                  "type": "keyword",
                  "ignore_above": 256
                },
                "path_match": "process.tag.*"
              }
            }
          ],
          "properties": {
            "serviceName": {
              "type": "keyword",
              "ignore_above": 256
            },
            "operationName": {
              "type": "keyword",
              "ignore_above": 256
            }
          }
        }
      }
    }
{{- end -}}
