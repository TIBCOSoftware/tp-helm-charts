  # family never got. mcp-hub-recipes 1.21.5 -> 1.22.0, mcp-hub-webserver 1.21.0 -> 1.22.0, and
  # these two ranges "1.21.*" -> "1.22.*" together.
  #
  # The coupling is enforced, and the enforcement is NOT where the old text implied. "dependency
  # resolution finds nothing" is wrong as a description of the failure: measured on helm 4.0.4,
  # a range/subchart mismatch leaves `helm lint` AND `helm template` at rc=0 with the subchart
  # STILL RENDERING. What actually fails is `helm dependency build` (rc=1, "dependency
  # mcp-hub-recipes at version 1.22.0 does not satisfy the constraint 1.21.*"), which ct lint
  # runs. So a split pair REDS the PR -- but red is not the same as blocked, and the difference
  # matters here: `repos/tibco/tp-helm-charts/rules/branches/main` carries NO
  # `required_status_checks` rule at all (only deletion, non_fast_forward, pull_request x2,
  # branch_name_pattern, required_linear_history), so two approvals can merge a red PR. If one
  # does, `release-chart.yaml`'s "Build subchart dependencies" step runs `helm dependency build`
  # per Chart.yaml dir under `bash -e` with no `|| true`, exits 1 BEFORE chart-releaser, and then
  # NO chart in the repo publishes from main until someone fixes it. Do not rely on a local
  # `helm lint` to catch a split pair either -- it returns rc=0.
  #
  # BARE 1.22.0 on both subcharts, not an alpha: Helm does not match a prerelease against a
  # wildcard constraint, so "1.22.0-alpha.N" under "1.22.*" would resolve to nothing.
  - name: mcp-hub-recipes
    version: "1.22.*"
    condition: mcp-hub-recipes.enabled
  - name: mcp-hub-webserver
    version: "1.22.*"
    condition: mcp-hub-webserver.enabled
