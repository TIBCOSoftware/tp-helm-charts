# The published set on the 1.22 line is `.1 .2 .3 .4 .7 .9 .11`. Measured 2026-09-23:
# `.5`, `.6`, `.8` and `.10` all return ZERO refs. Every one of those gaps is a number a PR
# RESERVED and then re-cut past; a branch that claims a number and later moves publishes
# nothing at it, ever.
#
# ⛔ TWO CONSEQUENCES, and the second is the one that keeps costing:
#   1. A GAP IS NOT A FAILED RELEASE. Auditing the tag list and finding four numbers missing
#      invites the conclusion that four releases broke. None did. Do not open that investigation.
#   2. "Highest PUBLISHED" therefore UNDERSTATES the frontier, and the two diverge further every
#      week -- yet only the published side is measurable from outside a PR. That is exactly why
#      the tag list alone cannot protect you, and why the three inputs are not redundant:
#        * main's `version:`   -- am I below it NOW?
#        * the open-PR sweep   -- will I be below it SOON, when that PR merges?
#        * the tag list        -- collision only, i.e. the mode that has never once fired here.
#      Every number that has actually bitten -- .5, .6, .8, .10 -- was FREE in the tag list.
#
