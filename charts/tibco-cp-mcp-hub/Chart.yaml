appVersion: "1.22.0"
description: TIBCO Controlplane chart for MCP Hub Capability
dependencies:
  # These constraints track the SUBCHART versions, not this chart's version. If either subchart's
  # `version:` moves, these must move with it IN THE SAME COMMIT.
  #
  # PCP-25657: both moved. The paragraph that stood here said the subcharts "have been on 1.21.0
  # since PCP-23334 (#10426, 2026-08-25) and neither one's `version:` LINE has moved since —
  # nothing moves them in this change", with a PCP-25635 correction noting mcp-hub-recipes had
