        - security
        mode: disabled
        priority: 20
        conditions: []
        config:
          claims_context_key: jwt_claims
          group_claim: groups
          default_decision: deny
          enforce_for_auth_methods:
          - oauth_access_token
          - oauth_access_token_unprovisioned
          bypass_admin: true
          group_role_map: {}
          roles: {}
  # PCP-25386 (review follow-up, same PR): the RateLimiterPlugin's redis backend fragment the
  # content above still carries as a literal placeholder (RATE_LIMITER_BACKEND_BLOCK_PLACEHOLDER).
  # Literal copy of charts/tp-mcp-gateway/values.yaml's mcp-stack.rateLimiterRedisBlock. Full
  # mode's configmap-gateway-plugin.yaml substitutes this placeholder ONLY when real Redis is
  # reachable (mcp-stack.redis.enabled, true by default); when it IS, the template reads
  # .Values.rateLimiterRedisBlock unconditionally and `trim`s it with no nil-guard. A Hub-driven
  # upgrade of a gateway installed before this key existed carries it forward as ABSENT
  # (--reuse-values keeps the old coalesced values, which predate the key), so without this pin
  # the render FAILS outright: `executing ... at <trim>: invalid value; expected string` --
  # reproduced directly: `helm template charts/tp-mcp-gateway --set lite.enabled=false --set
  # mcp-stack.enabled=true --set mcp-stack.rateLimiterRedisBlock=null` crashes with that exact
  # error; omitting only the --set renders clean. Must move in lockstep with pluginConfig above
  # whenever the gateway chart's version moves; dev/check-mcp-version-sync.sh CHECK 8 enforces
  # byte-identical content, same as pluginConfig.
  rateLimiterRedisBlock: |
    backend: "redis"
    redis_url: '{{ env.RATELIMITER_REDIS_URL | default(env.REDIS_URL | default("redis://redis:6379/0")) }}'
    redis_key_prefix: "rl"
    fail_mode: "open"
    algorithm: "fixed_window"
  # PCP-25401: literal copy of charts/tp-mcp-gateway/values.yaml's
  # global.tibco.logging.fluentbit.image.tag (a TIBCO common image, not a first-party
  # tp-mcp-* one -- CHECK 7's firstparty_sites() deliberately does not derive it, so it
  # was never one of the eight image sites that check already pins). Found sweeping
  # PCP-25386's recipe-pin fix: `helm upgrade --reuse-values` freezes this tag the same
  # way it froze plugin config, so the PCP-25107 CVE remediation (5.1.0 -> 5.1.2) never
  # reached an already-installed, Hub-upgraded gateway -- only fresh installs got it.
  # Must move in lockstep with charts/tp-mcp-gateway/values.yaml's fluentbit tag;
  # dev/check-mcp-version-sync.sh CHECK 8 enforces it the same way as pluginConfig and
  # rateLimiterRedisBlock above.
  # PCP-25657: 5.1.2 -> 5.1.3 in lockstep with charts/tp-mcp-gateway/values.yaml (CHECK 8).
  # PCP-25657: 5.1.3 -> 5.1.5 in lockstep with charts/tp-mcp-gateway/values.yaml (CHECK 8), the base chart's pin.
  fluentbitTag: "5.1.5"
  # PCP-21876 (per-DP custom routing, PCP-18809) / PCP-23774: there is deliberately NO
  # routeResources block here, and none must be re-added.
  #
  # templates/mcp-gateway.yaml used to render this into the deployment recipe as
  # global.cp.routeResources. Every key in it is per-DATA-PLANE (pathPrefix, ingress.*,
  # gatewayapi.*), but this recipe is per-CP — one copy installs gateways onto every Data Plane in
  # the subscription — so anything set here is a constant that OVERRIDES the real per-DP value the
  # provisioner injects on the Data Plane.
  #
  # PCP-23774 removed pathPrefix first, and a live DP then reported the injected `/mcp/hub`, proving
  # the injection does reach the chart. The remaining pins were still swallowing the rest: an
  # `ingressController: ""` pinned here kept haproxy-ingress.yaml's guard true and
  # private-route.yaml's false, so an alt-controller Data Plane got a bundled-HAProxy Ingress on a
  # class no controller serves and every CP->DP health check 404'd.
  #
  # The Hub cannot substitute these either — the CP exposes no per-DP routing config to it. With
  # the block absent, tp-mcp-gateway's own values.yaml defaults apply when nothing is injected
  # (empty controller, /tibco/agent prefix), so a default Data Plane is unaffected.

