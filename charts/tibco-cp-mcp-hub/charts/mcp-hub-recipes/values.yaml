      # grants/denies each inbound tool call (default-deny). Pairs with the
      # JwtClaimsExtractionPlugin dependency above. Ships disabled; enable per-VS via
      # the Hub "Add plugin to http_auth_check_permission" binding.
      - name: PermissionPlugin
        kind: plugins.permissions.permissions.PermissionPlugin
        description: "Per-user authorization for OAuth inbound VS requests: JWT groups -> roles -> allowed tools (default-deny)"
        version: 1.0.0
        author: TIBCO
        hooks:
