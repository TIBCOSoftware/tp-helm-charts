global:
  # PCP-21919 / PCP-9150 -- name of a pre-existing image-pull Secret. MEASURED 2026-08-04: this
  # key is the DATA-PLANE wiring; on the CP this chart actually receives
  # global.tibco.containerRegistry.* instead. Both are honoured. Declared here so the key always
  # exists (a missing `global.cp` would nil-pointer the render). See mcp-hub-webserver.container-registry.secret for the full precedence.
  cp:
    containerRegistry:
      secret: ""
  tibco:
    containerRegistry:
      url: ""
      username: ""
      password: ""
      repository: ""
      imagePullSecretName: ""
      # PCP-21919 -- same contract, the spelling the CP actually delivers (TibcoResourceSet
      # valueOverrides). On a live CP this is the arm that fires for this chart.
      secret: ""
    controlPlaneInstanceId: ""
    enableResourceConstraints: true
    logging:
      fluentbit:
        enabled: true
        image:
          name: "common-fluentbit"
          registry: ""
          repo: ""
          # PCP-25107: 5.1.0 -> 5.1.2 (CVE-remediated build).
          # PCP-25657: 5.1.2 -> 5.1.3, the BASE chart's pin (tibco-cp-base commonImages.fluentbit on releases/1.22).
          # PCP-25657: 5.1.3 -> 5.1.5, the BASE chart's pin (tibco-cp-base commonImages.fluentbit on releases/1.22,
          # 1.22.0-alpha.137). common-fluentbit:5.1.5 verified present in -dev (sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4).
          tag: 5.1.5
          pullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
  external:
    storage:
      pvcName: "control-plane-pvc"

imagePullSecret:

capabilities:
  mcpgateway:
    # if set to true then existing recipe will be overwritten by latest recipe.
    overwriteRecipe: "true"
    # set to true for latest version of recipe
    isLatest: "true"
    # Timestamp of capability release
    # PCP-25635: moves with the capabilityVersion (mcp-hub-recipes appVersion 1.21.0 -> 1.22.0) so
    # the new catalog entry does not carry the 1.21 date. 2026/10/29 is the release date of the
    # PLT-MCP-HUB-122 Jira fix version.
    releaseDate: "2026/10/29"
    # Either a link to document or the document itself specifying what was fixed in this release.
    releaseNotes: "#cshid=new_features"
    # PCP-26782: the minimum Data Plane versions this capability version declares (version.json "minDPVersion"). The
    # CP orchestrator compares them with the Data Plane's dp-core-infrastructure / dp-configure-namespace appVersion
    # before any Helm work, on every install and upgrade, and refuses with a 400 that the Hub turns into "Upgrade the
    # Data Plane namespace configuration first" (tp-mcp-hub backend/src/cp-api/min-dp-refusal.ts). Kept here, not as
    # literals in templates/mcp-gateway.yaml, so the coupling guard reads the value this chart actually publishes:
    # dev/dp-configure-namespace-render-tests/mcp-gateway-chart-coupling-assert.sh renders the gateway chart this
    # recipe installs against the OLDEST published dp-configure-namespace chart with this appVersion.
    # Release rule (pm, 2026-10-22): "A GA-released chart version's minimum CP/DP versions never increase. Alpha/dev
    # versions may change until GA, unless that alpha was handed to a customer or a field POC, in which case it counts
    # as released for this rule." A Redeploy reinstalls the version a gateway runs, so a minimum raised after install
    # could refuse that reinstall after its uninstall.
    minDPVersion:
      # 1.19.0 -> 1.22.0: the 1.22+ gateway chart renders a traefik.io IngressRoute when the Data Plane's ingress
      # controller is Traefik (charts/tp-mcp-gateway/templates/ingress-traefik.yaml), and only dp-configure-namespace
      # appVersion 1.22.0 and later grant the DP service account traefik.io ingressroutes (mcp-gateway-role.yaml,
      # rbac.ingressController.traefik). Measured 2026-10-22 on a 1.21.4 namespace: a 1.22 gateway Upgrade, fresh
      # Deploy and Redeploy each failed at Helm ("cannot get resource ingressroutes in API group traefik.io"), the
      # Redeploy after it had uninstalled the running gateway (tp-mcp-hub docs/plan/PCP-26782-redeploy-proof.md).
      # It applies to every Data Plane, not only Traefik ones: a minimum cannot name an ingress controller.
      dpConfigureNamespace: "1.22.0"
      # Unchanged, and it must stay at or below every supported Data Plane: the orchestrator answers a shortfall of
      # EITHER minimum with the same sentence, and the Hub's instruction names the namespace configuration.
      dpCoreInfrastructure: "1.19.0"

image:
  name: common-distroless-base-debian-debug
  # PCP-23334: 13.3 -> 13.5 to match the 1.20 HIGH-CVE sweep. The GA manifest
  # artifacts/control-plane/control-plane-1.20.0-images.txt declares 13.5, and every sibling
  # capability chart (bw, flogo) ships 13.5. MCP Hub was structurally excluded from that sweep
  # because 4de6e2ded7 -- the PCP-23262 sweep commit itself -- is what ADDED these charts to
  # releases/1.20. Tag verified present in tibco-platform-docker-dev before pinning
  # (sha256:4e148a2af43caee0cbc72bc7705244d62be0d222749327e07f9d26edccd672db).
  registry: ""
  repo: ""
  # QUOTED deliberately: templates/mcp-gateway.yaml interpolates this bare into an image
  # reference, and an unquoted YAML scalar is parsed as a FLOAT -- a future 13.10 would render
  # as 13.1 and pull the wrong image. Render-neutral for 13.6 and 13.7; it is the next minor that breaks.
  # PCP-25657: 13.6 -> 13.7, the BASE chart's pin (tibco-cp-base commonImages.distrolessDebug on releases/1.22,
  # 1.22.0-alpha.137). Verified present in -dev (sha256:b1169778b4eb71487fd26b1750e6cd2152ecd2ae60f1a350fe87bae7c6e60fd3).
  tag: "13.7"
  pullPolicy: IfNotPresent

# Pod Security Context configuration
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: "Always"
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
      - CAP_NET_RAW

mcpGateway:
  # SINGLE home for the deployed gateway chart version. Source of truth is
  # charts/tp-mcp-gateway/Chart.yaml .version — this MUST equal it, enforced by
  # dev/check-mcp-version-sync.sh in CI. The automated alpha release (release-alpha.sh)
  # maintains this value on release; do not also override it in the umbrella values.yaml.
  # PCP-23986: chart >= 1.21.0-alpha.10 renders the 8880/8881 proxy listen ports. A proxy
  # image predating tp-mcp-gateway#349 ignores TIBCO_PROXY_EXT_PORT/CP_PORT and binds :80/:81,
  # so nothing answers on 8880, the readiness probe never passes, and the capability is down —
  # this pin MUST advance with (or before) the chart. PCP-21327: the proxy is one of the eight
  # sites the emitted recipe now pins from mcpGateway.image.tag below, so that "must advance
  # together" is finally enforceable on UPGRADE as well as on a fresh install — before it, the
  # proxy tag fell back to the gateway chart's own default and `helm upgrade --reuse-values`
  # replayed the OLD one. release-alpha moves all ten first-party image pins and both versions
  # in one run; check-mcp-version-sync.sh [1] enforces that this value equals the gateway chart
  # version, [2] that the ten pins agree, and [7] that the recipe really emits all eight.
  # PCP-24083: alpha.10 is exactly the failure the paragraph above describes — it renders the
  # 8880/8881 ports against main-20b2704, a proxy image predating #349. It must not be pointed
  # at from here. PCP-24140: this branch has now cut .13, .14, .15 and .16 in turn — each time
  # because the number it held had been taken while the branch was open (twice by the
  # automation lane, once by main itself, once by an open PR). Do not read a version out of
  # this comment; read it from the gateway Chart.yaml, which CHECK 1 forces this value to equal.
  # PCP-24482 — the gateway chart now injects GATEWAY_CHART_VERSION into the dialhome-agent
  # (template-only). CHECK 1 forces this value to equal charts/tp-mcp-gateway/Chart.yaml's
  # version; read it from there, never from this comment.
  #
  # ⚠️ Newer gateway tags exist than this one — a GA (`tp-mcp-gateway-1.21.0`) and a 1.22 alpha
  # — and staying on the 1.21 line here is deliberate, not an oversight. `main` lags both lanes
  # by design and promotion is its own merge; moving this to 1.22 also turns CHECK 6 green while
  # CONCEALING that the ten image pins predate what the 1.22 line shipped. Full reasoning is in
  # charts/tp-mcp-gateway/Chart.yaml, next to the version this must equal.
  # (HISTORY: superseded by PCP-25546, which moved main onto the 1.22 line.)
  # PCP-24354: moved .23 -> .25 in lockstep with charts/tp-mcp-gateway/Chart.yaml. These two
  # MUST be equal -- dev/check-mcp-version-sync.sh CHECK 1 guards exactly that, and bumping the
  # gateway chart alone turns it RED and makes the emitted recipe request a chart version that
  # this PR did not publish. (Caught by the PR cross-review; the gateway chart's own version
  # comments do not mention this file, which is how it gets missed.)
  # PCP-23832: moved with charts/tp-mcp-gateway/Chart.yaml .28 -> .31 (CHECK 1).
  # PCP-24264: .31 -> .32 on the second resync — CHECK 1 requires this to equal the gateway
  # chart's own version exactly, so it moves in the same commit.
  # PCP-25126: .32 -> .34 with the gateway chart (CHECK 1).
  # PCP-24390: .35 -> .36 with the gateway chart (CHECK 1).
  # PCP-25210: .36 -> .37 with the gateway chart (CHECK 1) -- bundled-Redis password fix.
  # PCP-25281/PCP-25280/PCP-25282: .37 -> .38 with the gateway chart (CHECK 1) -- three
  # plugins.config drifts from the gateway repo (RateLimiter backend, Webhook raw guard,
  # Summarizer allowlist globs).
  # PCP-25379: .38 -> .39 with the gateway chart (CHECK 1) -- the full-mode Ingress allowlist
  # fix (plain Ingress -> Traefik v3 IngressRoute). Merged onto origin/main after .38 landed.
  # PCP-25488: .39 -> .40 with the gateway chart (CHECK 1) -- defaults
  # MCPGATEWAY_POOL_RPC_FORWARD_TIMEOUT to 180s so a federated elicitation survives a
  # cross-worker forward on a multi-replica production gateway.
  # PCP-25546: .40 -> 1.22.0-alpha.21 with the gateway chart (CHECK 1).
  # PCP-25553: .21 -> .22 with the gateway chart (CHECK 1).
  # main-fix: .22 -> .24 with the gateway chart (CHECK 1).
  # PCP-25635: .24 -> .29 with the gateway chart (CHECK 1).
  # PCP-25403: .29 -> .31 with the gateway chart (CHECK 1). This pin is what hands Data Planes the
  # narrowed public Gateway API route, so it has to move with the chart or a DP keeps being handed
  # the open one. Re-cut from .27 on the merge with main — see the gateway Chart.yaml comment.
  # PCP-25402: .31 -> .32 with the gateway chart (CHECK 1), same reasoning for the haProxy route.
  # PCP-25406: .32 -> .33 with the gateway chart (CHECK 1) -- the nginx public Ingress becomes an
  # allowlist by default. Re-cut from .26 on the merge with main; see the gateway Chart.yaml.
  #
  # ⭐ THE OPEN QUESTION THIS BLOCK USED TO CARRY IS SETTLED, and the answer is the one the code
  # said rather than the one the comments below say. A previous revision here recorded two readings
  # of whether a chart-default flip reaches an ALREADY-DEPLOYED CP-managed gateway, and refused to
  # pick. It is now answered from source (release-progress 0f86bfb): a Hub-driven upgrade
  # RE-RENDERS this recipe, so the new chart's defaults apply on upgrade. The flip DOES reach
  # existing CP-managed installs.
  #
  # That agrees with the code trace recorded in the previous revision -- the Hub never runs helm,
  # it PUTs this recipe to the CP orchestrator, and templates/mcp-gateway.yaml's `flags:` block
  # names only install / createNamespace / dependencyUpdate, so no values strategy is requested and
  # the DP provisioner-agent performs a plain upgrade. Two independent reads, same conclusion.
  #
  # ⚠️ WHAT IS STILL NOT MEASURED, so that this does not read as more settled than it is: the LIVE
  # upgrade proof is deferred to post-GA, because the prerelease guard blocks it on an alpha chart.
  # The residual risk is carried by the release note rather than by code -- an operator's hand-set
  # chartValuesYaml overlay merges AFTER this recipe and therefore persists across the upgrade, so
  # anyone who explicitly set nginxAllowlistEnabled: false keeps it. That is the intended
  # behaviour (a deliberate opt-out must survive), but it also means the flip does not reach an
  # install whose operator pinned the old value by hand.
  #
  # Pinning `nginxAllowlistEnabled: true` here is still deliberately NOT done, and the reason is
  # unchanged by the above: unlike an image tag it is a per-DATA-PLANE routing decision (it depends
  # on whether another Ingress shares that DP's gateway FQDN), while this recipe is per-CP and
  # installs onto every Data Plane in the subscription. A constant here would override and silently
  # win over the per-DP choice -- the failure mode the global.cp.routeResources comment in
  # templates/mcp-gateway.yaml records as measured on a live DP (PCP-23774). With the re-render
  # answer above, pinning is also unnecessary: the default reaches them on its own.
  # PCP-24759 (1.22 pin to main): .32 -> .35 with the gateway chart (CHECK 1).
  # PCP-26062 (2026-10-15): .35 -> .36, the published 1.22 CCRB candidate (CHECK 1).
  # PCP-26062 owner decision (2026-10-15): .36 -> .37 -- main ships its own content, not
  # the published artifact; moves with the gateway chart's own re-cut (CHECK 1).
  # 1.22.0 IMAGE SPRINT (PCP-24326): "1.22.0" -> "1.22.1" with the gateway chart (CHECK 1); image.tag below moves
  # "1.22.0" -> "1.22.1" with it, as every first-party gateway site does.
  # 1.22.2 SPIN (PCP-24326): "1.22.1" -> "1.22.2" with the gateway chart (CHECK 1); image.tag below moves
  # "1.22.1" -> "1.22.2" with it, as every first-party gateway site does.
  # PCP-26950: this chart version carries the change of main #11459: a FULL gateway on the OpenShift router or on a Gateway API TIER 2
  # controller no longer renders a public <pathPrefix>/servers route.
  # 1.22 RESPIN candidate 1 (PCP-27433): "1.22.3" -> "1.22.4-alpha.1" with the gateway chart (CHECK 1).
  # 1.22 RESPIN candidate 2 (PCP-27433): "1.22.4-alpha.1" -> "1.22.4-alpha.2" with the gateway chart (CHECK 1).
  # 1.22.4 GA (PCP-25657): "1.22.4-alpha.2" -> "1.22.4" with the gateway chart (CHECK 1).
  helmChartVersion: "1.22.4"
  image:
    # PCP-21327: this ONE tag drives ALL EIGHT first-party image sites in the emitted recipe
    # (templates/mcp-gateway.yaml) — lite, mcp-stack.mcpContextForge, mcp-stack.migration,
    # discovery, tibcoProxy, dialHome and the two global.tpMcpGateway.* mirrors. It must
    # advance together with mcpGateway.helmChartVersion above: `helm upgrade --reuse-values`
    # replays the previous release's COALESCED values, so the new chart's own image defaults
    # never take effect and an unpinned site stays on the OLD image. 1.21 moved the gateway's
    # serving port 80 -> 8880 in both the probes and the images, so a chart-1.21/images-1.20
    # split leaves the pod NotReady forever. dev/check-mcp-version-sync.sh CHECK 7 enforces
    # that every site the gateway chart declares is actually pinned by this recipe.
    # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the gateway image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
    # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
    # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
    # it names the same image under both tags (re-resolved in the registry).
    tag: "1.22.4"
    # PCP-23089: set by release-alpha alongside tag; empty = tag-only. Applies ONLY to the
    # three tp-mcp-gateway sites — the discovery / tibcoProxy / dialHome sidecars are separate
    # images and are pinned by tag alone (a shared digest would not resolve for them).
    digest: "sha256:e995b0a8ce9a2cbb77d2674f44360a2bc7a34393b1e28d146ccd52e75bf23294"
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # PCP-25386: literal, byte-for-byte copy of charts/tp-mcp-gateway/values.yaml's
  # `plugins.config` (the `&plugins_config` anchor that chart shares between lite and full
  # mode). `helm upgrade --reuse-values` freezes a gateway's plugin configuration at whatever
  # this recipe pinned -- or, before this fix, at nothing, so it froze at FIRST-INSTALL content
  # forever. The gateway chart's own plugins.config has already moved three times without this
  # recipe carrying any of it forward (PCP-25281 RateLimiter backend, PCP-25280 webhook guard,
  # PCP-25282 Summarizer allowlist -- see mcpGateway.helmChartVersion's .37 -> .38 comment
  # above), so none of those fixes ever reached an existing, Hub-upgraded gateway. Must move in
  # lockstep with mcpGateway.helmChartVersion whenever the gateway chart's plugins.config
  # changes; dev/check-mcp-version-sync.sh CHECK 8 enforces byte-identical content so drift
  # fails loud instead of shipping silently (the PCP-21327 image-tag pattern, applied here).
  pluginConfig: |
    plugin_dirs:
      - "plugins/native"
      - "plugins/custom"

    plugin_settings:
      parallel_execution_within_band: true
      plugin_timeout: 120
      fail_on_plugin_error: false
      enable_plugin_api: true
      plugin_health_check_interval: 120
      include_user_info: false

    plugins:
      # Rate limiter — cpex_rate_limiter pip package (Rust core). PCP-25281: `backend` is
      # injected PER MODE by the consuming template (lite: inline "memory"; full mode: the
      # mcp-stack.rateLimiterRedisBlock value, see the top of this file) -- "redis" where real
      # Redis is reachable (shares counters across replicas AND across a plugin
      # re-instantiation), "memory" where it is not (lite; full mode with no
      # Redis configured). Without a real backend, memory counters live in the plugin INSTANCE,
      # and a push on ANY VS of the gateway re-instantiates every plugin instance, silently
      # resetting every rate limit to zero -- that was the unconditional-memory bug.
      # PCP-22399: kind points at the fork-side ObservableRateLimiterPlugin wrapper
      # (subclasses the cpex_rate_limiter wheel, delegates 100% of enforcement) so a redis
      # backend that fails open to memory (e.g. a transient outage in full mode) becomes
      # observable — deduped WARNING + rate_limiter_degraded / rate_limiter_backend on the
      # tools/call _meta. An explicit `backend: "memory"` binding (lite; full mode with no
      # Redis) is a verbatim passthrough -- no degraded flag, no warning, nothing to observe,
      # since memory is the deliberately-configured backend there, not a fallback. Requires a
      # gateway image that carries the wrapper — first added in e20deb0d (PCP-22389); the
      # image tags below pin build wip-poc-1-0b9555a (a descendant that contains it).
      - name: "RateLimiterPlugin"
        kind: "plugins.rate_limiter.observable_rate_limiter.ObservableRateLimiterPlugin"
        description: "Per-user/tenant/tool rate limits"
        version: "0.0.6"
        hooks: ["prompt_pre_fetch", "tool_pre_invoke"]
        tags: ["limits", "throttle"]
        mode: "disabled"
        priority: 20
        conditions: []
        config:
          RATE_LIMITER_BACKEND_BLOCK_PLACEHOLDER
          by_user: "300/m"  # PCP-24390: was 60/m -- do not silently revert; by_tenant deliberately stays 600/m
          by_tenant: "600/m"
          by_tool:
            search: "10/m"

      # Secrets Detection — regex-based key/token detector
      - name: "SecretsDetection"
        kind: "plugins.secrets_detection.secrets_detection.SecretsDetectionPlugin"
        description: "Detects keys/tokens/secrets in inputs/outputs"
        version: "0.1.0"
        # PCP-20254: tool_pre_invoke added so secrets in tool INPUT args are scanned (cpex
        # dispatches only hooks declared here, so the method + this entry must ship together).
        # PCP-19884: per-VS model — base mode is "disabled" (loaded-but-inert, no global
        # security floor). Enforcement is opt-in PER VIRTUAL SERVER (and per VS-tool) via a
        # Hub plugin binding, which gateway_plugin_manager._merge_tenant_config activates per
        # context and _apply_security_floor then pins to blocking/fail-closed. A base-disabled,
        # unbound plugin is left OFF (the floor never force-enables it).
        # OPERATOR NOTE: to restore the GLOBAL always-on floor instead, set mode "enforce" with
        # conditions: [] — that + the PCP-20184 floor = blocking and non-downgradable on every
        # VS. To soften a global floor, use "permissive", or turn off a broad detector (e.g.
        # base64_24) under config.enabled below.
        hooks: ["prompt_pre_fetch", "tool_pre_invoke", "tool_post_invoke", "resource_post_fetch"]
        tags: ["security", "secrets", "dlp"]
        mode: "disabled"
        priority: 51
        conditions: []
        config:
          enabled:
            aws_access_key_id: true
            aws_secret_access_key: true
            google_api_key: true
            slack_token: true
            private_key_block: true
            jwt_like: true
            hex_secret_32: true
            base64_24: true
          redact: false
          redaction_text: "***REDACTED***"
          block_on_detection: true
          min_findings_to_block: 1

      # Post-ingestion write interlock (PCP-24140) — turns read/write separation from a
      # deployment pattern into an enforced request-path control that leaves evidence.
      # Once a principal has ingested content from a declared untrusted SOURCE tool, it may
      # call a declared WRITE tool only if that source's allowlist permits it.
      #
      # NO ARGUMENT VALUE IS EVER COMPARED — the decision inputs are tool identity and
      # ingestion history, which is what makes it immune to value splitting, re-encoding and
      # canonicalisation gaps. Scope is SAME-PRINCIPAL: an enforced separation interlock with
      # evidence, NOT general prompt-injection containment, and it does not close GhostJacking
      # (the RCE leg never traverses the gateway).
      #
      # Ships INERT: `sources` and `write_tools` are empty, so the plugin short-circuits and
      # gates nothing until an operator classifies their tools. mode "disabled" is the per-VS
      # opt-in model (same as SecretsDetection above): enforcement comes from a Hub plugin
      # binding, which _merge_tenant_config activates per context and _apply_security_floor
      # then pins to blocking/fail-closed.
      #
      # ⚠️ A per-VS binding CAN replace these lists (the tenant merge is a shallow
      # {**base, **override} and no config-floor stripper is registered for this class).
      # Harmless while the base is empty — the binding IS the enforcement — but do not add a
      # global baseline here and assume a binding cannot undo it.
      - name: "SessionWriteGate"
        kind: "plugins.session_write_gate.session_write_gate.SessionWriteGatePlugin"
        description: "Deny a declared write tool after the principal ingested from a declared untrusted source, unless that source permits it"
        version: "0.1.0"
        hooks: ["tool_pre_invoke", "tool_post_invoke"]
        tags: ["security", "provenance", "write-gate"]
        mode: "disabled"
        priority: 45
        conditions: []
        config:
          sources: {}
          write_tools: []
          additional_sources: {}
          additional_write_tools: []
          # taint_ttl_seconds is deliberately NOT restated here. 1800 is
          # SessionWriteGateConfig's own default (plugins/session_write_gate/
          # session_write_gate.py) and nothing reconciles a copy in this file against it, so
          # pinning it would drift silently the day the model default moves. The Hub's plugin
          # form still offers the key, and a per-VS binding can still set it.

      # Output Length Guard — truncate oversized tool outputs
      - name: "OutputLengthGuardPlugin"
        kind: "plugins.output_length_guard.output_length_guard.OutputLengthGuardPlugin"
        description: "Guards tool outputs by enforcing max length"
        version: "0.1.0"
        hooks: ["tool_post_invoke"]
        tags: ["guard", "length", "outputs", "truncate"]
        mode: "enforce"
        priority: 160
        conditions: []
        config:
          min_chars: 0
          max_chars: 15000
          strategy: "truncate"
          ellipsis: "..."

      # Safe HTML Sanitizer — strip XSS vectors
      - name: "SafeHTMLSanitizer"
        kind: "plugins.safe_html_sanitizer.safe_html_sanitizer.SafeHTMLSanitizerPlugin"
        description: "Sanitize HTML to remove XSS vectors"
        version: "0.1.0"
        hooks: ["resource_post_fetch"]
        tags: ["security", "html", "xss", "sanitize"]
        mode: "enforce"
        priority: 119
        conditions: []
        config:
          allowed_tags:
            - a
            - p
            - div
            - span
            - strong
            - em
            - code
            - pre
            - ul
            - ol
            - li
            - h1
            - h2
            - h3
            - h4
            - h5
            - h6
            - blockquote
            - img
            - br
            - hr
            - table
            - thead
            - tbody
            - tr
            - th
            - td
            # PCP-25290/gw#7e16c8773c: kept (not unwrapped) so a bound HTMLToMarkdown can
            # still promote <title> into a heading -- an explicit allowed_tags list overrides
            # the code default rather than extending it, so omitting this here left the code
            # fix (DEFAULT_ALLOWED_TAGS) with no effect on chart deployments, same class as
            # PCP-19889 below.
            - title
          # PCP-19889: keep allowed_attrs in sync with code DEFAULT_ALLOWED_ATTRS so
          # the deployed default does not silently drop table/th/td layout attributes
          # (config overrides the code default, so an omitted key = dropped attr).
          allowed_attrs:
            "*": ["id", "class", "title", "alt"]
            a: ["href", "rel", "target"]
            img: ["src", "width", "height", "alt", "title"]
            table: ["border", "cellpadding", "cellspacing", "summary"]
            th: ["colspan", "rowspan"]
            td: ["colspan", "rowspan"]
          remove_comments: true
          drop_unknown_tags: true
          strip_event_handlers: true
          sanitize_css: true
          allow_data_images: false
          remove_bidi_controls: true
          to_text: false

