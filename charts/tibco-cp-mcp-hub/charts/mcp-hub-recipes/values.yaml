      - name: RetryWithBackoffPlugin
        kind: cpex_retry_with_backoff.RetryWithBackoffPlugin
        description: Detects transient failures and asks the gateway to re-invoke the tool after a jittered exponential backoff delay
        version: 0.1.0
        author: Mihai Criveti
        hooks:
        - tool_post_invoke
        tags:
        - retry
        - backoff
        - resilience
        mode: disabled
        priority: 170
        conditions: []
        config:
          max_retries: 2
          backoff_base_ms: 200
          max_backoff_ms: 5000
          retry_on_status:
          - 429
          - 500
          - 502
          - 503
          - 504
          jitter: true
          check_text_content: false
          tool_overrides: {}
      - name: EncodedExfilDetector
        # PCP-21038: point at the bare cpex_encoded_exfil_detection wheel. The v1.0.4+ wheel recurses
        # into CopyOnWriteDict natively, so the old in-repo cow_compat compat wrapper was deleted from
        # the gateway image (gateway PR #121 / PCP-20589 / PCP-20883). The chart config kind must match
        # the image's module layout, else the plugin fails to load and the security-floor errors every call.
        kind: cpex_encoded_exfil_detection.EncodedExfilDetectorPlugin
        description: Detects suspicious encoded exfiltration patterns in prompts, tool outputs, and resources
        version: 0.2.0
        author: Mihai Criveti
        hooks:
        - prompt_pre_fetch
        - tool_post_invoke
        - resource_post_fetch
        tags:
        - security
        - exfiltration
        - dlp
        - encoding
        mode: disabled  # PCP-19885: per-VS opt-in only (no global floor) — enforcement comes from a Hub VS-level binding
        priority: 52
        conditions: []
        config:
          enabled:
            base64: true
            base64url: true
            hex: true
            percent_encoding: true
            escaped_hex: true
          min_encoded_length: 24
          min_decoded_length: 12
          min_entropy: 3.3
          min_printable_ratio: 0.7
          min_suspicion_score: 3
          max_scan_string_length: 200000
          max_findings_per_value: 50
          redact: false
          redaction_text: '***ENCODED_REDACTED***'
          block_on_detection: true
          min_findings_to_block: 1
          include_detection_details: true
          allowlist_patterns: []
          extra_sensitive_keywords: []
          extra_egress_hints: []
          max_decode_depth: 2
          max_recursion_depth: 32
          log_detections: true
      - name: VirusTotalURLCheckerPlugin
        kind: plugins.virus_total_checker.virus_total_checker.VirusTotalURLCheckerPlugin
