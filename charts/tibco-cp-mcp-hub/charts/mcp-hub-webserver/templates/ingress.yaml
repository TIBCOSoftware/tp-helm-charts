{{- if and (eq (.Values.global.tibco.mcpHub.mode | default "cp") "standalone") .Values.ingress.enabled }}
#
# Standalone-only routing (PCP-19630). In CP mode the Hub is fronted by the
# TibcoRoute (mcp-hub-webserver-tibcoroute.yaml); standalone has no Control
# Plane router, so a plain k8s Ingress serves the SPA + API at the ingress root.
# Gated on mode=standalone AND ingress.enabled so it never renders for CP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-hub-webserver.consts.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-hub-webserver.shared.labels.standard" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.tls.enabled=true" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled=true" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-hub-webserver.consts.appName" . }}
                port:
                  number: {{ .Values.backend.port }}
      {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
{{- end }}
