{{- /*
  At-rest encryption key for the Hub — MCPHUB_SECRET_KEY (AES-256-GCM,
  backend/src/crypto.ts). The backend fails CLOSED in CP mode when this key is
  absent (PCP-20163), so the chart MUST deliver it. When the operator does NOT
  supply config.secretKey.existingSecret, auto-generate a STRONG key here so the
  Hub boots secure-by-default — never a committed literal (PCP-20163 SA-02a) and
  never the insecure dev fallback.

  Idempotent: reuse the value already in the cluster Secret IF it is already strong
  (>= 32 chars) — so a helm UPGRADE never rotates the key. Rotating MCPHUB_SECRET_KEY
  would make every stored enc:v1/enc:v2 OAuth secret undecryptable, so stability is
  load-bearing here. Else mint a fresh randAlphaNum 40 (first install). `lookup` is
  empty during `helm template`/dry-run (renders a fresh value); a real install/upgrade
  reads the cluster, so the value is stable in practice.

  (PCP-20165 validate-system finding: the PCP-20163 chart change dropped the committed
  literal + added the existingSecret knob but never produced the Secret, so a fresh CP
  deploy of the guarded image fail-closed. Mirrors the gateway SA-16 secret-gen.)
*/}}
{{- if not .Values.config.secretKey.existingSecret }}
{{- $secretName := printf "%s-encryption-key" (include "mcp-hub-webserver.consts.appName" .) }}
{{- $keyField := .Values.config.secretKey.key | default "MCPHUB_SECRET_KEY" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $prev := "" }}
{{- if and $existing $existing.data (index $existing.data $keyField) }}
{{- $prev = (index $existing.data $keyField | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mcp-hub-webserver.shared.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
{{- if ge (len $prev) 32 }}
  {{ $keyField }}: {{ $prev | quote }}
{{- else }}
  {{ $keyField }}: {{ randAlphaNum 40 | quote }}
{{- end }}
{{- end }}
{{- /*
  Bootstrap API key for the public /v1/ routes (PCP-19949). Auto-generates a
  mchub_<random> value on first install and reuses the stable cluster value on
  upgrades (lookup idempotency — same pattern as the encryption key above).
  Skipped when the operator supplies config.bootstrapApiKey.existingSecret.
*/}}
{{- if not .Values.config.bootstrapApiKey.existingSecret }}
{{- $bkSecretName := printf "%s-bootstrap-api-key" (include "mcp-hub-webserver.consts.appName" .) }}
{{- $bkField := .Values.config.bootstrapApiKey.key | default "MCPHUB_BOOTSTRAP_API_KEY" }}
{{- $bkExisting := (lookup "v1" "Secret" .Release.Namespace $bkSecretName) }}
{{- $bkPrev := "" }}
{{- if and $bkExisting $bkExisting.data (index $bkExisting.data $bkField) }}
{{- $bkPrev = (index $bkExisting.data $bkField | b64dec) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $bkSecretName }}
  labels:
    {{- include "mcp-hub-webserver.shared.labels.standard" . | nindent 4 }}
type: Opaque
stringData:
{{- if hasPrefix "mchub_" $bkPrev }}
  {{ $bkField }}: {{ $bkPrev | quote }}
{{- else }}
  {{ $bkField }}: {{ printf "mchub_%s" (randAlphaNum 43) | quote }}
{{- end }}
{{- end }}
