{{- /*
  [PCP-25111] Replace an ACCIDENTAL nil pointer with a DELIBERATE, legible refusal.

  ⛔ DO NOT "fix" this by making the read nil-safe and letting the render continue.
  That was this change's first attempt and dev/mcp-hub-render-tests/platform-gateway-assert.sh
  section F caught it: with the key absent the render then succeeded and emitted SIX
  tp-mcp-gateway manifests. Helm IGNORES a dependency `condition:` whose path does not
  resolve, so an absent key ENABLES the subchart -- and the direct read here crashing is
  the only thing that currently makes that loud instead of silent. A nil-safe read turns
  "every existing CP grows a gateway on its next upgrade" back into a silent outcome.

  ⇒ So the guard stays. What changes is that it now says what is wrong.

  WHAT GOES WRONG WITHOUT THIS. `helm upgrade --reuse-values` 1.21 -> 1.22 re-coalesces the
  stored user values against the OLD chart's schema. On 1.21, `global.tibco.mcpHub` is
  declared ONLY in the mcp-hub-webserver subchart (the parent declares it zero times, and
  `platformGateway` appears nowhere in that chart). That materialises an `mcpHub` map which
  EXISTS but carries no `platformGateway` key, and because the map exists it shadows this
  chart's default rather than falling through to it. Observed on a real upgrade:
  `nil pointer evaluating interface {}.enabled`, at this file, in ~0.2s -- an error that
  names neither the flag that caused it nor the value that would fix it.

  ⚠️ `--reuse-values` is a first-class Helm upgrade path and this repo's own CLAUDE.md
  recommends it for upgrades, so operators reach this by following our own guidance.
*/}}
{{- $pgwDeclared := false }}
{{- $pgw := false }}
{{- if .Values.global }}{{- if .Values.global.tibco }}{{- if .Values.global.tibco.mcpHub }}{{- if kindIs "map" .Values.global.tibco.mcpHub }}{{- if hasKey .Values.global.tibco.mcpHub "platformGateway" }}
{{- $pgwDeclared = true }}
{{- $pgw = (.Values.global.tibco.mcpHub.platformGateway).enabled | default false }}
{{- end }}{{- end }}{{- end }}{{- end }}{{- end }}
{{- if not $pgwDeclared }}
{{- fail "global.tibco.mcpHub.platformGateway.enabled is not set, and Helm ENABLES a dependency whose condition path does not resolve -- so leaving it unset would install the in-CP platform gateway rather than skip it. Declaring it false is what disables the feature; deleting or shadowing the key is not. If you reached this from `helm upgrade --reuse-values` on a release created by a chart older than 1.22, the reused values carry a global.tibco.mcpHub map with no platformGateway key, which shadows this chart's default: re-run with `-f <your-values>` instead of --reuse-values, or add `--set global.tibco.mcpHub.platformGateway.enabled=false`." }}
{{- end }}
{{- if $pgw }}
{{- /*
  [PCP-24484] Bootstrap token for the PLATFORM GATEWAY (the gateway this CP install
  creates inside its own cluster).

  ---------------------------------------------------------------------------
  WHY A CHART-GENERATED TOKEN IS CORRECT HERE, WHEN THE GATEWAY CHART SAYS NEVER
  ---------------------------------------------------------------------------
  charts/tp-mcp-gateway/values.yaml says the bootstrap token is "NEVER chart-generated",
  and for the flow it describes that is right. The rule is CONDITIONAL, and the condition
  is about who writes the matching hash, not about who generates the value:

    Chart-generating a bootstrap token is INERT unless something writes the matching
    hash onto the gateway's row. In the standalone flow nothing does -- the mint API is
    the only writer of `gateways.bootstrap_token_hash` -- so the prohibition holds
    unconditionally there. The in-CP placement HAS such a writer: the Hub's boot-time
    platform-gateway reconciler, whose job is exactly "hash the mounted Secret onto the
    row". Chart generates, reconciler hashes, agent presents, the equality holds.

  The Hub verifies by comparing sha256(presented secret) against that column. Nothing in
  that path requires the Hub to have generated the value.

  ---------------------------------------------------------------------------
  ONE RANDOM, ONE VALUE -- and why this template deliberately stores only one key
  ---------------------------------------------------------------------------
  The wire format is `<gatewayId>.<secret>`: the Hub splits on the FIRST dot, looks the
  row up by the left half, and hashes only the right half.

  A chart that stored the bare secret for the Hub and the prefixed token for the agent
  would render fine, pass every template test, and then fail on a real cluster the moment
  the two drifted -- so this template stores exactly ONE value, the full token, and BOTH
  consumers read the same Secret key. The Hub does its own split (it already parses this
  format). There is no second value that can disagree with the first.

  `platform` below is the settled gateway id, and it is intentionally NOT a chart value.
  It must equal the primary key of the row the reconciler upserts; a knob here could only
  ever be set to something that breaks authentication, and it would break it in the way
  that is hardest to diagnose (see below).

  ---------------------------------------------------------------------------
  THREE WAYS TO GET THIS WRONG, ALL OF WHICH LOOK IDENTICAL
  ---------------------------------------------------------------------------
  On the Hub side, "the lookup here IS the authentication" -- the row is found by
  (id, region) and the hash compared in the same step. So every one of these presents to
  the operator as one generic authentication failure, with a perfectly valid token:
    1. the token's left half is not the PK of the row that was upserted;
    2. the hash was written outside UTM (the column is encrypted at rest, so a raw-SQL
       writer stores something that decrypts into garbage);
    3. the row was not stamped with this pod's region (the auth lookup is region-scoped,
       and this one works fine in a single-region deployment).
  Revocation is a fourth. Keep this list with the code: the rule says what to do, this
  says what you will see when it is wrong, and the four are indistinguishable at the
  symptom.

  ---------------------------------------------------------------------------
  IDEMPOTENCE
  ---------------------------------------------------------------------------
  Same pattern as the gateway chart's lite-secret.yaml: reuse the value already in the
  cluster, mint only when there is none. So `helm upgrade` never rotates the token behind
  a running gateway, and `resource-policy: keep` means the credential outlives the release
  -- which is what makes the disposable-database rollback rule safe: wipe the Hub's DB,
  let the reconciler re-hash THIS token, and the gateway reconnects without re-enrolment.

  NOTE: `lookup` returns nothing during `helm template` / client dry-run, so a rendered
  manifest carries a fresh random every time. A template-level test therefore CANNOT
  assert that the Hub and the agent receive the same value -- every render mints a
  different one, so such an assertion is vacuous or flaky. The assertable invariant is
  that both consumers reference the same Secret NAME and KEY; value identity is a
  real-cluster check.
*/}}
{{- $gw := index .Values "tp-mcp-gateway" }}
{{- $secretName := $gw.dialHome.hub.bootstrapTokenSecret.name }}
{{- $secretKey := $gw.dialHome.hub.bootstrapTokenSecret.key }}
{{- /*
  Read from the SUBCHART's own values rather than restating the name here: this is the
  one copy Helm genuinely forces (a subchart cannot read a parent value, and a values
  file cannot interpolate .Release.Name, which is why the name is fixed rather than
  release-prefixed). Reading it back means the creator and the consumer cannot disagree.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $existingData := (and $existing $existing.data) | default dict }}
{{- $prev := index $existingData $secretKey | default "" | b64dec }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # Survive helm uninstall / GitOps prune. The gateway holds this credential in its own
    # namespace and the Hub only holds a HASH of it -- losing the Secret means the gateway
    # can never re-authenticate, and there is nothing to recover it from.
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: platform-gateway
type: Opaque
stringData:
  {{- if $prev }}
  {{ $secretKey }}: {{ $prev | quote }}
  {{- else }}
  {{ $secretKey }}: {{ printf "platform.%s" (randAlphaNum 40) | quote }}
  {{- end }}
{{- end }}
