apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tibcohub.consts.appName" . }}-client-cred-creation-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: backstage
    {{- include "tibcohub.platform.commonLabels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 18000 #cleanup after 5hr
  template:
    metadata:
      name: {{ include "tibcohub.consts.appName" . }}-client-cred-creation
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        networking.platform.tibco.com/internet-web-egress: enable
        networking.platform.tibco.com/kubernetes-api: enable
        # This label is used by the network policy to allow traffic to access control Plane, when createInternetScopePolicy is disabled
        networking.platform.tibco.com/cp-egress: enable
        {{- include "tibcohub.platform.commonLabels" . | nindent 8 }}
    spec:
      {{ if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ .Values.global.cp.resources.serviceaccount.serviceAccountName }}
      containers:
        - name: tibco-developer-hub-pre-install-job
          image: {{ include "backstage.image.registry" .}}{{"/"}}{{ include "backstage.image.repository" .}}{{"/"}}{{ .Values.image.name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          {{- if .Values.global.cp.enableResourceConstraints }}
          {{- with .Values.job.resources }}
          resources:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- end }}
          args:
            - configure
            - -i
            - {{ .Values.global.cp.secrets.iat }}
            - -o
            - "https://{{ .Values.global.cp.cpHostname}}"
            - -s
            - {{ include "tibcohub.consts.outputSecretName" .}}
            - -g
            - authorization_code
            - -p
            - {{ .Values.ingress.pathPrefix }}
            - -d
            {{- if .Values.global.cp.resources.gatewayapi.gatewayHostOrDomainName }}
            - "https://{{ .Values.global.cp.resources.gatewayapi.gatewayHostOrDomainName }}"
            {{- else }}
            - "https://{{ .Values.global.cp.resources.ingress.fqdn }}"
            {{- end }}
            - -c
            - {{ .Values.ingress.pathPrefix }}/api/auth/tibco-control-plane/handler/frame
            - -l
            - {{ .Values.ingress.pathPrefix }}/api/oidc/backchannel-logout
          env:
            - name: DATAPLANE_ID
              value: {{ .Values.global.cp.dataplaneId }}
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: INSTANCE_ID
              value: {{ .Values.global.cp.instanceId }}
            - name: CP_DOMAIN
              value: {{ include "tibcohub.cp.domain" . }}
          volumeMounts:
            - name: logs
              mountPath: /tmp/logs
      {{- if .Values.global.cp.containerRegistry.secret }}
      imagePullSecrets:
        - name: {{ .Values.global.cp.containerRegistry.secret }} {{/* optional imagePullSecret for private repo. no op if secret does not exist */}}
      {{- end }}
      volumes:
        - name: logs
          emptyDir: {}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tibcohub.consts.appName" . }}-client-cred-deletion-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: backstage
    {{- include "tibcohub.platform.commonLabels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  ttlSecondsAfterFinished: 18000  #cleanup after 5hr
  backoffLimit: 2
  template:
    metadata:
      name: {{ include "tibcohub.consts.appName" . }}-client-cred-secret-deletion
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        networking.platform.tibco.com/internet-web-egress: enable
        networking.platform.tibco.com/kubernetes-api: enable
        # This label is used by the network policy to allow traffic to access control Plane, when createInternetScopePolicy is disabled
        networking.platform.tibco.com/cp-egress: enable
        {{- include "tibcohub.platform.commonLabels" . | nindent 8 }}
    spec:
      {{ if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ .Values.global.cp.resources.serviceaccount.serviceAccountName }}
      containers:
        - name: tibco-developer-hub-pre-delete-job
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "backstage.image.registry" .}}{{"/"}}{{ include "backstage.image.repository" .}}{{"/"}}{{ .Values.image.name }}:{{ .Values.image.tag }}
          volumeMounts:
            - name: logs
              mountPath: /tmp/logs
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.global.cp.enableResourceConstraints }}
          {{- with .Values.job.resources }}
          resources:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- end }}
          args:
            - delete
            - -s
            - {{ include "tibcohub.consts.outputSecretName" .}}
          env:
            - name: DATAPLANE_ID
              value: {{ .Values.global.cp.dataplaneId }}
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            - name: INSTANCE_ID
              value: {{ .Values.global.cp.instanceId }}
            - name: CP_DOMAIN
              value: {{ include "tibcohub.cp.domain" . }}
      {{- if .Values.global.cp.containerRegistry.secret }}
      imagePullSecrets:
        - name: {{ .Values.global.cp.containerRegistry.secret }} {{/* optional imagePullSecret for private repo. no op if secret does not exist */}}
      {{- end }}
      volumes:
        - name: logs
          emptyDir: {}

{{ if and (.Values.postgresql.enabled) (.Values.global.cp.resources.storage) (.Values.global.cp.resources.storage.storageClassName) -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tibcohub.consts.appName" . }}-data-backup-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: backstage
    {{- include "tibcohub.platform.commonLabels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600 # fail (rather than hang the whole helm upgrade) if the backup runs longer than 1h
  ttlSecondsAfterFinished: 18000 #cleanup after 5hr
  template:
    metadata:
      name: {{ include "tibcohub.consts.appName" . }}-data-backup
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        # Required so the backup job's kubectl calls can reach the Kubernetes API server through the namespace deny-all network policy
        networking.platform.tibco.com/kubernetes-api: enable
        {{- include "tibcohub.platform.commonLabels" . | nindent 8 }}
    spec:
      {{ if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ .Values.global.cp.resources.serviceaccount.serviceAccountName }}
      containers:
        - name: data-backup-job
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "backstage.postgresql.databaseSecretName" . }}
                  key: postgres-password
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "backstage.image.registry" .}}{{"/"}}{{ include "backstage.image.repository" .}}{{"/"}}{{ .Values.kubectl.image.name }}:{{ .Values.kubectl.image.tag }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              NAMESPACE={{ .Release.Namespace }}
              DEPLOYMENT_NAME={{ include "common.names.fullname" . }}
              TARGET_TAG={{ .Values.postgresql.image.tag }}
              TARGET_PG_MAJOR={{ .Values.postgresql.image.version }}
              TARGET_BACKSTAGE={{ .Values.backstageVersion }}
              # Discover the current PostgreSQL pod. It is required for every decision below, so abort if it is missing rather than risk a destructive action against nothing.
              POD_NAME=$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=postgresql -o jsonpath="{.items[0].metadata.name}")
              if [ -z "$POD_NAME" ]; then echo "ERROR: no PostgreSQL pod found in $NAMESPACE; aborting before any destructive action."; exit 1; fi
              CUR_TAG_POSTGRES=$(kubectl get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath='{.spec.containers[0].image}' | awk -F: '{print $NF}')
              # Discover the current Backstage version from the running Dev Hub pod ONLY.
              # Do NOT read it from the Deployment spec: during an upgrade the Deployment already carries the NEW chart's BACKSTAGE_VERSION, which would mask a real version change and skip a needed backup.
              DEVHUB_POD_NAME=$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=tibco-developer-hub,app.kubernetes.io/component=backstage -o jsonpath="{.items[0].metadata.name}")
              if [ -z "$DEVHUB_POD_NAME" ]; then echo "ERROR: no running Dev Hub pod found; cannot read the current Backstage version. Aborting the upgrade so a needed backup is never skipped."; exit 1; fi
              BACKSTAGE_CUR_VERSION=$(kubectl exec -n "$NAMESPACE" -c backstage-backend "$DEVHUB_POD_NAME" -- sh -c 'printenv BACKSTAGE_VERSION || true' 2>/dev/null || true)
              if [ -z "$BACKSTAGE_CUR_VERSION" ]; then echo "ERROR: could not read BACKSTAGE_VERSION from the running Dev Hub pod $DEVHUB_POD_NAME. Aborting the upgrade so a needed backup is never skipped."; exit 1; fi
              # Rollback/downgrade guard: never overwrite newer data with a backup when moving to an older version.
              PG_ROLLBACK=$(awk -v c="$CUR_TAG_POSTGRES" -v t="$TARGET_TAG" 'BEGIN{n=split(c,ca,".");m=split(t,ta,".");k=(n>m?n:m);for(i=1;i<=k;i++){x=ca[i]+0;y=ta[i]+0;if(x>y){print "yes";exit}else if(x<y){print "no";exit}}print "no"}')
              BS_ROLLBACK=$(awk -v c="$BACKSTAGE_CUR_VERSION" -v t="$TARGET_BACKSTAGE" 'BEGIN{if(c==""){print "no";exit}n=split(c,ca,".");m=split(t,ta,".");k=(n>m?n:m);for(i=1;i<=k;i++){x=ca[i]+0;y=ta[i]+0;if(x>y){print "yes";exit}else if(x<y){print "no";exit}}print "no"}')
              if [ "$PG_ROLLBACK" = "yes" ] || [ "$BS_ROLLBACK" = "yes" ]; then echo "Detected a rollback/downgrade (PostgreSQL tag $CUR_TAG_POSTGRES -> $TARGET_TAG; Backstage $BACKSTAGE_CUR_VERSION -> $TARGET_BACKSTAGE). Skipping backup and scale-down."; exit 0; fi
              # Decide whether a backup is actually required, comparing live versions against the target chart values.
              CUR_PG_MAJOR=$(kubectl exec -n "$NAMESPACE" -c postgresql "$POD_NAME" -- postgres --version | awk '{print $NF}' | awk -F'.' '{print $1}')
              NEED_BACKUP=false
              if [ "$CUR_PG_MAJOR" != "$TARGET_PG_MAJOR" ]; then echo "PostgreSQL major version change detected ($CUR_PG_MAJOR -> $TARGET_PG_MAJOR)."; NEED_BACKUP=true; fi
              if [ "$CUR_TAG_POSTGRES" != "$TARGET_TAG" ]; then echo "PostgreSQL image tag change detected ($CUR_TAG_POSTGRES -> $TARGET_TAG)."; NEED_BACKUP=true; fi
              if [ "$BACKSTAGE_CUR_VERSION" != "$TARGET_BACKSTAGE" ]; then echo "Backstage version change detected ($BACKSTAGE_CUR_VERSION -> $TARGET_BACKSTAGE)."; NEED_BACKUP=true; fi
              if [ "$NEED_BACKUP" != "true" ]; then echo "No PostgreSQL/Backstage change requiring a backup. Nothing to do."; exit 0; fi
{{ if .Values.autoscaling.enabled }}
              # Remove the HPA first so it cannot scale the Deployment back up mid-backup; Helm recreates it after the pre-upgrade hooks complete. Non-fatal if RBAC disallows it.
              kubectl delete hpa {{ include "common.names.fullname" . }} -n "$NAMESPACE" --ignore-not-found || echo "WARNING: could not delete HPA; it may scale the Deployment back up during the backup."
{{ end }}
              # Quiesce writers so nothing writes to the database during the backup.
              kubectl scale deployment/"$DEPLOYMENT_NAME" --replicas=0 -n "$NAMESPACE"
              # Back up safely: dump FIRST to a temp file, verify it is non-empty, promote it, and only THEN remove the target data directory so a fresh restore can run. If the dump fails, set -e aborts the job before anything is deleted.
              kubectl exec -n "$NAMESPACE" -c postgresql "$POD_NAME" -- env PGPASSWORD="$PGPASSWORD" bash -c 'set -e; rm -f /bitnami/postgresql/data_backup.sql.tmp; rm -rf /bitnami/postgresql/restore_running; PGPASSWORD="$PGPASSWORD" pg_dumpall -U postgres > /bitnami/postgresql/data_backup.sql.tmp; if [ ! -s /bitnami/postgresql/data_backup.sql.tmp ]; then echo "ERROR: pg_dumpall produced an empty backup"; exit 1; fi; mv -f /bitnami/postgresql/data_backup.sql.tmp /bitnami/postgresql/data_backup.sql; rm -rf {{ .Values.postgresql.postgresqlDataDir }}'
              echo "Backup verified and target data directory {{ .Values.postgresql.postgresqlDataDir }} prepared for restore."
          {{- if .Values.global.cp.enableResourceConstraints }}
          {{- with .Values.backupJob.resources }}
          resources:
            {{- toYaml . | nindent 12}}
          {{- end }}
          {{- end }}
      {{- if .Values.global.cp.containerRegistry.secret }}
      imagePullSecrets:
        - name: {{ .Values.global.cp.containerRegistry.secret }}
      {{- end }}
{{- end }}
