apiVersion: v1
kind: Service
metadata:
  name: {{ include "mftadapter.fullname" . }}
  labels:
    {{- include "mftadapter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "mftadapter.selectorLabels" . | nindent 4 }}
