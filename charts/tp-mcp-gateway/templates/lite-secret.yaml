{{- if .Values.lite.enabled }}
{{- /*
  Idempotent strong-secret generation (PCP-20165 SA-16). For the sensitive keys we
  must NEVER ship a weak static default. Resolution per key:
    1. an operator-supplied non-empty value in values always wins;
    2. else reuse the value already in the cluster Secret IF it is already strong
       (>= 32 chars) — so a normal upgrade does not rotate it;
    3. else mint a fresh strong random — covers a first install AND a migration from a
       previously-shipped weak value (len < 32 → regenerated, so the now-active
       REQUIRE_STRONG_SECRETS gate does not reject a reused weak secret on upgrade).
  NOTE: `lookup` is empty during `helm template`/client dry-run, so those render a
  fresh random each time; real install/upgrade reads the cluster (idempotent).
*/}}
{{- /*
  PCP-22913: the lookup must be MODE-INVARIANT.

  The guard above keys on (namespace, secretName), and secretName embeds the MODE:
  lite renders "<release>-mcp-gateway-secret", full renders
  "<release>-mcp-stack-gateway-secret". A lite<->full switch therefore looks past a
  perfectly good secret, misses, and mints a fresh AUTH_ENCRYPTION_SECRET.

  That key is not like the other four: it is the only one guarding PERSISTED
  state. The gateway database is external and outlives the release, so re-minting
  orphans everything encrypted under the old key -- tool headers become
  undecryptable and their rows unrecoverable through the API (PCP-22913). The
  other four are transient and self-heal.

  So: check this mode's name, then the sibling mode's, and only then generate.
*/}}
{{- $secretName := printf "%s-mcp-gateway-secret" .Release.Name }}
{{- $siblingName := printf "%s-mcp-stack-gateway-secret" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- if not $existing }}
{{- $existing = (lookup "v1" "Secret" .Release.Namespace $siblingName) }}
{{- end }}
{{- $existingData := (and $existing $existing.data) | default dict }}
{{- $generate := list "JWT_SECRET_KEY" "AUTH_ENCRYPTION_SECRET" "PLATFORM_ADMIN_PASSWORD" "BASIC_AUTH_PASSWORD" "DEFAULT_USER_PASSWORD" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # PCP-22913: survive helm uninstall / GitOps prune. The external database
    # outlives the release; losing this key orphans every encrypted row in it.
    # Mirrors what this chart's redis-TLS secret already does.
    helm.sh/resource-policy: keep
  labels:
    {{- include "tp-mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.lite.secret }}
  {{- if and (has $key $generate) (not $val) }}
  {{- $prev := index $existingData $key | default "" | b64dec }}
  {{- if ge (len $prev) 32 }}
  {{ $key }}: {{ $prev | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 40 | quote }}
  {{- end }}
  {{- else }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
{{- end }}
