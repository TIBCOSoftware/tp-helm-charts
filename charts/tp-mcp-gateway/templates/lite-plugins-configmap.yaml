{{- if and .Values.lite.enabled .Values.plugins.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mcp-gateway-plugins
  labels:
    {{- include "tp-mcp-gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- /* PCP-25281: lite never has a Redis service -- always the explicit memory backend. */}}
    {{- .Values.plugins.config | replace "RATE_LIMITER_BACKEND_BLOCK_PLACEHOLDER" "backend: \"memory\"" | nindent 4 }}
{{- end }}
