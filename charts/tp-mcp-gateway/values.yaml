        # PCP-21038: point at the bare cpex_encoded_exfil_detection wheel. The v1.0.4+ wheel recurses
        # into CopyOnWriteDict natively, so the old in-repo cow_compat compat wrapper was deleted from
        # the gateway image (gateway PR #121 / PCP-20589 / PCP-20883). The chart config kind must match
        # the image's module layout, else the plugin fails to load and the security-floor errors every call.
        kind: cpex_encoded_exfil_detection.EncodedExfilDetectorPlugin
        description: Detects suspicious encoded exfiltration patterns in prompts, tool outputs, and resources
        version: 0.2.0
        author: Mihai Criveti
        hooks:
        - prompt_pre_fetch
        - tool_post_invoke
        - resource_post_fetch
        tags:
        - security
        - exfiltration
        - dlp
