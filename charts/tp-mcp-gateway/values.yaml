# TIBCO Platform MCP Gateway — default values
#
# Two deployment modes — enable EXACTLY ONE (a render-time guard,
# templates/mode-validate.yaml, rejects both-on and both-off; PCP-20562):
#   Full (default): mcp-stack sub-chart with PostgreSQL + Redis
#                   (mcp-stack.enabled=true, lite.enabled=false)
#   Lite:           Single pod with SQLite + memory cache
#                   (lite.enabled=true AND mcp-stack.enabled=false; lite.replicas must be 1)
#
# Plugins are defined ONCE via YAML anchor and shared by both modes.

# -- DP identification (must be set per deployment)
dpName: ""
dataplaneId: ""
namespace: ""

# =====================================================================
# Network policy labels — mirrors the convention used by dp-flogo-app
# and dp-bwce-app. The DP namespace ships a NetworkPolicy that selects
# pods carrying ``networking.platform.tibco.com/internet-egress: enable``
# and permits egress to public CIDRs; pods without (or with the value
# set to "disable") are confined to in-cluster traffic only.
#
# Lives under ``global:`` so the same toggle reaches both deployment
# paths — the lite-mode deployment in this chart, and the
# deployment-mcpgateway template inside the mcp-stack sub-chart.
# (Helm propagates ``global.*`` to every sub-chart automatically.)
# =====================================================================

# =====================================================================
# Global CP values (auto-injected by orchestrator at deploy time)
# =====================================================================
global:
  # Bare-cluster private-registry pull secrets (PCP-20286 / B3). A list of
  # pre-created Secret NAMES (kubernetes.io/dockerconfigjson). Empty by default:
  # DP installs use the orchestrator-created `dataplaneId` secret, so the default
  # render is unchanged; a standalone customer on a bare cluster sets this to pull
  # the private TIBCO images. Under global.* so it also reaches the mcp-stack
  # sub-chart (which already honors global.imagePullSecrets).
  imagePullSecrets: []
  # See "Network policy labels" comment block above for the contract.
  networkPolicy:
    internetAll: enable        # "enable" allows outbound internet (e.g. external SOAP/REST/WSDL); "disable" blocks it
  # =====================================================================
  # Full-mode sidecar toggles
  # =====================================================================
  # The full-mode gateway runs inside the vendored mcp-stack sub-chart, which CANNOT read
  # this chart's top-level .Values.discovery / .Values.tibcoProxy — Helm propagates only
  # global.* into a sub-chart. These two flags are therefore the FULL-MODE equivalents of
  # the top-level discovery.enabled / tibcoProxy.enabled toggles (which only the lite
  # templates read). They gate a dedicated LOCAL TIBCO MOD block inside
  # charts/mcp-stack/templates/deployment-mcpgateway.yaml + service-mcp.yaml that inlines
  # the discovery + tp-mcp-gateway-proxy sidecars, mirroring lite-deployment.yaml / lite-service.yaml.
  #
  # The recipe/orchestrator MUST keep each pair in sync (set the global flag to the same
  # value as the top-level toggle) so lite and full installs behave identically:
  #   discovery.enabled   <-> global.tpMcpGateway.discovery.enabled
  #   tibcoProxy.enabled  <-> global.tpMcpGateway.tibcoProxy.enabled
  tpMcpGateway:
    # ─────────────────────────────────────────────────────────────────────────
    # Gateway configuration shared by BOTH deployment modes.
    #
    # WHY IT LIVES UNDER global: the vendored mcp-stack sub-chart can only read
    # `global.*` (Helm shares nothing else with a sub-chart), so a key that must
    # reach BOTH the lite Deployment and the full-mode one has exactly one home.
    # Before this section the same setting had to be written TWICE — once in
    # `lite.config` and once in `mcp-stack.mcpContextForge.config` — and kept in
    # step by hand. Of the two sides' keys only 16 names were even the same, and 4 of those 16
    # had DIFFERENT values (they are listed below and stayed put). This block is the single
    # source for the 12 that genuinely are shared.
    #
    # HOW IT IS APPLIED, and why it always wins:
    #   lite  → templates/lite-deployment.yaml merges it OVER `lite.config`
    #   full  → templates/gateway-config-configmap.yaml renders it into
    #           `<release>-gateway-cfg`, which `mcp-stack.mcpContextForge.extraEnvFrom`
    #           mounts LAST in the container's envFrom list (k8s: last wins), i.e.
    #           over the sub-chart's own ConfigMap AND Secret.
    # The sub-chart is NOT patched for this — extraEnvFrom is its own documented
    # extension point ("envFrom is managed by the chart; use extraEnvFrom to add
    # additional sources"), already used the same way for the OAuth ConfigMap
    # (PCP-20591). Keeping the vendored tree untouched is deliberate: every local
    # edit to it is a rebase conflict against upstream later.
    #
    # WHAT DOES **NOT** BELONG HERE — anything whose correct value differs by mode.
    # Putting one of these here silently changes a mode's behaviour:
    #   CACHE_TYPE                   lite "memory"  vs full "redis"   (architectural)
    #   AUTH_REQUIRED                lite "true"    vs full "false"
    #   MCP_REQUIRE_AUTH             lite "true"    vs full "false"
    #   ALLOW_UNAUTHENTICATED_ADMIN  lite "false"   vs full "true"
    #   DATABASE_URL                 lite sqlite    vs full postgres  (would break full)
    #   HOST · GUNICORN_WORKERS · DB_SQLITE_BUSY_TIMEOUT · PLUGINS_CONFIG_FILE ·
    #   MCP_CLIENT_AUTH_ENABLED      (lite-only — lite-runtime specific, or dynamically
    #                                 overridden by the proxy branch in lite-deployment.yaml)
    #   DB_SQLITE_NETWORK_FS · DB_SQLITE_NETFS_REAP_STALE_LOCK · DB_SQLITE_NETFS_OFFLINE_UNWAL
    #                                 (PCP-24264, lite-only for the
    #                                 same reason as DB_SQLITE_BUSY_TIMEOUT above — a SQLite-only
    #                                 knob rendered here would also reach full mode, whose dialect
    #                                 is postgres, where it is meaningless)
    #   APP_ROOT_PATH · MCPGATEWAY_SESSION_AFFINITY_ENABLED  (full-only)
    #   MCPGATEWAY_FEDERATION_SERVER_REQUESTS_ENABLED  (set per mode, PCP-25546)
    # Those stay in `lite.config` / `mcp-stack.mcpContextForge.config` respectively.
    #
    # Operators (and MCP Hub's deploy wizard) override shared gateway settings here — it is the
    # one path that reaches both modes and outranks the chart defaults.
    #
    # ⚠️ "Outranks the chart defaults" is NOT "overrides anything". A value rendered as an
    # explicit container `env` entry beats every `envFrom` source, and both modes have some.
    # Setting one of these here has NO effect:
    #   lite   APP_ROOT_PATH (owned by publicApi.pathPrefix) · ALLOWED_ORIGINS (rendered from the
    #          public origin) · MCP_CLIENT_AUTH_ENABLED when tibcoProxy.enabled (forced "false")
    #   full   HOST and the proxy-auth vars, PLUGINS_CONFIG_FILE (explicit env in the sub-chart)
    # None of the keys below is in that set. Check the deployment templates before adding one
    # that is — it would render into the ConfigMap, look applied, and do nothing.
    #
    # ⚠️ VERSION COUPLING, and it is deliberate. This path did not exist before
    # tp-mcp-gateway 1.20.0-alpha.36, and MCP Hub's deploy wizard writes ONLY this path from the
    # matching release onward. Mixing the two halves fails SILENTLY in both directions — a new
    # Hub against an older chart has its overrides ignored; an older Hub's `lite.config`
    # overrides lose to the defaults below. There is no in-between release that reads both, by
    # choice: the gateway has not shipped, so no deployment exists to be compatible with, and a
    # dual-read transition would have to be carried and then removed. Ship the chart and the Hub
    # together.
    config:
      SECURE_COOKIES: "false"
      PLUGINS_ENABLED: "true"
      # PCP-20165 SA-16: reject weak JWT/encryption secrets (defense-in-depth; the sensitive
      # secret keys are strong-secret-generated, so this passes by default).
      REQUIRE_STRONG_SECRETS: "true"
      # PCP-22379: the gateway's own Admin web UI is off for the official release — MCP Hub is the
      # control source of truth. The Admin API stays ON on purpose (Hub proxies /admin/plugins for
      # the plugin catalog + governance). Both sides already defaulted to exactly these values.
      MCPGATEWAY_UI_ENABLED: "false"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      # PCP-20564: SSRF_ALLOW_PRIVATE_NETWORKS stays "true" on purpose — it is a FUNCTIONAL
      # requirement for TP (MCP servers run on private cluster / on-prem IPs; federation +
      # register-by-URL need RFC-1918 reachability). Its hardening (an egress NetworkPolicy
      # backstop) is tracked separately by PCP-19937 / TT-21 — NOT by tightening this default,
      # which would break federation on every real deployment.
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
      # PCP-20216 (TT-25): pin outbound TLS verification fail-closed. The gateway code already
      # defaults skip_ssl_verify=False and raises on SKIP_SSL_VERIFY=true in production (PCP-20195);
      # this pins the chart default explicitly across all blocks so it can't silently drift.
      SKIP_SSL_VERIFY: "false"
      # SOAP/WSDL support — see PCP-18693. Default-on in TIBCO mode so the
      # /admin/wsdl endpoints + SOAP dispatch are available without an extra
      # opt-in step. Requires the [soap] extra (zeep) in the image — already
      # baked in via Containerfile.lite.
      MCPGATEWAY_SOAP_ENABLED: "true"
      # OAuth upstream proxy (PCP-18426). DCR is on by default; stateful sessions are
      # required for UC3 (external MCP client per-session token). OAUTH_REDIRECT_URI is
      # injected by lite-deployment.yaml from the DP ingress FQDN.
      DCR_ENABLED: "true"
      USE_STATEFUL_SESSIONS: "true"
      # Inbound external-IdP OAuth — unprovisioned access (PCP-20050 / PCP-18426).
      # Deliberate security toggle, default ON: when "true", a VALID external-IdP token
      # whose user is NOT provisioned in the gateway is admitted (scope-gated; fine-grained
      # authz delegated to plugins, PCP-19981). Set "false" to restore upstream
      # 'user must exist' behavior. The Hub deploy wizard can override this per-DP.
      MCP_INBOUND_OAUTH_ALLOW_UNPROVISIONED: "true"
      # Per-caller authorization for inbound-OAuth virtual servers (PCP-19981 / PCP-24354).
      # These two settings COMPOSE. ALLOW_UNPROVISIONED (above) makes the gateway grant at
      # the RBAC layer for an unprovisioned external-IdP principal, BEFORE any per-user
      # permission check runs. Left at "false", this one then lets a virtual server with NO
      # Permission plugin bound authorize a tool call on token validity alone — so with both
      # in effect, any valid token from an allow-listed issuer can invoke every
      # public-visibility tool on that virtual server, regardless of its groups or roles.
      #
      # The intended remedy is to bind a Permission plugin (http_auth_check_permission) per
      # virtual server from the Hub; PermissionPlugin ships below with mode "disabled" for
      # exactly that per-VS opt-in. Set this to "true" to fail closed instead — inbound-OAuth
      # tool calls are then DENIED on any virtual server with no Permission plugin bound.
      #
      # Kept "false" here to preserve existing deployments; the gateway reports the composed
      # state as a startup security warning and on GET /health/security
      # (checks.inbound_oauth_authz_enforced). Note resources and prompts are not covered by
      # the Permission plugin at all, so neither setting constrains them.
      MCP_INBOUND_OAUTH_REQUIRE_PERMISSION_PLUGIN: "false"
      # PCP-25488: cross-worker RPC forward timeout for the session-affinity broker
      # (tp-mcp-gateway mcpgateway/services/session_affinity.py + config.py). On a multi-replica
      # gateway, a request that lands on a worker which does NOT own the target MCP session is
      # forwarded in-process to the owner, and that forward is wrapped in
      # asyncio.timeout(mcpgateway_pool_rpc_forward_timeout) — code default 30s. Federated
      # elicitation waits for a human/client reply, which routinely exceeds 30s, so the non-owner
      # path failed every elicitation that took longer to answer. Measured on alpha68u: 180s cured
      # all 7 hard failures with no dead-owner side effect. Shared here (not in
      # mcp-stack.mcpContextForge.config) so the one default reaches every profile —
      # production/affinity-ON, affinity-OFF, and lite alike. Lite is always
      # GUNICORN_WORKERS=1 (lite.config below), so there is never a second worker to forward to:
      # the knob renders but the path it times out is never taken there — harmless, not merely
      # untested (dev/mcp-gateway-render-tests/pool-rpc-forward-timeout-assert.sh [D] pins that
      # chart-level fact).
      # NOTE: this is NOT the only session-affinity timeout. MCPGATEWAY_AFFINITY_SESSION_LOCK_TIMEOUT
      # (default 30s, unchanged by this chart) still caps how long a request waits to ACQUIRE a
      # session's lock, so an elicitation wait that contends for the lock past 30s can still fail —
      # see PCP-25491 (1.23).
      MCPGATEWAY_POOL_RPC_FORWARD_TIMEOUT: "180"
      # Rate limiting (PCP-20090). The gateway's in-process RateLimitMiddleware is
      # DEFAULT-OFF on the DP gateway. The DP gateway sits behind platform ingress /
      # dp-proxy / tibtunnel, and the per-IP limiter otherwise mis-fires on the Hub's
      # own control-plane traffic: a single Push sends many admin calls from one IP
      # (Hub / dp-proxy), trips the MEDIUM tier (100 rpm), and after 5 violations the
      # 15-minute account LOCKOUT turns a transient 429 into an outage ("Account
      # locked"). Set "true" to enable the in-process limiter (e.g. a gateway exposed
      # directly, not fronted by an external API gateway). When enabled, these tune it
      # (all settable the same way — uncomment to override the code defaults):
      #   RATE_LIMIT_LOCKOUT_ENABLED: "false"  # keep soft 60s 429s, drop the 15-min lock
      #   RATE_LIMIT_MEDIUM_RPM: "100"         # /servers /tools /gateways /mcp per minute
      #   RATE_LIMIT_LOCKOUT_THRESHOLD: "5"    # violations before lockout
      RATE_LIMITING_ENABLED: "false"
    discovery:
      enabled: true       # full-mode discovery sidecar (default ON)
      # Image for the full-mode discovery sidecar. The vendored mcp-stack subchart only sees
      # global.*, so it CANNOT read the top-level discovery.image.* keys below — these mirror
      # them so the subchart renders the SAME discovery image as the lite templates. Keep the
      # repository/tag identical to the top-level discovery.image (single source of truth).
      # NOTE: each `repository:` line ends in the bare image name with `tag:` immediately
      # following so the automated alpha release pins these alongside the top-level tags.
      # PCP-23125: BARE NAME. The registry + repository halves come from
      # global.cp.containerRegistry via the mcp-stack.image.* helpers, so this mirror MUST be
      # flipped in the same shape as its top-level twin (discovery.image below) — the release
      # pinner rewrites both pairs but only verifies the six top-level paths, which makes a
      # stale mirror the one drift nothing catches. Do NOT quote and do NOT re-qualify.
      image:
        repository: tp-mcp-discovery
        # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the discovery image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
        # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
        # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
        # it names the same image under both tags (re-resolved in the registry).
        tag: "1.22.4"
        digest: "sha256:61999ded08c9adef0094ce5569a1b72d3662971a47f16a9e738605922df4483e"
    tibcoProxy:
      enabled: false      # full-mode tp-mcp-gateway-proxy sidecar + gateway auth-rewire (default OFF)
      # Image for the full-mode tp-mcp-gateway-proxy sidecar. Same rationale as discovery.image above:
      # the subchart only sees global.*, so this mirrors the top-level tibcoProxy.image (single
      # source of truth). Keep the repository/tag identical and in this layout (repository line
      # ending in the bare image name, tag line immediately after) for the automated release pin.
      # PCP-23125: BARE NAME, same rules as global.tpMcpGateway.discovery.image above.
      image:
        repository: tp-mcp-gateway-proxy
        # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the proxy image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
        # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
        # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
        # it names the same image under both tags (re-resolved in the registry).
        tag: "1.22.4"
        digest: "sha256:9c4ee0b38b2a99cd4ae05e05123d35b2a2e2c12f6d73eac2534c1cd370ab5452"
      # PCP-23986 — the proxy's two listen ports. THE single authoritative path: the
      # mcp-stack sub-chart can only see global.*, and the parent reads .Values.global
      # freely, so one home serves both lite and full. There is deliberately NO top-level
      # tibcoProxy.ports mirror; setting one fails the render with a pointer to this key.
      #
      # These SHOULD be >= 1024, and the shipped defaults are. The chart accepts 1-65535 and
      # the proxy only WARNS below 1024 rather than refusing: a privileged port is legitimate
      # on a permissive cluster, and forbidding it outright would be a regression for anyone
      # relying on that today. The proxy runs as uid 1001 with capabilities drop: ["ALL"],
      # so a lower port binds only where the pod netns has
      # net.ipv4.ip_unprivileged_port_start=0 (the containerd default). On a hardened
      # cluster it fails outright and takes the whole capability down — that was PCP-23986.
      # 8880/8881 and not 8080: the discovery sidecar already holds 8080 in this netns.
      # The Service still publishes 80/81; only targetPort follows these.
      ports:
        external: 8880
        cpInternal: 8881
      # PCP-23986 — skip CIC token validation and trust the HAProxy network path.
      # Mirrors the top-level tibcoProxy.trustCPNetwork, which the sub-chart cannot read;
      # full mode hardcoded "true" before this. Default is UNCHANGED (true) — setting it
      # false requires CP_DOMAIN + cp-proxy + IdM to be wired.
      trustCPNetwork: true
    # PCP-24264 — DECLARED storage posture for the volumes this chart provisions. Read by
    # templates/storage-posture-validate.yaml, which is a render-time guard and emits no manifest.
    #
    #   ""       undeclared. DEFAULT, and deliberately advisory-only: the guard never fires, so
    #            every existing install renders byte-identically and nobody is broken by upgrading.
    #   "shared" the StorageClass is backed by a shared filesystem (SMB/CIFS/NFS — e.g. Azure
    #            Files). Refuses the one combination that is known-bad: full mode with the
    #            in-cluster Postgres PVC landing on that share. Lite is unaffected — the gateway
    #            detects and converts its own SQLite volume at runtime (DB_SQLITE_NETWORK_FS).
    #   "block"  block-backed (e.g. Azure Disk, EBS, gp2/gp3). Everything is supported.
    #
    # ⚠️ DECLARED, never inferred, and this is not fastidiousness. A StorageClass-NAME heuristic
    # false-negatives on exactly the class that matters — TIBCO's own is literally named
    # `azure-files-sc`, which no substring rule flags as shared without also flagging block classes
    # that merely mention "file". And `lookup` cannot be used either: it returns empty during
    # `helm template`, so the guard would silently pass in every CI render and in every
    # `--dry-run`. The operator states the fact; the chart does not guess it. Read it off the
    # cluster with:
    #   kubectl get sc <name> -o jsonpath='{.provisioner}{"\n"}{.mountOptions}'
    # A provisioner of file.csi.azure.com (or any SMB/NFS provisioner) means "shared".
    storage:
      classKind: ""
      # The same tri-state for the class named in mcp-stack.postgres.persistence.storageClassName,
      # i.e. escape hatch (c) of the guard above. Only "block" excuses the in-cluster PostgreSQL
      # PVC from the shared-storage refusal, and it costs a SECOND declaration on purpose: a pin
      # is only a NAME. Pinning the PVC to the very class you just declared shared — a copy-paste
      # out of the DP's own values — silenced the guard entirely while changing nothing about
      # where PGDATA lands. Unused unless classKind="shared" AND the PVC is pinned, so the shipped
      # default keeps every existing render byte-identical.
      pgClassKind: ""
  # OpenTelemetry — reads collector endpoints from DP o11y-service ConfigMap.
  # Same pattern as bwprovisioner. Degrades gracefully when o11y not deployed.
  # Uses global: so it flows into the mcp-stack subchart automatically.
  otel:
    enabled: true
    serviceName: "mcp-gateway"
  # ─ TIBCO Platform application-log forwarding (PCP-22768) ─
  # When enabled, a fluentbit sidecar tails the gateway's JSON application-log file and
  # ships it to the DP observability Log server (otel-userapp-logs). MCP Hub sets `enabled`
  # from the Register-Gateway "fluentbit sidecar" toggle via ENABLE_APPS_FLUENTBIT_SIDECAR.
  # Under global.* so it reaches BOTH the vendored mcp-stack sub-chart (full mode) and the
  # wrapper lite-deployment template (lite mode). Default OFF: the pod is unchanged unless
  # a caller (Hub) explicitly opts in.
  tibco:
    logging:
      fluentbit:
        enabled: false
        image:
          # PCP-23125: BARE NAME — same registry as the gateway's discovery /
          # tp-mcp-gateway-proxy sidecars because it goes through the SAME resolver
          # (global.cp.containerRegistry). This key is SHARED: templates/lite-deployment.yaml
          # and charts/mcp-stack/templates/deployment-mcpgateway.yaml both read it, and both
          # prefix it. Re-qualifying it here would double-prefix BOTH modes — which is why both
          # of them now abort the render instead (tp-mcp-gateway.image.bareRepository and its
          # mcp-stack twin).
          repository: common-fluentbit
          # PCP-25107: 5.1.0 -> 5.1.2 (CVE-remediated build).
          # PCP-25657: 5.1.2 -> 5.1.3, the BASE chart's pin (tibco-cp-base commonImages.fluentbit on releases/1.22).
          # PCP-25657: 5.1.3 -> 5.1.5, the BASE chart's pin (tibco-cp-base commonImages.fluentbit on releases/1.22,
          # 1.22.0-alpha.137). common-fluentbit:5.1.5 verified present in -dev (sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4).
          tag: "5.1.5"
          pullPolicy: IfNotPresent
        otel:
          host: otel-userapp-logs
          port: 4318
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 150Mi
  cp:
    # Auto-injected by the orchestrator/recipe at deploy time.
    # Consumed by tp-mcp-gateway.selectorLabels for the platform.tibco.com/* spec labels.
    dataplaneId: ""
    instanceId: ""
    # routeResources controls the internal control-plane -> data-plane route (via dp-proxy) for this component.
    # PCP-18809: the routing path is split into a configurable prefix + a fixed /integration/mcp-gateway tail,
    # and the route may be served by an ingress controller other than the bundled HAProxy.
    #
    # This chart differs from bwprovisioner/o11y-service/tp-dp-monitor-agent in ONE way: it does not own its
    # tail. A Data Plane can host more than one gateway, so the MCP Hub composes the COMPLETE per-instance
    # CP->DP path (base + the gateway's stable id) and passes it in haproxy.pathPrefix — see the comment there.
    # tp-mcp-gateway.privateRoutePath re-anchors that Hub-composed path onto pathPrefix below, so the tail
    # stays Hub-owned while the prefix becomes per-DP configurable. With the default prefix the rendered
    # path is byte-identical to the pre-PCP-18809 route.
    #
    # controllerServiceDNS is declared for SHAPE PARITY with the rest of the family, and is not read by
    # this chart. Only tp-dp-monitor-agent and tp-provisioner-agent consume it, to emit a second host
    # rule for the in-cluster proxy Service; artifactmanager and o11y-service declare it without reading
    # it for exactly this reason. Every chart on the OHC line therefore exposes one identical contract.
    routeResources:
      pathPrefix: /tibco/agent   # configurable routing prefix; the tail stays Hub-composed (see above)
      controllerServiceDNS: cpdpproxy  # family parity; not read here (this chart emits a single host rule)
      ingress:
        ingressController: ""    # "" (default: bundled haProxy) | "haProxy" | "nginx" | "traefik" | "openshiftRouter"
        ingressClassName: ""     # required when ingressController is "haProxy", "nginx", or "traefik"
        fqdn: ""                 # required when ingressController is set
        annotations: {}          # user-supplied annotations merged on top of controller defaults
      gatewayapi:
        gatewayAPIControllerName: ""
        gatewayName: ""
        gatewayNamespace: ""
        gatewayHostOrDomainName: ""
        gatewaySectionName: ""
    # Container-registry indirection (PCP-23125). Injected by the orchestrator on a live
    # Data Plane; declared here so the chart renders standalone without a nil-map panic —
    # the same way every sibling DP chart declares it. `secret` is declared for shape parity
    # with the siblings; this chart still takes pull secrets from global.imagePullSecrets.
    containerRegistry:
      secret: ""
      url: ""
      repository: "tibco-platform-docker-prod"
    # CP-DP HAProxy ingress vhost (PCP-19767). Default = tunnel vhost (hybrid-ON).
    # The orchestrator overrides host with the reachable-URL host
    # (cpdpproxy.<dp-ns>.svc.cluster.local) when hybrid connectivity is disabled,
    # exactly as for bwprovisioner/flogoprovisioner/o11y-service. Rendered through
    # `tpl` in the ingress templates so the {{ }} default is re-evaluated at install.
    # Keys on global.cp.dataplaneId (same identifier tp-mcp-gateway.selectorLabels
    # uses), matching the bwprovisioner/flogoprovisioner convention for this global.
    dpUrl:
      host: "dp-{{ $.Values.global.cp.dataplaneId }}.platform.local"
      port: 443
    resources:
      serviceaccount:
        namespace: ""
        serviceAccountName: ""
      ingress:
        fqdn: ""
        ingressClassName: ""
        # traefik | nginx | haProxy | openshiftRouter select the PUBLIC edge template, matched
        # case-insensitively ("OpenshiftRouter" works). kong (offered by the Control Plane) is accepted
        # but has no public edge yet (PCP-26720); any other non-empty value fails the render (PCP-26618).
        # openshiftRouter renders one Route per allowlisted path (templates/route-openshift-public.yaml)
        # and REQUIRES a lowercase, non-wildcard fqdn.
        ingressController: ""
        annotations: {}
      gatewayapi:
        gatewayAPIControllerName: ""  # GKE | ISTIO | etc (if set, enables Gateway API)
        gatewayName: ""
        gatewayNamespace: ""
        gatewayHostOrDomainName: ""
        gatewaySectionName: ""
        annotations: {}
      # Auto-injected by the orchestrator/recipe at deploy time (same pattern as
      # ingress.fqdn / ingress.ingressClassName above). Left empty here so the
      # contract is discoverable. When empty, the chart OMITS storageClassName
      # from the PVC, so Kubernetes uses the cluster's default StorageClass.
      # (Use the "-" sentinel — quoted as "-" in a values file — to emit
      # storageClassName: "" and disable dynamic provisioning instead.)
      storage:
        storageClassName: ""

# =====================================================================
# HAProxy Ingress — CP-to-DP proxy chain (used by both modes)
# =====================================================================
haproxy:
  enabled: true
  # CP->DP HAProxy ingress sub-path the Hub reaches the gateway on. The MCP Hub composes the complete
  # per-instance path (this base + the gateway's stable id) and passes it here; the chart renders it
  # verbatim. This default is the plain base for single-instance / operator-supplied installs.
  pathPrefix: /tibco/agent/integration/mcp-gateway

# =====================================================================
# Public Ingress — optional path prefix for shared-FQDN deployments
# When set, the gateway is served under this sub-path and APP_ROOT_PATH
# is configured automatically. When empty, the gateway is served at /.
# =====================================================================
publicApi:
  pathPrefix: ""
  # Public BARE ORIGIN (scheme://host, no path) used as the inbound-OAuth audience
  # trust anchor (APP_DOMAIN, PCP-20050). Leave EMPTY to auto-derive from the DP
  # ingress FQDN (global.cp.resources.ingress.fqdn, or the Gateway API host). Set
  # explicitly ONLY when the public host differs from the DP ingress (e.g. an external
  # API gateway fronts the DP). Do NOT include the path prefix — the gateway appends
  # APP_ROOT_PATH itself, so embedding it here would double-prefix admin/email URLs.
  appDomain: ""
  # RFC 9728 OAuth Protected Resource Metadata well-known base path.
  # Protocol constant — do NOT override per-deployment.
  # When pathPrefix is set, the public ingress additionally routes
  #   <wellKnownPrefix><pathPrefix>
  # so spec-compliant MCP clients can perform root-anchored RFC 9728 discovery
  # for a sub-path-mounted gateway (PCP-19809). Chart-owned route; no rewrite —
  # the gateway serves PRM at the full literal path.
  wellKnownPrefix: /.well-known/oauth-protected-resource
  # PCP-25406 (follow-up to PCP-25379): allowlist for the nginx public Ingress
  # (templates/ingress-nginx.yaml), now ON by default. Only the documented external MCP client
  # paths + the RFC 9728 .well-known doc are routed on the public edge — /admin and the rest of
  # the REST surface are not — matching what the traefik and Gateway-API allowlists already do.
  # Set this to `false` to restore the previous behaviour, where the whole `{{ pathPrefix }}/`
  # prefix is forwarded publicly, including /admin.
  #
  # ⚠️ WHEN YOU MIGHT NEED `false`: the mechanism (`nginx.ingress.kubernetes.io/use-regex: "true"`)
  # is NOT scoped to this Ingress. Per ingress-nginx's own docs, once ANY Ingress on a host sets
  # use-regex (or rewrite-target), EVERY other Ingress sharing that host has its Prefix paths
  # turned into case-insensitive regex locations in the same nginx server{} block.
  #
  # ⭐ MEASURED on a live community ingress-nginx Data Plane (ins-syan-a90nginx, controller
  # v1.14.1, 2026-10-09): NOTHING shares the gateway's host on a stock install. Enumerating every
  # nginx-class Ingress on that box by host, the gateway's own `mcp-hub-<dp>.<domain>` carried
  # exactly one Ingress — its own — while each capability service had a DISTINCT derived host
  # (flogo./apm./elastic./keycloak./kibana./mail./agent-cp-only.). The host-wide side effect has
  # nothing to act on, which is why ON is the right default.
  #
  # ⚠️ The chart TEMPLATES suggest the opposite and should not be trusted here: seven charts in
  # this repo (bwprovisioner, flogoprovisioner, bw5provisioner, sbprovisioner, dp-bw-adapter,
  # tibco-developer-hub, o11y-service) all render `host: global.cp.resources.ingress.fqdn`
  # verbatim, which reads as guaranteed co-tenancy. It is not — the provisioner supplies a
  # DIFFERENT value for that key per capability release, so what they share is the KEY, not the
  # host. Only a live cluster answers this; two successive revisions of this comment got it
  # wrong in opposite directions by reasoning from the templates alone.
  #
  # Set this to `false` only if you DELIBERATELY co-host another service on the gateway's FQDN
  # and its paths change meaning under regex semantics — paths containing regex metacharacters
  # such as `.`, `+` or `(`, or paths relying on case-sensitive matching. (Where a host IS shared
  # on a stock box — observed for flogo. — both parties already set use-regex themselves, so the
  # server block is in regex mode regardless of this chart.)
  #
  # ⚠️ UPGRADES — which installs actually adopt this new default. Three cases, and the FIRST is
  # the one that matters, because it is how a customer's gateway is actually upgraded:
  #   • CP / Hub-managed (the normal path): the flip REACHES them. A Hub-driven upgrade RE-RENDERS
  #     the recipe, so the new chart's defaults apply (settled from source, release-progress
  #     0f86bfb; it agrees with the independent code trace that the Hub never runs helm itself and
  #     mcp-hub-recipes' `flags:` block requests no values strategy, so the DP provisioner-agent
  #     does a plain upgrade). ⚠️ NOT live-measured — the prerelease guard blocks that proof on an
  #     alpha chart, so it is deferred to post-GA.
  #   • An operator's own `chartValuesYaml` overlay merges AFTER the recipe and therefore PERSISTS.
  #     Anyone who hand-set `nginxAllowlistEnabled: false` keeps it across the upgrade. That is
  #     intended — a deliberate opt-out must survive — but it does mean the flip does not reach an
  #     install whose operator pinned the old value by hand.
  #   • A hand-run `helm upgrade --reuse-values` keeps the recorded value, because that flag
  #     replaces the incoming chart's defaults wholesale with the previous release's coalesced
  #     values (helm pkg/action/upgrade.go, `chart.Values = oldVals`). An install whose PREVIOUS
  #     chart already carried this key (1.21.0-alpha.39+ / 1.22.0-alpha.19+) therefore keeps its
  #     recorded `false`, and a recorded `false` is indistinguishable from a deliberate opt-out, so
  #     the chart must not override it. Adopt it with `--reset-then-reuse-values` or an explicit
  #     `--set`. An install from a chart PREDATING the key (<=1.21.0-alpha.38, incl. released
  #     1.21.1) has no recorded value and DOES adopt the new default even under `--reuse-values` —
  #     see templates/ingress-nginx.yaml for why the absent-key fallback is `true`, not `false`.
  nginxAllowlistEnabled: true
  # PCP-25403: the public Gateway API HTTPRoute allowlist (templates/gateway-public.yaml).
  # Default ON — the opposite of nginxAllowlistEnabled above, and deliberately so. That key is OFF
  # because its MECHANISM is hazardous: `nginx.ingress.kubernetes.io/use-regex` is not scoped to
  # one Ingress and silently changes every other Ingress sharing the host. Gateway API has no such
  # side effect, and the ISTIO/NGINX_GATEWAY_FABRIC half of this route has ALREADY shipped
  # allowlisted-by-default since PCP-25379 — so default-ON is what makes the chart behave the same
  # way for the same values regardless of which controller the Data Plane happens to use.
  #
  # When true (default) the public route publishes only:
  #   - <pathPrefix>/servers/<id>/{mcp,sse,message}  on ISTIO / NGINX_GATEWAY_FABRIC (exact regex)
  #   - <pathPrefix>/servers                         on every other controller (Core PathPrefix;
  #     Gateway API's RegularExpression match is Implementation-specific and an implementation that
  #     rejects it must set the route Accepted=False, which would drop ALL traffic — see
  #     templates/gateway-public.yaml's header for the per-controller evidence). ⚠️ PCP-26950: on a
  #     LITE gateway ONLY. A FULL gateway publishes no <pathPrefix>/servers on those controllers
  #     (nor on the OpenShift public Route): those edges cannot express the exact per-server path, so
  #     a FULL gateway is published only on the private CP->DP path there.
  #   - the RFC 9728 OAuth protected-resource discovery document, in both advertised shapes
  # /admin, /rpc, the root /mcp, /sse, /message, /tools, /gateways, /resources, /prompts, /a2a,
  # /docs and /openapi.json are NOT routed.
  #
  # Set false ONLY to restore the previous behaviour — the whole `<pathPrefix>/` prefix published,
  # /admin and the management REST API included — if you discover you were relying on a path the
  # allowlist no longer publishes.
  # ⚠️ SCOPE: false restores exactly what PCP-25403 changed, which is the Core-conformance tier.
  # ISTIO and NGINX_GATEWAY_FABRIC keep the regex allowlist that shipped in PCP-25379 regardless
  # of this key — it is not a way to re-open those. With this key false the rendered route of a LITE
  # gateway is byte-identical to the 1.22.0-alpha.24 chart for every controller.
  # ⚠️ PCP-26950: false is REFUSED for a FULL gateway (lite.enabled=false) on a Gateway API
  # controller other than ISTIO / NGINX_GATEWAY_FABRIC, by name at render time: the blanket prefix
  # would publish the whole gateway on the public edge, and a FULL gateway is published only on the
  # private path there. LITE keeps the opt-out; on ISTIO and NGINX_GATEWAY_FABRIC the key stays the
  # no-op it always was, so it is not refused there. `helm upgrade --reuse-values` carries a
  # previous `false` over: pass --set publicApi.gatewayApiAllowlistEnabled=true (or drop the key).
  # ⚠️ Prefer a narrower fix first: a dedicated HTTPRoute of your own for the specific path you
  # need, alongside the chart's. Reaching the gateway's admin console should go through the
  # Control Plane, which uses the private CP->DP tunnel and is unaffected by this key either way.
  gatewayApiAllowlistEnabled: true
  # PCP-25402: allowlist for the haProxy public Ingress (templates/ingress-haproxy-public.yaml).
  # Default ON — with this true, the public haProxy route exposes ONLY the external MCP client
  # transports (<pathPrefix>/servers/<id>/{mcp,sse,message}) and the RFC 9728 protected-resource
  # discovery document. Set to false to restore the previous behaviour, where the whole
  # <pathPrefix>/ prefix — admin console and REST surface included — is published.
  #
  # EVERYTHING ELSE ON THIS HOST NOW RETURNS 404 AT THE EDGE. That is the point, but read the list
  # before you upgrade, because it is wider than "/admin": <pathPrefix>/admin, bare
  # <pathPrefix>/servers and <pathPrefix>/servers/<id>, /tools, /gateways, /resources, /prompts,
  # /version, /metrics, /docs, /openapi.json, <pathPrefix>/ itself — AND the gateway's own OAuth
  # endpoints (<pathPrefix>/oauth/*, including the /oauth/callback this chart derives for
  # OAUTH_REDIRECT_URI, and /.well-known/oauth-authorization-server). Paths containing `..` or a
  # percent-encoded separator (%2f, %2e, %5c) are rejected outright, because HAProxy matches the raw
  # request-target and would otherwise let those through the <id> wildcard.
  # ⚠️ The OAuth endpoints are denied by the SAME allowlist the traefik and Gateway API routes have
  # shipped by default since PCP-25379, so this is not a haProxy-specific narrowing — but if your
  # deployment has public MCP clients driving an authorization-code flow against the gateway itself
  # (rather than bearer tokens from the Control Plane's IdP), that flow needs this set to false
  # until the allowlist is widened in all three lanes. Tracked, not decided in this chart.
  #
  # Unlike the nginx key above, the mechanism here is scoped to this Ingress object only: the
  # allowlist is an `http-request deny` carried by haproxy.org/backend-config-snippet (an INGRESS-
  # scoped annotation), and haproxy.org/standalone-backend gives this Ingress its own HAProxy
  # backend, so the deny cannot reach the backend the private CP->DP route would otherwise share.
  # It cannot affect another service co-hosted on the same fqdn.
  #
  # ⚠️ Set this to false if you need the previous behaviour. Two cases the chart will not let you
  # stumble into silently -- it FAILS THE RENDER with a message naming this key, rather than
  # guessing:
  #   • global.cp.resources.ingress.annotations already carries backend-config-snippet,
  #     standalone-backend, request-set-header or path-rewrite under ANY of haproxy.org/,
  #     haproxy.com/ or ingress.kubernetes.io/. The controller folds those three prefixes into one
  #     annotation, so your value and the chart's would collapse into a single entry and the
  #     survivor would be map iteration order -- the allowlist could silently stop applying.
  #     (path-rewrite is rejected for a different reason: it rewrites the path BEFORE the allowlist
  #     sees it, so the allowlist would stop meaning what it reads.)
  #   • publicApi.pathPrefix contains a character that cannot safely be written into raw HAProxy
  #     configuration (whitespace, # $ \ ' " { } % or a newline).
  #
  # ⚠️ WHAT THIS DOES NOT CLOSE. It narrows the PUBLIC Ingress only. The private CP->DP route
  # (global.cp.routeResources.ingress.*, or the bundled route on ingressClass tibco-dp-<id>)
  # deliberately still carries the whole gateway surface, because the Control Plane's admin and sync
  # calls go through it. The configuration to watch is NOT "the two routes share an fqdn" -- it is
  # the two routes sharing an INGRESS CLASS / controller, i.e. one haproxytech controller serving
  # both axes, which is an ordinary single-ingress Data Plane. HAProxy selects a route by the Host
  # header, not by which address the packet arrived on, so a request to the public edge carrying the
  # PRIVATE route's Host reaches the private route and its full surface, whatever this setting is.
  # Pre-existing and unchanged here; the fix is to keep the private route off the public edge
  # (separate ingress class / listener, or a source-scoped guard on it).
  #
  # Requires a haproxytech/kubernetes-ingress controller new enough to know both annotations --
  # v1.11.0 (2024-03) or later, which every controller version this repo ships or pins satisfies.
  # See dev/plan/PCP-25402-plan.md for the measured per-version table.
  #
  # ⚠️ HOW TO TELL WHETHER THIS IS ACTUALLY IN FORCE, and why you cannot tell from the Ingress.
  # The allowlist is carried by an annotation. If the controller ever rejects the snippet, it
  # disables THAT SNIPPET ALONE and carries on: HAProxy keeps serving, the Ingress still shows the
  # annotation, and Helm still reports success. Measured on haproxytech 3.2.15 / HAProxy 3.2.23
  # with a deliberately malformed snippet: one `ERROR ... unable to Sync HAProxy configuration !!`
  # is logged, the retry then succeeds, and nothing afterwards distinguishes the broken state from
  # a healthy one.
  # WHAT IS ACTUALLY EXPOSED IF THAT HAPPENS: `<pathPrefix>/servers` and `<pathPrefix>/servers/<id>`
  # -- the per-server REST object and its mutating verbs -- and nothing else. NOT /admin, /tools,
  # /gateways, /resources, /prompts or /version: those are not routed by this Ingress at all once
  # the allowlist is on, because the path rules themselves were narrowed for exactly this case.
  # That is still worth alerting on, but it is a smaller hole than the pre-narrowing one.
  #   • ALERT on the controller log string `unable to Sync HAProxy configuration`.
  #     Do NOT alert on `has been disabled` -- that line did not appear on 3.2.15 (only
  #     "has been created/modified/deleted" and "has been updated" did), so such an alert would
  #     never fire. Nor is the Prometheus gauge usable: it is reset at the start of the retry and
  #     goes 1 -> 0 within the same reconcile, well inside any normal scrape interval.
  #   • To CONFIRM positively, assert on the generated config rather than on the Ingress -- and
  #     print the ENCLOSING BACKEND, not just the deny line. A bare grep for the deny will also
  #     match a deny belonging to some other Ingress and read as confirmation:
  #       kubectl exec -n <ns> <haproxy-controller-pod> -- \
  #         awk '/^backend /{b=$2} /http-request deny deny_status 404/{print b}' /etc/haproxy/haproxy.cfg
  #     Every backend printed must contain THIS Ingress's name (`<release>-mcp-gateway-public-haproxy`).
  #     That is what haproxy.org/standalone-backend produces, and it is what keeps the rule off the
  #     backend the private CP->DP route shares. dev/verify-haproxy-public-allowlist-live.sh does
  #     this check, and the full edge probe, for you.
  # This is also why the Ingress's own path rules are narrowed rather than left at the full prefix:
  # if the snippet is ever dropped, /admin and the REST surface are still not routed.
  haproxyAllowlistEnabled: true
  # PCP-26787: the Traefik entrypoints the PUBLIC IngressRoute (templates/ingress-traefik.yaml) binds to.
  # Read only when ingressController is traefik. The default, an empty list, pins NOTHING: the route
  # attaches to every default entrypoint of the controller, exactly as the plain Ingress did up to
  # 1.22.0-alpha.15 (the Traefik IngressRoute CRD: `entryPoints` is optional, "Default: all").
  # 1.22.0-alpha.16 - alpha.37 hard-pinned [websecure] instead. That matches nothing where a load balancer
  # terminates TLS and forwards 443 to Traefik's `web` entrypoint (dp-config-aws: the NLB, ACM certificate,
  # 443 -> targetPort web): every virtual-server endpoint and the OAuth callback answered Traefik's own
  # 404 while the gateway showed ONLINE in the Hub.
  # Set a list to pin the route explicitly, for example ["websecure"] where Traefik itself terminates TLS
  # and the gateway must not be served over plain HTTP on `web`, or ["web", "websecure"]. Each entry must
  # be an entrypoint that exists in the controller's static configuration: Traefik drops a route that names
  # one it does not have, which publishes nothing. Anything that is not a list of names fails the render,
  # false, 0 and {} included; only absent, null, [] and an empty string read as unset.
  # The PCP-25379/25403 path allowlist is the route's own `match`, so it applies on every entrypoint the
  # route is bound to; this key changes WHERE the route listens, never WHAT it routes.
  # Upgrades: a release recorded before this key existed replays no value for it, which reads as unset, so
  # `helm upgrade --reuse-values` takes the default. A release that recorded the key keeps what it recorded.
  traefikEntryPoints: []

# =====================================================================
# Plugins — defined once, used by both lite and full mode
# =====================================================================
plugins:
  enabled: true
  # PCP-25281: the RateLimiterPlugin backend fragment actually used is injected wherever
  # RATE_LIMITER_BACKEND_BLOCK_PLACEHOLDER appears below -- by whichever consuming template
  # knows if real Redis is reachable THERE. Lite never has Redis: templates/lite-plugins-
  # configmap.yaml always substitutes memory, inline, with no reference to any value (lite
  # needs no redis fragment at all). Full mode decides per-install, in charts/mcp-stack/
  # templates/configmap-gateway-plugin.yaml, on .Values.redis.enabled / .Values.redis.external.
  # enabled -- substituting the redis fragment (mcp-stack.rateLimiterRedisBlock, below, in the
  # PARENT's `mcp-stack:` subchart-values block, NOT here) only when one is true, memory
  # otherwise. It cannot live here: a subchart template's `.Values` is the SUBCHART's own
  # namespace -- Helm does not pass a parent's plain top-level keys into a subchart, only
  # `global.*` and whatever the parent nests under the subchart's own key (`mcp-stack:` below).
  # It also cannot be a literal inside that template file: the `{{ env.* }}` syntax is the
  # GATEWAY's OWN Jinja config-load syntax, and writing it inside a Helm template file would be
  # re-lexed by Helm's own `{{ }}` parser as a second, invalid, nested template action. A plain
  # values.yaml string (read, never templated, by the parent) is never re-lexed that way.
  config: &plugins_config |
    plugin_dirs:
      - "plugins/native"
      - "plugins/custom"

    plugin_settings:
      parallel_execution_within_band: true
      plugin_timeout: 120
      fail_on_plugin_error: false
      enable_plugin_api: true
      plugin_health_check_interval: 120
      include_user_info: false

    plugins:
      # Rate limiter — cpex_rate_limiter pip package (Rust core). PCP-25281: `backend` is
      # injected PER MODE by the consuming template (lite: inline "memory"; full mode: the
      # mcp-stack.rateLimiterRedisBlock value, see the top of this file) -- "redis" where real
      # Redis is reachable (shares counters across replicas AND across a plugin
      # re-instantiation), "memory" where it is not (lite; full mode with no
      # Redis configured). Without a real backend, memory counters live in the plugin INSTANCE,
      # and a push on ANY VS of the gateway re-instantiates every plugin instance, silently
      # resetting every rate limit to zero -- that was the unconditional-memory bug.
      # PCP-22399: kind points at the fork-side ObservableRateLimiterPlugin wrapper
      # (subclasses the cpex_rate_limiter wheel, delegates 100% of enforcement) so a redis
      # backend that fails open to memory (e.g. a transient outage in full mode) becomes
      # observable — deduped WARNING + rate_limiter_degraded / rate_limiter_backend on the
      # tools/call _meta. An explicit `backend: "memory"` binding (lite; full mode with no
      # Redis) is a verbatim passthrough -- no degraded flag, no warning, nothing to observe,
      # since memory is the deliberately-configured backend there, not a fallback. Requires a
      # gateway image that carries the wrapper — first added in e20deb0d (PCP-22389); the
      # image tags below pin build wip-poc-1-0b9555a (a descendant that contains it).
      - name: "RateLimiterPlugin"
        kind: "plugins.rate_limiter.observable_rate_limiter.ObservableRateLimiterPlugin"
        description: "Per-user/tenant/tool rate limits"
        version: "0.0.6"
        hooks: ["prompt_pre_fetch", "tool_pre_invoke"]
        tags: ["limits", "throttle"]
        mode: "disabled"
        priority: 20
        conditions: []
        config:
          RATE_LIMITER_BACKEND_BLOCK_PLACEHOLDER
          by_user: "300/m"  # PCP-24390: was 60/m -- do not silently revert; by_tenant deliberately stays 600/m
          by_tenant: "600/m"
          by_tool:
            search: "10/m"

      # Secrets Detection — regex-based key/token detector
      - name: "SecretsDetection"
        kind: "plugins.secrets_detection.secrets_detection.SecretsDetectionPlugin"
        description: "Detects keys/tokens/secrets in inputs/outputs"
        version: "0.1.0"
        # PCP-20254: tool_pre_invoke added so secrets in tool INPUT args are scanned (cpex
        # dispatches only hooks declared here, so the method + this entry must ship together).
        # PCP-19884: per-VS model — base mode is "disabled" (loaded-but-inert, no global
        # security floor). Enforcement is opt-in PER VIRTUAL SERVER (and per VS-tool) via a
        # Hub plugin binding, which gateway_plugin_manager._merge_tenant_config activates per
        # context and _apply_security_floor then pins to blocking/fail-closed. A base-disabled,
        # unbound plugin is left OFF (the floor never force-enables it).
        # OPERATOR NOTE: to restore the GLOBAL always-on floor instead, set mode "enforce" with
        # conditions: [] — that + the PCP-20184 floor = blocking and non-downgradable on every
        # VS. To soften a global floor, use "permissive", or turn off a broad detector (e.g.
        # base64_24) under config.enabled below.
        hooks: ["prompt_pre_fetch", "tool_pre_invoke", "tool_post_invoke", "resource_post_fetch"]
        tags: ["security", "secrets", "dlp"]
        mode: "disabled"
        priority: 51
        conditions: []
        config:
          enabled:
            aws_access_key_id: true
            aws_secret_access_key: true
            google_api_key: true
            slack_token: true
            private_key_block: true
            jwt_like: true
            hex_secret_32: true
            base64_24: true
          redact: false
          redaction_text: "***REDACTED***"
          block_on_detection: true
          min_findings_to_block: 1

      # Post-ingestion write interlock (PCP-24140) — turns read/write separation from a
      # deployment pattern into an enforced request-path control that leaves evidence.
      # Once a principal has ingested content from a declared untrusted SOURCE tool, it may
      # call a declared WRITE tool only if that source's allowlist permits it.
      #
      # NO ARGUMENT VALUE IS EVER COMPARED — the decision inputs are tool identity and
      # ingestion history, which is what makes it immune to value splitting, re-encoding and
      # canonicalisation gaps. Scope is SAME-PRINCIPAL: an enforced separation interlock with
      # evidence, NOT general prompt-injection containment, and it does not close GhostJacking
      # (the RCE leg never traverses the gateway).
      #
      # Ships INERT: `sources` and `write_tools` are empty, so the plugin short-circuits and
      # gates nothing until an operator classifies their tools. mode "disabled" is the per-VS
      # opt-in model (same as SecretsDetection above): enforcement comes from a Hub plugin
      # binding, which _merge_tenant_config activates per context and _apply_security_floor
      # then pins to blocking/fail-closed.
      #
      # ⚠️ A per-VS binding CAN replace these lists (the tenant merge is a shallow
      # {**base, **override} and no config-floor stripper is registered for this class).
      # Harmless while the base is empty — the binding IS the enforcement — but do not add a
      # global baseline here and assume a binding cannot undo it.
      - name: "SessionWriteGate"
        kind: "plugins.session_write_gate.session_write_gate.SessionWriteGatePlugin"
        description: "Deny a declared write tool after the principal ingested from a declared untrusted source, unless that source permits it"
        version: "0.1.0"
        hooks: ["tool_pre_invoke", "tool_post_invoke"]
        tags: ["security", "provenance", "write-gate"]
        mode: "disabled"
        priority: 45
        conditions: []
        config:
          sources: {}
          write_tools: []
          additional_sources: {}
          additional_write_tools: []
          # taint_ttl_seconds is deliberately NOT restated here. 1800 is
          # SessionWriteGateConfig's own default (plugins/session_write_gate/
          # session_write_gate.py) and nothing reconciles a copy in this file against it, so
          # pinning it would drift silently the day the model default moves. The Hub's plugin
          # form still offers the key, and a per-VS binding can still set it.

      # Output Length Guard — truncate oversized tool outputs
      - name: "OutputLengthGuardPlugin"
