# =====================================================================
# Discovery sidecar — auto-discovers MCP-enabled BW/Flogo apps (PCP-18432)
# =====================================================================
discovery:
  enabled: true
  # In-pod discovery sub-path (PCP-20569, Option B). There is NO dedicated discovery Ingress and NO
  # :8080 discovery Service anymore. The discovery sidecar (:8080) is reached ONLY in-pod: the
  # tp-mcp-gateway-proxy sidecar fronts the gateway on :81 and path-routes <subPath> (relative to the single
  # gateway haproxy.pathPrefix) to the in-pod discovery upstream (http://127.0.0.1:8080). This is why
  # discovery.enabled implies the :81 front (the haproxy ingress + Service select :81 when EITHER
  # tibcoProxy.enabled OR discovery.enabled). subPath (default "_discovery") is injected into the proxy
  # as DISCOVERY_PATH_PREFIX via the tp-mcp-gateway.discoverySubPath helper (leading-slash normalized).
  subPath: _discovery
  # DEPRECATED / no-op (PCP-20569). The discovery route is no longer a separate ingress, so this value
  # is NEVER read — setting it has ZERO effect. Discovery is now served under the single gateway prefix
  # at <haproxy.pathPrefix>/<subPath> (default <haproxy.pathPrefix>/_discovery), routed in-pod by
  # tp-mcp-gateway-proxy. The key is retained ONLY so old recipes / --reuse-values upgrades that still set it
  # remain harmless (the value is silently ignored).
  pathPrefix: /tibco/agent/integration/mcp-discovery
  # PCP-23125: BARE NAME — templates/lite-deployment.yaml composes
  # <tp-mcp-gateway.image.registry>/<tp-mcp-gateway.image.repository>/<this> and passes it to
  # the tp-mcp-gateway.image helper. Keep in the same shape as the
  # global.tpMcpGateway.discovery.image mirror above, and keep `tag:` on the line IMMEDIATELY
  # below (the release pinner rewrites the next `tag:` after this line).
  # Setting a FULLY-QUALIFIED value here (or replaying one through `helm upgrade
  # --reuse-values` from a release older than PCP-23125) ABORTS the render rather than
  # prefixing the registry a second time — see tp-mcp-gateway.image.bareRepository in
  # templates/_helpers.tpl. Point global.cp.containerRegistry.url / .repository at your
  # registry instead. The same rule applies to every image block below that says
  # "same rules as discovery.image above".
  image:
    repository: tp-mcp-discovery
    # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the discovery image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
    # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
    # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
    # it names the same image under both tags (re-resolved in the registry).
    tag: "1.22.4"
    digest: "sha256:61999ded08c9adef0094ce5569a1b72d3662971a47f16a9e738605922df4483e"
    pullPolicy: IfNotPresent
  config:
    DISCOVERY_ANNOTATION_KEY: "platform.tibco.com/connectors"
    DISCOVERY_ANNOTATION_MATCH: "MCP"
    # BW/BWCE apps serve MCP at /rest/mcp (REST, :18000) and /soap/mcp (SOAP, :18001) when built
    # with BW_JAVA_OPTS=-Dbw.enable.mcp.server=true; Flogo uses /mcp. Confirmed live on dgidwani-mcp-17.
    MCP_PATH_BW: "/rest/mcp,/soap/mcp"
    # Capability probe (PCP-18432 / B2): discover MCP apps that carry NO connector marker by
    # handshaking their Service ports x reserved paths — label- and ingress-independent (covers BW,
    # whose runtime-enabled MCP leaves platform.tibco.com/connectors empty). Reserved paths only +
    # the initialize-handshake validator mean a probe cannot false-positive; the negative cache keeps
    # non-MCP apps from being re-probed every refresh. Set DISCOVERY_PROBE_FALLBACK=false to require
    # the connector annotation (legacy behavior).
    DISCOVERY_PROBE_FALLBACK: "true"
    DISCOVERY_PROBE_PATHS: "/mcp,/rest/mcp,/soap/mcp"
    DISCOVERY_PROBE_NEGATIVE_TTL_MS: "450000"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# =====================================================================
# tp-mcp-gateway-proxy sidecar — CP auth (Path A :81) + anti-spoofing (Path B :80)
# =====================================================================
tibcoProxy:
  enabled: false
  # PCP-23125: BARE NAME, resolver-prefixed. Same rules as discovery.image above.
  image:
    repository: tp-mcp-gateway-proxy
    # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the proxy image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
    # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
    # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
    # it names the same image under both tags (re-resolved in the registry).
    tag: "1.22.4"
    digest: "sha256:9c4ee0b38b2a99cd4ae05e05123d35b2a2e2c12f6d73eac2534c1cd370ab5452"
    pullPolicy: IfNotPresent
  # trustCPNetwork: skip CIC token validation and trust the HAProxy network path.
  # Set true for POC/dev (cp-proxy IdM exchange not yet wired).
  # Set false for production (requires CP_DOMAIN and cp-proxy + IdM).
  #
  # ⚠️ THIS KEY IS READ BY LITE MODE ONLY. The mcp-stack sub-chart cannot see a top-level
  # value, so in FULL mode `--set tibcoProxy.trustCPNetwork=false` is a SILENT NO-OP and the
  # rendered env stays true. For full mode set
  #     global.tpMcpGateway.tibcoProxy.trustCPNetwork
  # instead (PCP-23986 added it; before that, full mode hardcoded "true" and the setting was
  # not reachable at all). Same split as tibcoProxy.enabled <-> global.tpMcpGateway.
  # tibcoProxy.enabled, documented at the top of this file.
  trustCPNetwork: true
  platformAdminEmail: "mcp-hub-admin@platform.local"
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

# =====================================================================
# dial-home sidecar (B1 · PCP-20284) — standalone-customer dial-home agent
# =====================================================================
# A 4th LITE sidecar that dials home to a TP-hosted MCP Hub over a persistent
# WebSocket, so the Hub can push config to a gateway with NO inbound reachability
# (End-state 2, PCP-20277; design dial-home-control-channel.md §10). Gated OFF by
# default and LITE-ONLY. The agent is a SEPARATE TIBCO image built by build-image.yml
# (B3 · PCP-20286). Enabling REQUIRES tibcoProxy.enabled (loopback/proxy-trust, §4/§7.2)
# plus non-empty hub.url + hub.bootstrapTokenSecret.name/key + image.tag — all enforced
# at render time by templates/dialhome-validate.yaml (no silent :latest, no missing token).
#
# Customer command (rendered by the Hub, A2 — future): consolidated under dialHome.*
#   helm install ... --set dialHome.enabled=true \
#     --set dialHome.hub.url=<wss endpoint> \
#     --set dialHome.hub.bootstrapTokenSecret.name=<pre-created secret>
# (design §10 wrote these as hub.dialHome / hub.url; this chart is the source of truth
#  and consolidates them under dialHome.* — the Hub-rendered command targets these keys.)
dialHome:
  enabled: false
  # PCP-23125: BARE NAME, resolver-prefixed. Same rules as discovery.image above.
  image:
    repository: tp-mcp-gateway-dialhome-agent
    # Default tag is pinned here by release-alpha to the immutable build-image.yml tag
    # (<branch-slug>-<sha>). An ENABLED render with an EMPTY tag still fails fast
    # (templates/dialhome-validate.yaml) — never a silent :latest.
    # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the dialhome image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
    # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
    # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
    # it names the same image under both tags (re-resolved in the registry).
    tag: "1.22.4"
    digest: "sha256:ea867437979d5a67d547962d108e4310f315fe7bf7c6eb9a8f9fb96fe11e4790"
    pullPolicy: IfNotPresent
  hub:
    # The WSS endpoint THIS AGENT dials. For the standalone placement that is the Hub's
    # EXTERNAL address, taken from GET /config -> features.dialHome.hubUrl.
    #
    # ⚠️ PCP-24484: "external" describes the standalone case, not this key's definition. The
    # in-CP platform gateway runs inside the Control Plane and dials the Hub in-cluster, so a
    # .svc address is correct THERE. What must never become a .svc address is the value the
    # Hub PUBLISHES at /config, because that is what customers copy into their own --set: an
    # in-cluster address there would render a broken helm command on somebody else's cluster.
    # Two different values, one of which happens to feed the other in the standalone flow.
    url: ""
    # Bootstrap token delivered ONLY via a pre-created existingSecret — NEVER raw --set
    # (it leaks via Helm values / release metadata / shell history). Out of band:
    #   kubectl create secret generic <name> --from-file=token=<file>
    #
    # ⚠️ PCP-24484 — the "never chart-generated" half of this rule used to be stated
    # absolutely, and it is CONDITIONAL. Corrected here because a rule that reads like
    # fastidiousness is the kind the next person routes around:
    #
    #   Chart-generating a bootstrap token is INERT unless something writes the matching hash
    #   onto that gateway's row. In the STANDALONE flow nothing does — the mint API is the
    #   sole writer of gateways.bootstrap_token_hash — so the prohibition holds there
    #   unconditionally, and a chart-generated token simply never authenticates. The IN-CP
    #   placement has such a writer (the Hub's boot-time reconciler, which hashes the Secret
    #   this chart is handed), so there it is the supported mechanism.
    #
    # ⛔ Even with a writer present, ALL THREE of these must hold:
    #   1. the value handed to the agent is the full `<gatewayId>.<secret>`, and gatewayId is
    #      the PRIMARY KEY of the row that was upserted — the Hub splits on the first dot and
    #      looks the row up by that half. It is not "a prefix"; it is that row's id.
    #   2. the hash is written THROUGH UTM — bootstrap_token_hash is encrypted at rest, so any
    #      writer that bypasses it (raw SQL, a chart Job, a psql migration) stores something
    #      that decrypts into garbage on read.
    #   3. the row is stamped with the Hub pod's REGION — the auth lookup is region-scoped.
    #      This one works fine in a single-region deployment and only fails where regions share
    #      a database, so a local test cannot see it.
    #
    # ⭐ All three fail IDENTICALLY, and they fail looking like a bad token while the token is
    # perfectly correct — because on the Hub side the lookup IS the authentication: the row is
    # found by (id, region) and the hash compared in the same step, so "wrong credential" and
    # "right credential, row not visible to this query" are the same event. Revocation is a
    # fourth cause with the same symptom. Keep this list next to the rule: the rule says what
    # to do, this says what you will see when it is wrong.
    bootstrapTokenSecret:
      name: ""
      key: "token"
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
  # ---------------------------------------------------------------------
  # Outbound-only egress posture (B4 · PCP-20287) — OPT-IN, default OFF.
  # ---------------------------------------------------------------------
  # The point of dial-home: the gateway needs ZERO inbound and only ONE outbound
  # connection (WSS:443 to the Hub). Set egress.enabled=true to emit a pod-scoped
  # NetworkPolicy (templates/dialhome-egress-networkpolicy.yaml) that default-denies
  # all egress from the lite gateway pod except the Hub (hubCIDRs:hubPort), DNS, and
  # anything in extraEgress. Default OFF → no NetworkPolicy is rendered (byte-stable).
  # Decoupled from dialHome.enabled (a lite gateway can lock egress independently).
  # Design rationale: dial-home-control-channel.md §7.3.
  #
  # ⚠ HONEST LIMIT: stock k8s NetworkPolicy CANNOT match egress by DNS hostname — you
  #   MUST supply the Hub's external IP/CIDR(s). For hostname-scoped egress use an
  #   FQDN-capable CNI (Cilium toFQDNs / Calico) or an egress gateway (documented-only).
  # ⚠ POD-SCOPED: this governs the WHOLE gateway pod's egress, not just the dial-home
  #   sidecar. The chart's DEFAULT-ON features are DENIED unless added to extraEgress:
  #     - discovery (discovery.enabled, default true) → the K8s API server + the
  #       in-cluster MCP Services it probes (arbitrary in-cluster probing is at odds
  #       with a tight posture — disable discovery or widen extraEgress);
  #     - OpenTelemetry (global.otel.enabled, default true) → the in-cluster o11y
  #       collector (else traces are silently dropped);
  #     - tp-mcp-gateway-proxy (tibcoProxy.enabled) → the Control Plane (cp-proxy / IdM);
  #     - any backend MCP / SOAP / REST / WSDL servers the gateway proxies to.
  # ⚠ ADDITIVE: on a bare standalone cluster this IS your egress posture (authoritative);
  #   on a TIBCO DP it UNIONS with the platform policy — also set
  #   global.networkPolicy.internetAll=disable for a true lock-down.
  egress:
    enabled: false
    # REQUIRED when enabled — the Hub's external IP/CIDR(s). Empty => render FAILS
    # (fail-closed; never emits an empty `to` = allow-all). e.g. ["203.0.113.10/32"].
    hubCIDRs: []
    hubPort: 443
    # Allow DNS (UDP+TCP :53 to any destination). Keep true — a non-empty egress policy
    # is default-deny, so the agent needs DNS to resolve the Hub hostname.
    allowDNS: true
    # Raw NetworkPolicyEgressRule[] passed through verbatim (NOT validated — an empty
    # `to:` is allow-all; supply constrained ipBlock/selectors). Add the in-cluster /
    # backend targets the pod-scoped policy would otherwise deny, e.g.:
    #   extraEgress:
    #     - to:                                    # backend MCP/SOAP/REST server
    #         - ipBlock: { cidr: 10.0.0.0/8 }
    #       ports: [ { protocol: TCP, port: 443 } ]
    #     - to:                                    # K8s API server (discovery.enabled)
    #         - ipBlock: { cidr: 10.96.0.1/32 }
    #       ports: [ { protocol: TCP, port: 443 } ]
    extraEgress: []
    annotations: {}

# =====================================================================
# Lite mode — single pod, SQLite, memory cache
# =====================================================================
# ⚠ PCP-23089 — TAG AND DIGEST MUST MOVE TOGETHER. release-alpha.sh always writes both from
# ONE build, but a HAND override does not: `helm upgrade --reuse-values --set ...image.tag=X`
# keeps the PREVIOUS digest, and the pair then deploys the OLD content under the NEW version
# string — the pod reports X while running what X replaced. Nothing detects it: the reference
# is well-formed, the digest resolves, and the runtime correctly obeys the digest. If you set
# a tag by hand, set the matching digest in the SAME command, or clear it (`--set
# ...image.digest=`) to fall back to tag-only. Same caveat for every image block in this file
# that declares a `digest` key. The mirrored third-party images now differ (PCP-23215): fluentbit
# here still declares none, mcp-stack redis.image declares a singular `digest` (one container, one
# tag), and mcp-stack postgres.image declares `digests` — a map KEYED BY MAJOR, because that one
# block renders at :17 on the restore init containers and :18 on the main container and the
# migration-check Job. The singular postgres.image.digest is REFUSED at render time, by name,
# pointing at the map. All three default to un-pinned and nothing writes them: release-alpha.sh
# pins only the first-party images it builds, so a mirrored image is pinned by hand at a mirror
# refresh. The postgres map is all-or-nothing per render — pin every major that render builds, or
# none — so the tag/digest-move-together caveat above applies per entry.
lite:
  enabled: false
  # PCP-23125: BARE NAME, resolver-prefixed. Same rules as discovery.image above.
  image:
    repository: tp-mcp-gateway
    # PCP-20131: MUST stay in sync with the MCP Hub recipe pin
    # (charts/tibco-cp-mcp-hub/charts/mcp-hub-recipes/values.yaml mcpGateway.image.tag,
    #  and the parent override charts/tibco-cp-mcp-hub/values.yaml). A fresh provision
    # falls back to this default, so divergence ships a stale gateway image even when the
    # recipe pins a newer one. Bump all FIVE refs together (see the gateway-chart checklist):
    #   1. this lite.image.tag
    #   2. mcp-stack.mcpContextForge.image.tag (full mode runs the same TIBCO image)
    #   3. mcp-stack.migration.image.tag       (DB migration Job uses the same image)
    #   4. charts/tibco-cp-mcp-hub/charts/mcp-hub-recipes/values.yaml mcpGateway.image.tag
    #   5. charts/tibco-cp-mcp-hub/values.yaml mcpGateway.image.tag (parent override)
    # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the gateway image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
    # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
    # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
    # it names the same image under both tags (re-resolved in the registry).
    tag: "1.22.4"
    digest: "sha256:e995b0a8ce9a2cbb77d2674f44360a2bc7a34393b1e28d146ccd52e75bf23294"
    pullPolicy: IfNotPresent
  replicas: 1
  storage:
    size: 1Gi
    className: ""
  # PCP-22959: the lite gateway keeps its sqlite DB on the `storage:` PVC above, mounted at
  # /data, while the container runs as the image's non-root user (uid/gid 10001 — see
  # tp-mcp-gateway/Containerfile). A newly provisioned volume is handed to the pod as
  # root:root 0755, so without an fsGroup the kubelet never chowns it: sqlite cannot create
  # /data/mcp.db and every cold start dies in wait_for_db_ready with "Database not ready
  # after 30 attempts" -> permanent CrashLoopBackOff. Reproduced on AWS EKS StorageClass gp2.
  #
  # fsGroup does NOT have to equal the image's gid to work (the kubelet chowns the volume to
  # root:<fsGroup> with g+rwx AND adds <fsGroup> to every container's supplementary groups),
  # but matching 10001 keeps the on-disk owner aligned with the process's primary group.
  #
  # Applies pod-wide: the two emptyDirs (/tmp, /var/log/mcpgateway) are also chowned to this
  # gid. That is safe — the fluentbit sidecar runs as uid 1000 but receives this fsGroup as a
  # supplementary group, so it keeps write access to the shared log dir.
  #
  # NB the template renders these two keys with `dig` defaults, so the fix survives a
  # `helm upgrade --reuse-values` that replays a values map predating this key. Overriding
  # the map here still works; it is exposed for volume plugins that ignore fsGroup entirely
  # (NFS/EFS-style StorageClasses — block SCs such as gp2 honour it).
  # ⚠️ KEEP IN SYNC with the `dig` inline defaults in templates/lite-deployment.yaml. Both values
  # below are encoded twice on purpose — the template's inline default is the `--reuse-values`
  # fail-safe — but that makes this a quiet drift surface: editing ONLY this file to change the
  # gid still yields the template's default on any `--reuse-values` upgrade. Change both together.
  podSecurityContext:
    fsGroup: 10001
    # OnRootMismatch: skip the recursive chown when ownership is already correct (fast
    # restarts), but still fix an existing root:root volume on the next mount.
    fsGroupChangePolicy: OnRootMismatch
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # PCP-22882: how long a COLD START may take before kubelet gives up. A first boot on a fresh
  # volume runs the full alembic revision set (120 revisions) against sqlite:////data/mcp.db in
  # the single worker's lifespan; the liveness probe must not own that window (it used to, and
  # killed the pod at ~150s on every restart — a permanent CrashLoopBackOff).
  #
  # Default (120-1) x 10s = ~1190s (~20 min). Raise failureThreshold on slow storage — but it is
  # only the FIRST of three ceilings, and past ~30 min the other two bite (see below and the
  # comment on startupProbe in lite-deployment.yaml):
  #     startupProbe ~20 min  <  progressDeadlineSeconds 25 min  <  GUNICORN_TIMEOUT 30 min
  #
  # NB the earlier "~13 min DB-readiness budget" justification was the wrong yardstick: on sqlite
  # wait_for_db_ready succeeds on the first attempt, so that budget is never spent here. The real
  # cost is the alembic chain — these numbers are headroom, not a measurement.
  #
  # PCP-22959: the alembic chain now HAS one observation — 27.3s end to end on a live EKS gp2 pod
  # (all 120 revisions; the sqlite probe returned in 0.18s, confirming the retraction above). The
  # numbers below are deliberately NOT re-sized off it: n=1 and best-case (fresh 1Gi gp2 with a
  # full burst-credit balance, image already on the node, idle node), so it is a floor rather than
  # a representative figure. Undersizing re-creates PCP-22882's self-perpetuating CrashLoopBackOff;
  # oversizing costs one slow restart. Re-size when there are samples from slow storage and an
  # exhausted burst balance — see the full rationale on startupProbe in lite-deployment.yaml.
  startupProbe:
    periodSeconds: 10
    failureThreshold: 120
    # k8s defaults this to 1s; during migration the proxy front holds the connection rather than
    # answering, so 1s would fail every tick for the wrong reason.
    timeoutSeconds: 5
  # Must exceed the startupProbe budget, or `kubectl rollout status` / `helm --wait` declare
  # ProgressDeadlineExceeded on a pod that is still legitimately starting. (The production DP
  # path does not wait, but operator and CI paths do.)
  progressDeadlineSeconds: 1500
  # PCP-20564: lite ships SECURE application-auth defaults (require auth, no unauthenticated
  # admin, non-wildcard CORS). Set insecureLocalDev=true to restore the fully-open local-dev
  # posture (re-opens MCP_REQUIRE_AUTH / AUTH_REQUIRED / ALLOW_UNAUTHENTICATED_ADMIN /
  # ALLOWED_ORIGINS). Do NOT enable outside genuine local dev — real deployments are fronted
  # (CP->DP proxy chain) and inherit the secure defaults. (SSRF is unaffected; see its note below.)
  insecureLocalDev: false
  # LITE-ONLY gateway settings. Anything shared with full mode now lives ONCE in
  # global.tpMcpGateway.config, which is merged OVER this map at render time — see
  # that section for the list and for why these particular keys stayed behind
  # (they are lite-runtime specific, or their correct value differs by mode).
  config:
    HOST: "0.0.0.0"
    DATABASE_URL: "sqlite:////data/mcp.db"
    CACHE_TYPE: "memory"
    PLUGINS_CONFIG_FILE: "plugins/config.yaml"
    GUNICORN_WORKERS: "1"
    # PCP-25546: relays a federated server's elicitation/sampling/roots to the client (code
    # default off). Safe without affinity/Redis only because lite is 1 replica + 1 worker
    # (enforced by mode-validate.yaml).
    MCPGATEWAY_FEDERATION_SERVER_REQUESTS_ENABLED: "true"
    # PCP-22882: MUST be set here, and MUST stay above the startupProbe budget. gunicorn's
    # arbiter SIGABRTs a worker whose heartbeat is stale, and under UvicornWorker the heartbeat
    # only begins after Server.startup() — i.e. after the lifespan, which is exactly the slow
    # part. So a cold start longer than this is killed no matter what any probe says. lite used
    # to inherit run-gunicorn.sh's 600s default while the probe also budgeted ~600s: the two
    # collided and the documented failureThreshold knob silently stopped working. Full mode has
    # always set this explicitly (mcp-stack/values.yaml).
    GUNICORN_TIMEOUT: "1800"
    # PCP-22882: the gateway's own default is ERROR (config.py), and every DB-readiness retry
    # logs at DEBUG — so the entire cold-start window was pitch black, which is why this bug
    # presented as a hang. Full mode already ships INFO; lite never did.
    LOG_LEVEL: "INFO"
    DB_SQLITE_BUSY_TIMEOUT: "5000"
    # PCP-24140: without this, setup_metrics never registers /metrics/prometheus on lite, so
    # every gateway counter (including the write-interlock decisions counter) increments
    # in-process and is never scraped. Full mode has always set it, in the sub-chart's own
    # values (charts/mcp-stack/values.yaml); lite never did.
    #
    # ⚠️ WHY HERE AND NOT IN global.tpMcpGateway.config, which is where a both-modes key
    # belongs by the contract above. Raised in review, and the contract is right — this is a
    # deferral, not a disagreement. Measured, not assumed:
    #   * Both placements render identically for lite — ENABLE_METRICS reaches the container
    #     env exactly once, value "true", either way. Nothing about lite behaviour turns on it.
    #   * Moving it puts the key in the SHARED gateway-cfg ConfigMap, which changes that
    #     ConfigMap's content-hash suffix and its three references. The base-parity legs
    #     ([5]/[8]) report that as chart-wide drift, and the only normalisation available is
    #     one that blinds them to the gateway-cfg ConfigMap ENTIRELY — every future change to
    #     it, not just this key. That is a far worse trade than the plugin-block rule in this
    #     same PR, which is at least content-pinned.
    #   * Retiring the sub-chart's copy — the actual prize for moving — cannot happen here
    #     anyway: it is vendored, and this chart deliberately keeps that tree unpatched.
    # So the move belongs with the sub-chart retirement, as one change that pays the parity
    # cost once and deletes a duplicate rather than adding a second. Filed as the follow-up.
    ENABLE_METRICS: "true"
    # PCP-24264: SQLite on a network-filesystem PVC (SMB/CIFS, and NFS without lockd). MEASURED on a
    # real kernel cifs/SMB3 mount, single process, no concurrency: the very first schema write
    # (`CREATE TABLE alembic_version`) fails with "database is locked" after the FULL busy timeout
    # above, because SMB byte-range locks are per-handle and non-convertible — strace shows
    # fcntl(F_SETLK, F_WRLCK, start=1073741826, len=510) = EACCES, i.e. SQLite's own held SHARED
    # read lock refuses SQLite's own SHARED->EXCLUSIVE upgrade. Raising DB_SQLITE_BUSY_TIMEOUT does
    # NOT help; it only lengthens the CrashLoop. The gateway's fix is to open the DB through the
    # `unix-dotfile` VFS, which locks with a `<db>.lock` directory instead of byte ranges (measured:
    # the same CREATE TABLE completes in 0.12s with journal_mode=delete and data intact).
    #
    #   "auto" (default) elects unix-dotfile ONLY when a behavioural probe actually fails — fstype
    #          outside the local allowlist AND the lock-UPGRADE probe is refused AND a real SQLite
    #          write probe fails. On any healthy volume the URL is returned UNCHANGED, so this is a
    #          strict no-op on every existing install.
    #   "off"  the rollback: one value, no image change. Restores today's behaviour exactly.
    #   "on"   force the conversion. Still gated by the SQLite-header check (see the WAL warning
    #          below), so even "on" can never open a WAL database under unix-dotfile.
    #
    # ⚠️ unix-dotfile CANNOT open a WAL database at all ("unable to open database file"), and WAL is
    # recorded in the file header, so it survives a clean close with no -wal/-shm on disk. The
    # gateway therefore refuses dotfile on any WAL header and converts the volume first. Do NOT
    # add a journal-mode knob here: `PRAGMA journal_mode=WAL` fails SILENTLY on a converted volume
    # (it returns the PRIOR mode rather than raising), so the knob would look applied and do nothing.
    #
    # Strictly better where you control storage: a block-backed lite.storage.className, or `nobrl`
    # in the StorageClass mountOptions (MEASURED: with nobrl the default VFS works AND WAL works, so
    # no conversion is needed) — but mountOptions are recorded on the PV at provision time and are
    # NOT retroactive to volumes that already exist.
    DB_SQLITE_NETWORK_FS: "auto"
    # PCP-24264: reap a stale `<db>.lock` DIRECTORY left behind by a hard kill. MANDATORY in
    # practice, not a nicety: MEASURED on real cifs that SIGKILLing a process holding the dotlock
    # leaves the directory on the share, and every subsequent boot then fails with the
    # byte-identical string "database is locked" after the full busy timeout — permanently. Without
    # the reaper, converting the volume turns a first-boot crash into a post-first-write one whose
    # symptom is indistinguishable from the bug this setting exists to fix. Reaping does NOT bypass
    # crash recovery: the separate `-journal` file still drives the rollback (measured).
    #
    # WHAT ACTUALLY GATES IT, stated precisely because an earlier version of this comment claimed a
    # gate that does not exist ("the lite /data path" — grep confirms NO path check in either
    # runtime module, and inventing one in a comment is how a reviewer ends up trusting a guard
    # that is not there): the reaper runs only from the SQLite URL resolver, and only once that
    # resolver has ELECTED the unix-dotfile VFS for the database it was handed; it then requires
    # the single-writer proof (GATEWAY_REPLICAS == 1, forced from lite.replicas by
    # lite-deployment.yaml), a real and EMPTY lock DIRECTORY, and an mtime older than a floor.
    # NOTHING keys on the path. What keeps it out of full mode is this key living in `lite.config`
    # and never in the shared `global.tpMcpGateway.config` map (asserted by case [4] of
    # dev/mcp-gateway-render-tests/sqlite-netfs-assert.sh) plus full mode's dialect being postgres,
    # so no SQLite URL is ever resolved there. Keep it here.
    DB_SQLITE_NETFS_REAP_STALE_LOCK: "true"
    # PCP-24264: the THIRD switch, and the only one that rewrites bytes INSIDE the customer's
    # database. It was read by the runtime (config.py `db_sqlite_netfs_offline_unwal`, default
    # true) and declared NOWHERE in this chart, which made the surfaced choice a false binary:
    # accept the header rewrite, or set DB_SQLITE_NETWORK_FS="off" and keep the CrashLoop. The
    # middle option existed in the image and in no values file anyone reads.
    #
    # What it gates: converting an ALREADY-EXISTING WAL database to rollback-journal mode by
    # flipping header bytes 18-19 offline, after a verified backup, when the online
    # `PRAGMA journal_mode=DELETE` cannot run — which on a share whose locking is broken is
    # always. Set it "false" to keep the VFS election and the reaper while refusing that rewrite:
    # a volume whose database is already rollback-journal (or empty, or not yet created) still
    # converts and boots; one carrying a WAL header is REFUSED with the reason named, and the pod
    # keeps failing until the storage is fixed. That is the right knob for a site whose policy
    # forbids in-place mutation of a database file, and it is not reachable any other way.
    DB_SQLITE_NETFS_OFFLINE_UNWAL: "true"
    # MCP_CLIENT_AUTH_ENABLED selects the auth METHOD: "true" = JWT/cookie only (the trusted-proxy
    # header is never read); "false" = trusted-proxy-header path (+ Bearer fallback). "true" is the
    # correct default for a non-proxy lite install (clients present a gateway-issued token).
    # PCP-20564: when tibcoProxy.enabled=true, lite-deployment.yaml AUTO-emits this as "false" (the
    # sidecar terminates auth on Path A and injects X-Authenticated-User), so require-auth is
    # satisfied by the trusted proxy identity — no manual operator step (removes the old footgun).
    MCP_CLIENT_AUTH_ENABLED: "true"
    # PCP-20564: SECURE-BY-DEFAULT. Lite requires auth out of the box. A fronting tibcoProxy satisfies
    # it via the injected identity (MCP_CLIENT_AUTH_ENABLED auto-"false", above); a bare install
    # authenticates with a gateway-issued token. Hub-issued tokens still enforce scoping (server_id /
    # ip_restrictions / permissions / time_restrictions) + revocation. For genuine local dev with no
    # auth, set lite.insecureLocalDev=true (re-opens these). ALLOWED_ORIGINS is rendered by
    # lite-deployment.yaml (the public origin when known, else localhost) — do NOT hardcode a wildcard.
    MCP_REQUIRE_AUTH: "true"
    AUTH_REQUIRED: "true"
    ALLOW_UNAUTHENTICATED_ADMIN: "false"
    # NOTE: PLATFORM_ADMIN_TEAM_ID is intentionally NOT set. The gateway bootstraps
    # a fixed, well-known "MCP Hub System" team (ensure_mcphub_system_team in
    # bootstrap_db.py) that Hub pins all tools + plugin bindings to. This replaced
    # the per-DP team-id handshake (Hub no longer generates or injects an id).
  secret:
    # PCP-20165 SA-16: no weak static secrets. Empty values are STRONG-secret-generated
    # by templates/lite-secret.yaml (idempotent: reuse-if-strong-else-mint). An operator
    # may still supply a value to override. Rotate any value that was ever shipped weak.
    JWT_SECRET_KEY: ""
    AUTH_ENCRYPTION_SECRET: ""
    BASIC_AUTH_PASSWORD: ""
    DEFAULT_USER_PASSWORD: ""
    PLATFORM_ADMIN_EMAIL: "mcp-hub-admin@platform.local"
    PLATFORM_ADMIN_PASSWORD: ""
  # NOTE: lite mode no longer renders a dedicated default Ingress. The gateway's
  # public Ingress is selected by the ingress controller via
  # global.cp.resources.ingress.{ingressController,fqdn,ingressClassName}
  # (injected by the CP/orchestrator), rendering the per-controller
  # templates/ingress-<controller>.yaml in both lite and full mode. This removes
  # the previous duplicate-Ingress-for-one-FQDN that occurred when a lite deploy
  # had both the default lite ingress and a per-controller public ingress.

# =====================================================================
# Full mode — upstream mcp-stack sub-chart overrides
# =====================================================================
mcp-stack:
  enabled: true

  # PCP-25281: the RateLimiterPlugin "redis" backend fragment, substituted into
  # RATE_LIMITER_BACKEND_BLOCK_PLACEHOLDER (plugins.config, top of this file) by
  # templates/configmap-gateway-plugin.yaml ONLY when real Redis is reachable here
  # (redis.enabled or redis.external.enabled) -- memory otherwise. Lives under this
  # subchart's own values block (not under the parent's `plugins:`) because a subchart
  # template's `.Values` is the SUBCHART's own namespace: Helm passes a parent's plain
  # top-level keys into a subchart only via `global.*` or by nesting under the subchart's
  # own key, which is exactly this `mcp-stack:` block -- never a parent sibling key.
  rateLimiterRedisBlock: |
    backend: "redis"
    redis_url: '{{ env.RATELIMITER_REDIS_URL | default(env.REDIS_URL | default("redis://redis:6379/0")) }}'
    redis_key_prefix: "rl"
    fail_mode: "open"
    algorithm: "fixed_window"

  # Disable CRDs not permitted by DP service account
  networkPolicies:
    enabled: false

  # PCP-25126: cadvisor is OPT-IN. The upstream sub-chart defaults it ON with
  # `privileged: true` and hostPath mounts of /, /var/run, /sys and /var/lib/docker, which
  # a namespace-bound Data Plane must never get by accident. Today it is only reachable via
  # the outer `monitoring.enabled` gate (default false), so this changes no current render —
  # it removes the latent path where turning on monitoring silently brings a privileged pod.
  # Overridden HERE, not in charts/mcp-stack/values.yaml: that file is vendored from upstream
  # ContextForge and a sync would revert an edit to its default.
  monitoring:
    cadvisor:
      enabled: false

  migration:
    # The DB migration Job must run the SAME private TIBCO gateway image as the app (the
    # sub-chart defaults it to the public IBM image). Keep the tag in sync with
    # mcpContextForge.image above.
    # PCP-23125: BARE NAME — charts/mcp-stack/templates/job-migration.yaml composes
    # <mcp-stack.image.registry>/<mcp-stack.image.repository>/<this> and passes it to the
    # mcp-stack.image helper.
    image:
      repository: tp-mcp-gateway
      # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the gateway image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
      # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
      # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
      # it names the same image under both tags (re-resolved in the registry).
      tag: "1.22.4"
      digest: "sha256:e995b0a8ce9a2cbb77d2674f44360a2bc7a34393b1e28d146ccd52e75bf23294"
      pullPolicy: IfNotPresent

  mcpContextForge:
    # Full mode runs the SAME TIBCO gateway image as lite (not the floating upstream
    # ghcr.io/ibm/mcp-context-forge:latest). Keeps lite+full in lockstep and removes the
    # floating-tag crash root cause. Keep this tag in sync with lite.image.tag and the MCP
    # Hub recipe pins.
    # PCP-23125: BARE NAME — charts/mcp-stack/templates/deployment-mcpgateway.yaml composes
    # <mcp-stack.image.registry>/<mcp-stack.image.repository>/<this> and passes it to the
    # mcp-stack.image helper.
    image:
      repository: tp-mcp-gateway
      # 1.22 RESPIN candidate 2 (PCP-27433): releases-1.22-f4a4dc0, pinned by the gateway image's own digest (tp-mcp-gateway releases/1.22 @ f4a4dc0, build-image run 40631698428, signed).
      # 1.22.4 GA (PCP-25657): the candidate-2 image promoted to the customer-facing tag 1.22.4 by tibco/tp-mcp-hub
      # release-promote-images.yml (real run 40725807007, dry run 40725670040; digest-preserving alias, -dev). The digest below is UNCHANGED:
      # it names the same image under both tags (re-resolved in the registry).
      tag: "1.22.4"
      digest: "sha256:e995b0a8ce9a2cbb77d2674f44360a2bc7a34393b1e28d146ccd52e75bf23294"
      pullPolicy: IfNotPresent
    secret:
      # Clamp JWT validity to the upstream cap: mcp-context-forge rejects token_expiry > 1440
      # (le=1440, 24h) at startup and crashes full mode. Authoritative parent override — beats
      # the sub-chart default and survives an upstream re-vendor of mcp-stack.
      TOKEN_EXPIRY: "1440"
    # PCP-20471: cap the gateway HPA envelope to the PRD's 2–5 range (docs/design/mcp-hub-prd
    # deployment-architecture). The vendored mcp-stack sub-chart defaults min2/max10; pin
    # minReplicas explicitly (matches the sub-chart default) so the 2–5 envelope can't drift,
    # and lower maxReplicas 10→5. Deep-merges with the sub-chart mcpContextForge.hpa block, so
    # enabled:true + the CPU/memory targets are preserved.
    hpa:
      minReplicas: 2
      maxReplicas: 5
    # FULL-MODE-ONLY gateway settings. Anything shared with lite now lives ONCE in
    # global.tpMcpGateway.config, which reaches this container through
    # mcpContextForge.extraEnvFrom (mounted LAST, so it outranks both this ConfigMap
    # and the sub-chart's own) — see that section for the list and the rationale.
    config:
      APP_ROOT_PATH: "/tibco/agent/integration/mcp-gateway"
      AUTH_REQUIRED: "false"
      # MCP_REQUIRE_AUTH stays false in the DEFAULT full-mode render — the tp-mcp-gateway-proxy
      # sidecar is OPT-IN (default OFF, gated on global.tpMcpGateway.tibcoProxy.enabled), so
      # by default there is no Path A handler injecting X-Authenticated-User on CP→DP traffic.
      # TIBCO-PROXY: when you set global.tpMcpGateway.tibcoProxy.enabled=true,
      # mirror lite and flip this to "true" — the sidecar terminates auth on Path A and Bearer
      # tokens flow on Path B, so the gateway should reject unauthenticated MCP requests. You must
      # ALSO set MCP_CLIENT_AUTH_ENABLED: "false" manually — it is NOT auto-flipped by any template.
      # Only the loopback/proxy-trust env + flipped probe ports are auto-applied by the gated
      # LOCAL TIBCO MOD block in the sub-chart's deployment template.
      MCP_REQUIRE_AUTH: "false"
      ALLOW_UNAUTHENTICATED_ADMIN: "true"
      # PCP-20592: enable Redis pub/sub session-affinity so Streamable-HTTP sessions survive cross-replica/cross-worker round-robin (-32600). Hard-requires USE_STATEFUL_SESSIONS=true (now set once in global.tpMcpGateway.config) + CACHE_TYPE=redis (below). Needs the gateway image with the in-process affinity dispatch + per-worker WORKER_ID fix (tp-mcp-gateway #101).
      MCPGATEWAY_SESSION_AFFINITY_ENABLED: "true"
      # PCP-20592: pin explicitly (was only inherited from the mcp-stack subchart default) so the session-affinity hard-requirement cannot silently drift.
      CACHE_TYPE: "redis"
      # PCP-21836 (follow-up to PCP-21805): turn ON the federated upstream server-initiated request broker (elicitation / sampling / roots). Code-side default is OFF (deliberate safe default; enablement is chart-side). Rides on the exact full-mode config verified in PCP-21805 (16-worker gunicorn + Redis): hard-requires MCPGATEWAY_SESSION_AFFINITY_ENABLED=true + CACHE_TYPE=redis (both above) + USE_STATEFUL_SESSIONS=true (global.tpMcpGateway.config). Do NOT enable in lite mode (CACHE_TYPE=memory) unless single-worker — the in-memory event bus is worker-local.
      MCPGATEWAY_FEDERATION_SERVER_REQUESTS_ENABLED: "true"
      # PLATFORM_ADMIN_TEAM_ID intentionally unset — see lite.config note above.
    ingress:
      enabled: false
    metrics:
      serviceMonitor:
        enabled: false
    pluginConfig:
      enabled: true
      plugins: *plugins_config
    # =================================================================
    # Discovery + tp-mcp-gateway-proxy sidecars — see global.tpMcpGateway
    # =================================================================
    # The full-mode discovery + tp-mcp-gateway-proxy sidecars are NO LONGER wired from here. Helm
    # does not pass a parent's top-level .Values into a sub-chart (only global.* propagates),
    # so values set here could not be toggled at install time. Instead the sidecars live in a
    # dedicated, gated LOCAL TIBCO MOD block INSIDE the vendored sub-chart
    # templates (charts/mcp-stack/templates/deployment-mcpgateway.yaml + service-mcp.yaml),
    # gated on the sub-chart-visible global flags:
    #   global.tpMcpGateway.discovery.enabled   (default true)  -> discovery container + :8080 port + k8s-api pod label
    #   global.tpMcpGateway.tibcoProxy.enabled  (default false) -> tp-mcp-gateway-proxy container + 80/81 ports + gateway auth/probe rewire
    # Those literals are KEPT IN SYNC with templates/lite-deployment.yaml / lite-service.yaml
    # and the top-level discovery.* / tibcoProxy.* defaults (the sub-chart can't read them).
    #
    # The generic re-vendor-safe hooks below (extraContainers / extraPodLabels /
    # service.extraPorts) remain declared but EMPTY — they are the ticket's requested generic
    # extension point and are additive to the gated block above.
    extraContainers: []
    extraPodLabels: {}
    service:
      type: ClusterIP
      port: 80
      extraPorts: []
    # PCP-20165 SA-16: the parent no longer forces REQUIRE_STRONG_SECRETS:"false" — the
    # sub-chart default ("true", with ENVIRONMENT=production) now stands, so weak/empty
    # gateway secrets fail closed. The sensitive secret keys are strong-secret-generated
    # (charts/mcp-stack/templates/secret-gateway.yaml), so the gate passes by default.
    # PCP-20050: APP_DOMAIN (+ APP_ROOT_PATH when publicApi.pathPrefix is set) for full mode.
    # Sub-chart values can't be templated, so the derived values are rendered into the wrapper
    # ConfigMap "<release>-oauth" (templates/oauth-configmap.yaml) and pulled in here (the
    # name below is tpl-rendered by the sub-chart to that release-scoped name; PCP-20591).
    # Ordered after the sub-chart's own gateway-config in envFrom, so these override the
    # placeholders (APP_DOMAIN https://gateway.local; APP_ROOT_PATH the internal-HAProxy literal).
    # optional: pod still starts if the ConfigMap is absent.
    # name is a template string: the sub-chart tpl-renders it to the release-scoped ConfigMap
    # (templates/oauth-configmap.yaml -> <release>-oauth) so multiple gateways co-exist per DP (PCP-20591).
    extraEnvFrom:
      - configMapRef:
          name: '{{ .Release.Name }}-oauth'
          optional: true
      # The shared global.tpMcpGateway.config map, rendered by
      # templates/gateway-config-configmap.yaml. Ordered LAST on purpose: envFrom is
      # last-wins, so this is the one place that overrides BOTH the sub-chart's gateway
      # ConfigMap and its Secret — which is what makes it a usable override point for an
      # operator and for MCP Hub's deploy wizard. optional: true so a deployment that
      # clears the shared map still starts.
      # ⚠️ CHARACTER-IDENTICAL to the name in templates/gateway-config-configmap.yaml. This string is
      # tpl-rendered by the sub-chart, so it computes the same content hash; that is what makes a
      # config change alter the pod template and roll the pods. A drift between the two expressions
      # points this at a non-existent ConfigMap, and `optional: true` makes that failure SILENT.
      - configMapRef:
          name: '{{ .Release.Name }}-gateway-cfg-{{ toJson (dig "tpMcpGateway" "config" dict .Values.global) | sha256sum | trunc 8 }}'
          optional: true

  mcpFastTimeServer:
    enabled: false

  postgres:
    enabled: false
    external:
      enabled: true
      # No DB hostname is shipped in version control either. This used to default to
      # postgresql.tibco-ext.svc.cluster.local — a CONTROL-PLANE in-cluster Service name that
      # does not resolve from a customer-run Data Plane, so the default silently pointed every
      # shippable install at a host it can never reach. Blank by default: the operator must
      # supply it, or it is injected from a CP DBCONFIG resource
      # (global.cp.resources.dbconfig.*), same channel as the credential below.
      host: ""
      port: 5432
      database: mcpforgedb
      # PCP-21192: no usable DB credential is shipped in version control. Supply one via a
      # CP DBCONFIG resource (global.cp.resources.dbconfig.*), postgres.external.existingSecret,
      # or an explicit postgres.external.user / password. Blank by default (was "postgres/postgres",
      # a guessable shared-CP literal). port/database above are non-secret topology hints.
      user: ""
      password: ""
      # PCP-21192: recommended escape hatch — name a pre-created Secret holding the DB
      # credential (key names per the *Key fields). When set, it is used instead of the
      # user/password above and the chart skips rendering the literal Secret.
      existingSecret: ""
