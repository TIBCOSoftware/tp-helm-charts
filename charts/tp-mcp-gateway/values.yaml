# TIBCO Platform MCP Gateway — default values
#
# Two deployment modes — enable EXACTLY ONE (a render-time guard,
# templates/mode-validate.yaml, rejects both-on and both-off; PCP-20562):
#   Full (default): mcp-stack sub-chart with PostgreSQL + Redis
#                   (mcp-stack.enabled=true, lite.enabled=false)
#   Lite:           Single pod with SQLite + memory cache
#                   (lite.enabled=true AND mcp-stack.enabled=false; lite.replicas must be 1)
#
# Plugins are defined ONCE via YAML anchor and shared by both modes.

# -- DP identification (must be set per deployment)
dpName: ""
dataplaneId: ""
namespace: ""

# =====================================================================
# Network policy labels — mirrors the convention used by dp-flogo-app
# and dp-bwce-app. The DP namespace ships a NetworkPolicy that selects
# pods carrying ``networking.platform.tibco.com/internet-egress: enable``
# and permits egress to public CIDRs; pods without (or with the value
# set to "disable") are confined to in-cluster traffic only.
#
# Lives under ``global:`` so the same toggle reaches both deployment
# paths — the lite-mode deployment in this chart, and the
# deployment-mcpgateway template inside the mcp-stack sub-chart.
# (Helm propagates ``global.*`` to every sub-chart automatically.)
# =====================================================================

# =====================================================================
# Global CP values (auto-injected by orchestrator at deploy time)
# =====================================================================
global:
  # Bare-cluster private-registry pull secrets (PCP-20286 / B3). A list of
  # pre-created Secret NAMES (kubernetes.io/dockerconfigjson). Empty by default:
  # DP installs use the orchestrator-created `dataplaneId` secret, so the default
  # render is unchanged; a standalone customer on a bare cluster sets this to pull
  # the private TIBCO images. Under global.* so it also reaches the mcp-stack
  # sub-chart (which already honors global.imagePullSecrets).
  imagePullSecrets: []
  # See "Network policy labels" comment block above for the contract.
  networkPolicy:
    internetAll: enable        # "enable" allows outbound internet (e.g. external SOAP/REST/WSDL); "disable" blocks it
  # =====================================================================
  # Full-mode sidecar toggles
  # =====================================================================
  # The full-mode gateway runs inside the vendored mcp-stack sub-chart, which CANNOT read
  # this chart's top-level .Values.discovery / .Values.tibcoProxy — Helm propagates only
  # global.* into a sub-chart. These two flags are therefore the FULL-MODE equivalents of
  # the top-level discovery.enabled / tibcoProxy.enabled toggles (which only the lite
  # templates read). They gate a dedicated LOCAL TIBCO MOD block inside
  # charts/mcp-stack/templates/deployment-mcpgateway.yaml + service-mcp.yaml that inlines
  # the discovery + tp-mcp-gateway-proxy sidecars, mirroring lite-deployment.yaml / lite-service.yaml.
  #
  # The recipe/orchestrator MUST keep each pair in sync (set the global flag to the same
  # value as the top-level toggle) so lite and full installs behave identically:
  #   discovery.enabled   <-> global.tpMcpGateway.discovery.enabled
  #   tibcoProxy.enabled  <-> global.tpMcpGateway.tibcoProxy.enabled
  tpMcpGateway:
    # ─────────────────────────────────────────────────────────────────────────
    # Gateway configuration shared by BOTH deployment modes.
    #
    # WHY IT LIVES UNDER global: the vendored mcp-stack sub-chart can only read
    # `global.*` (Helm shares nothing else with a sub-chart), so a key that must
    # reach BOTH the lite Deployment and the full-mode one has exactly one home.
    # Before this section the same setting had to be written TWICE — once in
    # `lite.config` and once in `mcp-stack.mcpContextForge.config` — and kept in
    # step by hand. Of the two sides' keys only 16 names were even the same, and 4 of those 16
    # had DIFFERENT values (they are listed below and stayed put). This block is the single
    # source for the 12 that genuinely are shared.
    #
    # HOW IT IS APPLIED, and why it always wins:
    #   lite  → templates/lite-deployment.yaml merges it OVER `lite.config`
    #   full  → templates/gateway-config-configmap.yaml renders it into
    #           `<release>-gateway-cfg`, which `mcp-stack.mcpContextForge.extraEnvFrom`
    #           mounts LAST in the container's envFrom list (k8s: last wins), i.e.
    #           over the sub-chart's own ConfigMap AND Secret.
    # The sub-chart is NOT patched for this — extraEnvFrom is its own documented
    # extension point ("envFrom is managed by the chart; use extraEnvFrom to add
    # additional sources"), already used the same way for the OAuth ConfigMap
    # (PCP-20591). Keeping the vendored tree untouched is deliberate: every local
    # edit to it is a rebase conflict against upstream later.
    #
    # WHAT DOES **NOT** BELONG HERE — anything whose correct value differs by mode.
    # Putting one of these here silently changes a mode's behaviour:
    #   CACHE_TYPE                   lite "memory"  vs full "redis"   (architectural)
    #   AUTH_REQUIRED                lite "true"    vs full "false"
    #   MCP_REQUIRE_AUTH             lite "true"    vs full "false"
    #   ALLOW_UNAUTHENTICATED_ADMIN  lite "false"   vs full "true"
    #   DATABASE_URL                 lite sqlite    vs full postgres  (would break full)
    #   HOST · GUNICORN_WORKERS · DB_SQLITE_BUSY_TIMEOUT · PLUGINS_CONFIG_FILE ·
    #   MCP_CLIENT_AUTH_ENABLED      (lite-only — lite-runtime specific, or dynamically
    #                                 overridden by the proxy branch in lite-deployment.yaml)
    #   APP_ROOT_PATH · MCPGATEWAY_SESSION_AFFINITY_ENABLED ·
    #   MCPGATEWAY_FEDERATION_SERVER_REQUESTS_ENABLED  (full-only)
    # Those stay in `lite.config` / `mcp-stack.mcpContextForge.config` respectively.
    #
    # Operators (and MCP Hub's deploy wizard) override shared gateway settings here — it is the
    # one path that reaches both modes and outranks the chart defaults.
    #
    # ⚠️ "Outranks the chart defaults" is NOT "overrides anything". A value rendered as an
    # explicit container `env` entry beats every `envFrom` source, and both modes have some.
    # Setting one of these here has NO effect:
    #   lite   APP_ROOT_PATH (owned by publicApi.pathPrefix) · ALLOWED_ORIGINS (rendered from the
    #          public origin) · MCP_CLIENT_AUTH_ENABLED when tibcoProxy.enabled (forced "false")
    #   full   HOST and the proxy-auth vars, PLUGINS_CONFIG_FILE (explicit env in the sub-chart)
    # None of the keys below is in that set. Check the deployment templates before adding one
    # that is — it would render into the ConfigMap, look applied, and do nothing.
    #
    # ⚠️ VERSION COUPLING, and it is deliberate. This path did not exist before
    # tp-mcp-gateway 1.20.0-alpha.36, and MCP Hub's deploy wizard writes ONLY this path from the
    # matching release onward. Mixing the two halves fails SILENTLY in both directions — a new
    # Hub against an older chart has its overrides ignored; an older Hub's `lite.config`
    # overrides lose to the defaults below. There is no in-between release that reads both, by
    # choice: the gateway has not shipped, so no deployment exists to be compatible with, and a
    # dual-read transition would have to be carried and then removed. Ship the chart and the Hub
    # together.
    config:
      SECURE_COOKIES: "false"
      PLUGINS_ENABLED: "true"
      # PCP-20165 SA-16: reject weak JWT/encryption secrets (defense-in-depth; the sensitive
      # secret keys are strong-secret-generated, so this passes by default).
      REQUIRE_STRONG_SECRETS: "true"
      # PCP-22379: the gateway's own Admin web UI is off for the official release — MCP Hub is the
      # control source of truth. The Admin API stays ON on purpose (Hub proxies /admin/plugins for
      # the plugin catalog + governance). Both sides already defaulted to exactly these values.
      MCPGATEWAY_UI_ENABLED: "false"
      MCPGATEWAY_ADMIN_API_ENABLED: "true"
      # PCP-20564: SSRF_ALLOW_PRIVATE_NETWORKS stays "true" on purpose — it is a FUNCTIONAL
      # requirement for TP (MCP servers run on private cluster / on-prem IPs; federation +
      # register-by-URL need RFC-1918 reachability). Its hardening (an egress NetworkPolicy
      # backstop) is tracked separately by PCP-19937 / TT-21 — NOT by tightening this default,
      # which would break federation on every real deployment.
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
      # PCP-20216 (TT-25): pin outbound TLS verification fail-closed. The gateway code already
      # defaults skip_ssl_verify=False and raises on SKIP_SSL_VERIFY=true in production (PCP-20195);
      # this pins the chart default explicitly across all blocks so it can't silently drift.
      SKIP_SSL_VERIFY: "false"
      # SOAP/WSDL support — see PCP-18693. Default-on in TIBCO mode so the
      # /admin/wsdl endpoints + SOAP dispatch are available without an extra
      # opt-in step. Requires the [soap] extra (zeep) in the image — already
      # baked in via Containerfile.lite.
      MCPGATEWAY_SOAP_ENABLED: "true"
      # OAuth upstream proxy (PCP-18426). DCR is on by default; stateful sessions are
      # required for UC3 (external MCP client per-session token). OAUTH_REDIRECT_URI is
      # injected by lite-deployment.yaml from the DP ingress FQDN.
      DCR_ENABLED: "true"
      USE_STATEFUL_SESSIONS: "true"
      # Inbound external-IdP OAuth — unprovisioned access (PCP-20050 / PCP-18426).
      # Deliberate security toggle, default ON: when "true", a VALID external-IdP token
      # whose user is NOT provisioned in the gateway is admitted (scope-gated; fine-grained
      # authz delegated to plugins, PCP-19981). Set "false" to restore upstream
      # 'user must exist' behavior. The Hub deploy wizard can override this per-DP.
      MCP_INBOUND_OAUTH_ALLOW_UNPROVISIONED: "true"
      # Rate limiting (PCP-20090). The gateway's in-process RateLimitMiddleware is
      # DEFAULT-OFF on the DP gateway. The DP gateway sits behind platform ingress /
      # dp-proxy / tibtunnel, and the per-IP limiter otherwise mis-fires on the Hub's
      # own control-plane traffic: a single Push sends many admin calls from one IP
      # (Hub / dp-proxy), trips the MEDIUM tier (100 rpm), and after 5 violations the
      # 15-minute account LOCKOUT turns a transient 429 into an outage ("Account
      # locked"). Set "true" to enable the in-process limiter (e.g. a gateway exposed
      # directly, not fronted by an external API gateway). When enabled, these tune it
      # (all settable the same way — uncomment to override the code defaults):
      #   RATE_LIMIT_LOCKOUT_ENABLED: "false"  # keep soft 60s 429s, drop the 15-min lock
      #   RATE_LIMIT_MEDIUM_RPM: "100"         # /servers /tools /gateways /mcp per minute
      #   RATE_LIMIT_LOCKOUT_THRESHOLD: "5"    # violations before lockout
      RATE_LIMITING_ENABLED: "false"
    discovery:
      enabled: true       # full-mode discovery sidecar (default ON)
      # Image for the full-mode discovery sidecar. The vendored mcp-stack subchart only sees
      # global.*, so it CANNOT read the top-level discovery.image.* keys below — these mirror
      # them so the subchart renders the SAME discovery image as the lite templates. Keep the
      # repository/tag identical to the top-level discovery.image (single source of truth).
      # NOTE: each `repository:` line ends in the bare image name with `tag:` immediately
      # following so the automated alpha release pins these alongside the top-level tags.
      # PCP-23125: BARE NAME. The registry + repository halves come from
      # global.cp.containerRegistry via the mcp-stack.image.* helpers, so this mirror MUST be
      # flipped in the same shape as its top-level twin (discovery.image below) — the release
      # pinner rewrites both pairs but only verifies the six top-level paths, which makes a
      # stale mirror the one drift nothing catches. Do NOT quote and do NOT re-qualify.
      image:
        repository: tp-mcp-discovery
        tag: "1.20.0"
        digest: ""
        # PCP-23334: GA ships TAG-ONLY. Every digest in this file is deliberately empty and
        # nothing will fill it -- release-alpha.sh pins digests on the ALPHA lane only, and a
        # hand-cut GA has no equivalent pinner. So :1.20.0 is a MUTABLE tag; the promote
        # workflow refuses to re-point it, but that is discipline, not enforcement. This chart
        # is the one that goes PUBLIC, so do not assume a pinner exists. Follow-up tracked.
    tibcoProxy:
      enabled: false      # full-mode tp-mcp-gateway-proxy sidecar + gateway auth-rewire (default OFF)
      # Image for the full-mode tp-mcp-gateway-proxy sidecar. Same rationale as discovery.image above:
      # the subchart only sees global.*, so this mirrors the top-level tibcoProxy.image (single
      # source of truth). Keep the repository/tag identical and in this layout (repository line
      # ending in the bare image name, tag line immediately after) for the automated release pin.
      # PCP-23125: BARE NAME, same rules as global.tpMcpGateway.discovery.image above.
      image:
        repository: tp-mcp-gateway-proxy
        tag: "1.20.0"
        digest: ""
  # OpenTelemetry — reads collector endpoints from DP o11y-service ConfigMap.
  # Same pattern as bwprovisioner. Degrades gracefully when o11y not deployed.
  # Uses global: so it flows into the mcp-stack subchart automatically.
  otel:
    enabled: true
    serviceName: "mcp-gateway"
  # ─ TIBCO Platform application-log forwarding (PCP-22768) ─
  # When enabled, a fluentbit sidecar tails the gateway's JSON application-log file and
  # ships it to the DP observability Log server (otel-userapp-logs). MCP Hub sets `enabled`
  # from the Register-Gateway "fluentbit sidecar" toggle via ENABLE_APPS_FLUENTBIT_SIDECAR.
  # Under global.* so it reaches BOTH the vendored mcp-stack sub-chart (full mode) and the
  # wrapper lite-deployment template (lite mode). Default OFF: the pod is unchanged unless
  # a caller (Hub) explicitly opts in.
  tibco:
    logging:
      fluentbit:
        enabled: false
        image:
          # PCP-23125: BARE NAME — same registry as the gateway's discovery /
          # tp-mcp-gateway-proxy sidecars because it goes through the SAME resolver
          # (global.cp.containerRegistry). This key is SHARED: templates/lite-deployment.yaml
          # and charts/mcp-stack/templates/deployment-mcpgateway.yaml both read it, and both
          # prefix it. Re-qualifying it here would double-prefix BOTH modes — which is why both
          # of them now abort the render instead (tp-mcp-gateway.image.bareRepository and its
          # mcp-stack twin).
          repository: common-fluentbit
          tag: "5.1.0"
          pullPolicy: IfNotPresent
        otel:
          host: otel-userapp-logs
          port: 4318
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 150Mi
  cp:
    # Auto-injected by the orchestrator/recipe at deploy time.
    # Consumed by tp-mcp-gateway.selectorLabels for the platform.tibco.com/* spec labels.
    dataplaneId: ""
    instanceId: ""
    # Container-registry indirection (PCP-23125). Injected by the orchestrator on a live
    # Data Plane; declared here so the chart renders standalone without a nil-map panic —
    # the same way every sibling DP chart declares it. `secret` is declared for shape parity
    # with the siblings; this chart still takes pull secrets from global.imagePullSecrets.
    containerRegistry:
      secret: ""
      url: ""
      repository: "tibco-platform-docker-prod"
    # CP-DP HAProxy ingress vhost (PCP-19767). Default = tunnel vhost (hybrid-ON).
    # The orchestrator overrides host with the reachable-URL host
    # (cpdpproxy.<dp-ns>.svc.cluster.local) when hybrid connectivity is disabled,
    # exactly as for bwprovisioner/flogoprovisioner/o11y-service. Rendered through
    # `tpl` in the ingress templates so the {{ }} default is re-evaluated at install.
    # Keys on global.cp.dataplaneId (same identifier tp-mcp-gateway.selectorLabels
    # uses), matching the bwprovisioner/flogoprovisioner convention for this global.
    dpUrl:
      host: "dp-{{ $.Values.global.cp.dataplaneId }}.platform.local"
      port: 443
    resources:
      serviceaccount:
        namespace: ""
        serviceAccountName: ""
      ingress:
        fqdn: ""
        ingressClassName: ""
        ingressController: ""       # traefik | nginx | haProxy
        annotations: {}
      gatewayapi:
        gatewayAPIControllerName: ""  # GKE | ISTIO | etc (if set, enables Gateway API)
        gatewayName: ""
        gatewayNamespace: ""
        gatewayHostOrDomainName: ""
        gatewaySectionName: ""
        annotations: {}
      # Auto-injected by the orchestrator/recipe at deploy time (same pattern as
      # ingress.fqdn / ingress.ingressClassName above). Left empty here so the
      # contract is discoverable. When empty, the chart OMITS storageClassName
      # from the PVC, so Kubernetes uses the cluster's default StorageClass.
      # (Use the "-" sentinel — quoted as "-" in a values file — to emit
      # storageClassName: "" and disable dynamic provisioning instead.)
      storage:
        storageClassName: ""

# =====================================================================
# HAProxy Ingress — CP-to-DP proxy chain (used by both modes)
# =====================================================================
haproxy:
  enabled: true
  # CP->DP HAProxy ingress sub-path the Hub reaches the gateway on. The MCP Hub composes the complete
  # per-instance path (this base + the gateway's stable id) and passes it here; the chart renders it
  # verbatim. This default is the plain base for single-instance / operator-supplied installs.
  pathPrefix: /tibco/agent/integration/mcp-gateway

# =====================================================================
# Public Ingress — optional path prefix for shared-FQDN deployments
# When set, the gateway is served under this sub-path and APP_ROOT_PATH
# is configured automatically. When empty, the gateway is served at /.
# =====================================================================
publicApi:
  pathPrefix: ""
  # Public BARE ORIGIN (scheme://host, no path) used as the inbound-OAuth audience
  # trust anchor (APP_DOMAIN, PCP-20050). Leave EMPTY to auto-derive from the DP
  # ingress FQDN (global.cp.resources.ingress.fqdn, or the Gateway API host). Set
  # explicitly ONLY when the public host differs from the DP ingress (e.g. an external
  # API gateway fronts the DP). Do NOT include the path prefix — the gateway appends
  # APP_ROOT_PATH itself, so embedding it here would double-prefix admin/email URLs.
  appDomain: ""
  # RFC 9728 OAuth Protected Resource Metadata well-known base path.
  # Protocol constant — do NOT override per-deployment.
  # When pathPrefix is set, the public ingress additionally routes
  #   <wellKnownPrefix><pathPrefix>
  # so spec-compliant MCP clients can perform root-anchored RFC 9728 discovery
  # for a sub-path-mounted gateway (PCP-19809). Chart-owned route; no rewrite —
  # the gateway serves PRM at the full literal path.
  wellKnownPrefix: /.well-known/oauth-protected-resource

# =====================================================================
# Plugins — defined once, used by both lite and full mode
# =====================================================================
plugins:
  enabled: true
  config: &plugins_config |
    plugin_dirs:
      - "plugins/native"
      - "plugins/custom"

    plugin_settings:
      parallel_execution_within_band: true
      plugin_timeout: 120
      fail_on_plugin_error: false
      enable_plugin_api: true
      plugin_health_check_interval: 120
      include_user_info: false

    plugins:
      # Rate limiter — cpex_rate_limiter pip package (Rust core, in-memory by default).
      # Without `backend: redis`, the plugin runs in-process memory mode; no
      # Redis dependency required for the default install.
      # PCP-22399: kind points at the fork-side ObservableRateLimiterPlugin wrapper
      # (subclasses the cpex_rate_limiter wheel, delegates 100% of enforcement) so the
      # silent redis→memory fail-open fallback becomes observable — deduped WARNING +
      # rate_limiter_degraded / rate_limiter_backend on the tools/call _meta. Requires a
      # gateway image that carries the wrapper — first added in e20deb0d (PCP-22389); the
      # image tags below pin build wip-poc-1-0b9555a (a descendant that contains it).
      - name: "RateLimiterPlugin"
        kind: "plugins.rate_limiter.observable_rate_limiter.ObservableRateLimiterPlugin"
        description: "Per-user/tenant/tool rate limits"
        version: "0.0.6"
        hooks: ["prompt_pre_fetch", "tool_pre_invoke"]
        tags: ["limits", "throttle"]
        mode: "disabled"
        priority: 20
        conditions: []
        config:
          by_user: "60/m"
          by_tenant: "600/m"
          by_tool:
            search: "10/m"

      # Secrets Detection — regex-based key/token detector
      - name: "SecretsDetection"
        kind: "plugins.secrets_detection.secrets_detection.SecretsDetectionPlugin"
        description: "Detects keys/tokens/secrets in inputs/outputs"
        version: "0.1.0"
        # PCP-20254: tool_pre_invoke added so secrets in tool INPUT args are scanned (cpex
        # dispatches only hooks declared here, so the method + this entry must ship together).
        # PCP-19884: per-VS model — base mode is "disabled" (loaded-but-inert, no global
        # security floor). Enforcement is opt-in PER VIRTUAL SERVER (and per VS-tool) via a
        # Hub plugin binding, which gateway_plugin_manager._merge_tenant_config activates per
        # context and _apply_security_floor then pins to blocking/fail-closed. A base-disabled,
        # unbound plugin is left OFF (the floor never force-enables it).
        # OPERATOR NOTE: to restore the GLOBAL always-on floor instead, set mode "enforce" with
        # conditions: [] — that + the PCP-20184 floor = blocking and non-downgradable on every
        # VS. To soften a global floor, use "permissive", or turn off a broad detector (e.g.
        # base64_24) under config.enabled below.
        hooks: ["prompt_pre_fetch", "tool_pre_invoke", "tool_post_invoke", "resource_post_fetch"]
        tags: ["security", "secrets", "dlp"]
        mode: "disabled"
        priority: 51
        conditions: []
        config:
          enabled:
            aws_access_key_id: true
            aws_secret_access_key: true
            google_api_key: true
            slack_token: true
            private_key_block: true
            jwt_like: true
            hex_secret_32: true
            base64_24: true
          redact: false
          redaction_text: "***REDACTED***"
          block_on_detection: true
          min_findings_to_block: 1

      # Output Length Guard — truncate oversized tool outputs
      - name: "OutputLengthGuardPlugin"
        kind: "plugins.output_length_guard.output_length_guard.OutputLengthGuardPlugin"
        description: "Guards tool outputs by enforcing max length"
        version: "0.1.0"
        hooks: ["tool_post_invoke"]
        tags: ["guard", "length", "outputs", "truncate"]
        mode: "enforce"
        priority: 160
        conditions: []
        config:
          min_chars: 0
          max_chars: 15000
          strategy: "truncate"
          ellipsis: "..."

      # Safe HTML Sanitizer — strip XSS vectors
      - name: "SafeHTMLSanitizer"
        kind: "plugins.safe_html_sanitizer.safe_html_sanitizer.SafeHTMLSanitizerPlugin"
        description: "Sanitize HTML to remove XSS vectors"
        version: "0.1.0"
        hooks: ["resource_post_fetch"]
        tags: ["security", "html", "xss", "sanitize"]
        mode: "enforce"
        priority: 119
        conditions: []
        config:
          allowed_tags:
            - a
            - p
            - div
            - span
            - strong
            - em
            - code
            - pre
            - ul
            - ol
            - li
            - h1
            - h2
            - h3
            - h4
            - h5
            - h6
            - blockquote
            - img
            - br
            - hr
            - table
            - thead
            - tbody
            - tr
            - th
            - td
          # PCP-19889: keep allowed_attrs in sync with code DEFAULT_ALLOWED_ATTRS so
          # the deployed default does not silently drop table/th/td layout attributes
          # (config overrides the code default, so an omitted key = dropped attr).
          allowed_attrs:
            "*": ["id", "class", "title", "alt"]
            a: ["href", "rel", "target"]
            img: ["src", "width", "height", "alt", "title"]
            table: ["border", "cellpadding", "cellspacing", "summary"]
            th: ["colspan", "rowspan"]
            td: ["colspan", "rowspan"]
          remove_comments: true
          drop_unknown_tags: true
          strip_event_handlers: true
          sanitize_css: true
          allow_data_images: false
          remove_bidi_controls: true
          to_text: false

      # HTML to Markdown — convert fetched HTML to Markdown
      - name: "HTMLToMarkdownPlugin"
        kind: "plugins.html_to_markdown.html_to_markdown.HTMLToMarkdownPlugin"
        description: "Converts HTML ResourceContent to Markdown"
        version: "0.1.0"
        hooks: ["resource_post_fetch"]
        tags: ["transform", "markdown", "html"]
        mode: "disabled"
        priority: 120
        conditions: []
        config: {}

      # Code Safety Linter — detect unsafe code patterns
      - name: "CodeSafetyLinterPlugin"
        kind: "plugins.code_safety_linter.code_safety_linter.CodeSafetyLinterPlugin"
        description: "Detect unsafe code patterns in outputs"
        version: "0.1.0"
        hooks: ["tool_post_invoke"]
        tags: ["security", "code"]
        # PCP-20254: enforce-by-default. OPERATOR NOTE: once enforced, the PCP-20184 security
        # floor pins this plugin blocking + fail-closed and it CANNOT be downgraded at runtime —
        # setting mode "permissive"/"disabled" here is NOT honored for this curated plugin (the
        # floor re-pins it to blocking). A false positive on legitimate code-bearing tool OUTPUT
        # is therefore a redeploy-only fix. PCP-20299: the real softening lever is the rule tiers
        # below — move a noisy rule from blocked_patterns (hard block) to warn_patterns
        # (non-blocking advisory, logged + annotated in result.metadata).
        mode: "enforce"
        priority: 155
        conditions: []
        config:
          # PCP-20299: block-tier = genuinely-dangerous, low-FP Python execution sinks (hard block).
          blocked_patterns:
            - "\\bos\\.system\\s*\\("
            - "\\bsubprocess\\.(Popen|call|run)\\s*\\("
          # warn-tier = prose-prone constructs (eval/exec/rm -rf) — non-blocking, logged + annotated.
          # NOTE: warn_patterns is honored only by a gateway image carrying the PCP-20299 plugin
          # code; on an older image these patterns are simply not scanned (non-blocking) — the
          # blocked_patterns narrowing already removes the customer-visible false positive.
          warn_patterns:
            - "\\beval\\s*\\("
