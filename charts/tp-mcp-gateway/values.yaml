          max_wait_seconds: 8
          poll_interval_seconds: 1.0
          block_on_verdicts:
          - malicious
          min_malicious: 1
          cache_ttl_seconds: 300
          max_retries: 3
          base_backoff: 0.5
          max_delay: 8.0
          jitter_max: 0.2
          enable_file_checks: true
          file_hash_alg: sha256
          upload_if_unknown: false
