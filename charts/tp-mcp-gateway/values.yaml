      # Code Safety Linter — detect unsafe code patterns
      - name: "CodeSafetyLinterPlugin"
        kind: "plugins.code_safety_linter.code_safety_linter.CodeSafetyLinterPlugin"
        description: "Detect unsafe code patterns in outputs"
        version: "0.1.0"
        hooks: ["tool_post_invoke"]
        tags: ["security", "code"]
        # PCP-20254: enforce-by-default. OPERATOR NOTE: once enforced, the PCP-20184 security
        # floor pins this plugin blocking + fail-closed and it CANNOT be downgraded at runtime —
        # setting mode "permissive"/"disabled" here is NOT honored for this curated plugin (the
        # floor re-pins it to blocking). A false positive on legitimate code-bearing tool OUTPUT
        # is therefore a redeploy-only fix. PCP-20299: the real softening lever is the rule tiers
        # below — move a noisy rule from blocked_patterns (hard block) to warn_patterns
        # (non-blocking advisory, logged + annotated in result.metadata).
        mode: "enforce"
        priority: 155
        conditions: []
        config:
          # PCP-24253: block-tier = LITERAL, dotted, unambiguous execution-sink CALLS. Every
          # entry requires the call paren; none matches module acquisition or a bare word.
          # `posix` has its OWN shorter list — `os` is a wrapper module, not the same object.
          # Generated from the gateway's shipped defaults; keep them in sync (the plugin
          # REPLACES its defaults with whatever this file provides, so a stale list here is
          # a silent downgrade). Source of truth: tibco/tp-mcp-gateway:plugins/code_safety_linter/README.md.
          blocked_patterns:
            - "\\bos\\.(system|popen|execl|execle|execlp|execlpe|execv|execve|execvp|execvpe|_execvpe|spawnl|spawnle|spawnlp|spawnlpe|spawnv|spawnve|spawnvp|spawnvpe|_spawnvef|posix_spawn|posix_spawnp)\\s*\\("
            - "\\bposix\\.(system|execv|execve|posix_spawn|posix_spawnp)\\s*\\("
            - "\\bsubprocess\\.(Popen|call|run|check_call|check_output|getoutput|getstatusoutput|_fork_exec)\\s*\\("
            - "\\b_posixsubprocess\\.(fork_exec)\\s*\\("
            - "\\bpty\\.(spawn)\\s*\\("
            - "\\basyncio\\.(subprocess\\.)?(create_subprocess_exec|create_subprocess_shell)\\s*\\("
          # warn-tier = non-blocking advisory (logged + annotated in result.metadata):
          # prose-prone constructs, Windows-only/`runpy` sinks whose false-positive cost is
          # too high to block, the event-loop sinks (open receiver), and the dynamic
          # ACQUISITION spellings — `__import__('os')`, `importlib.import_module`,
          # `getattr(os, 'system')`. PCP-24253 measured 6 of 7 aliasing spellings hitting
          # NEITHER tier before this change: the harm was no signal at all, not "not blocked".
          warn_patterns:
            - "\\beval\\s*\\("
            - "\\bexec\\s*\\("
            - "\\brm\\s+-rf\\b"
            - "\\bos\\.(startfile)\\s*\\("
            - "\\brunpy\\.(run_path|run_module)\\s*\\("
            - "[\\w)]\\s*\\.(subprocess_exec|subprocess_shell)\\s*\\("
            - "\\b__import__\\s*\\(\\s*(['\"])(asyncio\\.subprocess|_posixsubprocess|subprocess|commands|asyncio|posix|runpy|pty|os|nt)\\1"
            - "\\bimportlib\\s*\\.\\s*import_module\\s*\\(\\s*(['\"])(asyncio\\.subprocess|_posixsubprocess|subprocess|commands|asyncio|posix|runpy|pty|os|nt)\\1"
            - "\\bgetattr\\s*\\(\\s*(asyncio\\.subprocess|_posixsubprocess|subprocess|commands|asyncio|posix|runpy|pty|os|nt)\\s*,\\s*(['\"])(system|popen|execl|execle|execlp|execlpe|execv|execve|execvp|execvpe|_execvpe|spawnl|spawnle|spawnlp|spawnlpe|spawnv|spawnve|spawnvp|spawnvpe|_spawnvef|posix_spawn|posix_spawnp|startfile|run_path|run_module|system|execv|execve|posix_spawn|posix_spawnp|Popen|call|run|check_call|check_output|getoutput|getstatusoutput|_fork_exec|spawn|fork_exec|create_subprocess_exec|create_subprocess_shell|subprocess_exec|subprocess_shell)\\2"

