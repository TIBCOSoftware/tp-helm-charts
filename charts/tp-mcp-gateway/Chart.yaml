apiVersion: v2
name: tp-mcp-gateway
description: |
  TIBCO Platform MCP Gateway.
  Supports two modes:
    - Full (default): PostgreSQL + Redis via upstream mcp-stack sub-chart
    - Lite:           SQLite + memory cache, single pod, no external deps

type: application
# PCP-24083: alpha.11 already exists on gh-pages (cut from the automation lane, and the first
# published gateway chart whose pins carry the PCP-23876 CSRF fix). Reusing it here would be a
# SILENT no-publish under chart-releaser's skip_existing, so this branch cuts the next FREE
# number instead. Content is identical to alpha.11 apart from the version; only the pins moved,
# and they moved forward.
# PCP-24140: same hazard, and it fired twice under this one branch. The branch first cut
# alpha.13 (the automation lane had taken it while main still read alpha.12), then alpha.14 —
# and by the time the gateway code merged, main itself HAD ALREADY REACHED alpha.14 and
# alpha.14 was published, so this branch's "bump" had silently become a no-op that
# chart-releaser's skip_existing would have swallowed without a word. Cutting alpha.15.
# ⚠️ Re-check the published tags immediately before merge — resolve them from the git-refs
# API, not from local tags, which go stale even after `fetch --tags`.
#
# THIRD claim, and this one was not visible in the published tags at all: a number can be free
# by tags and still be held by an OPEN PR, whose branch has published nothing yet. Whoever
# merges second silently no-publishes under skip_existing. The rule that follows from it, and
# the one this file exists to teach: take a LATER number rather than negotiating for one — it
# cannot collide backwards, needs no cross-PR coordination, and a skipped number costs nothing
# (this file already records several). So the check before merge is "highest published tag,
# main, AND every open PR that touches this file" — three inputs, not one.
#
# PCP-24253: .17. #10665 landed first, so its .16 is now main's and this branch takes the next
# free number — the same "a later number is unilaterally safe" rule, applied from the other
# side. Worth reading the paragraph above as advice that WORKED: this branch had held .13,
# then .15, then .16, chasing a moving line each time, and only stopped once it followed that
# rule instead of trying to reserve a number.
# ⚠️ .17 is NOT a pin-only re-cut. It replaces the CodeSafetyLinter rule set in values.yaml —
# blocked_patterns 2 -> 6, warn_patterns 3 -> 9 — with the gateway plugin's shipped defaults.
# The plugin REPLACES its Python defaults with whatever this chart provides rather than
# merging them, so this is a security-policy change on a control pinned at mode: enforce, not
# a packaging bump. Anyone reading this block to decide what the number carries needs that.
# PCP-24482: injects GATEWAY_CHART_VERSION / GATEWAY_VERSION into the dialhome-agent, so the
# Hub can tell an operator whether a dial-home gateway is behind. Template-only — no new
# values, no image move.
#
# ⚠️ FROM HERE ON, THIS LINE IS ALSO A PAYLOAD. GATEWAY_CHART_VERSION renders from
# `.Chart.Version`, which is exactly why it is trustworthy (it cannot drift from what was
# actually installed) and exactly why a wrong number stops being a packaging detail: it becomes
# a wrong "Upgrade available" verdict on a customer's gateway.
#
# ⚠️ WHY THIS STAYS ON THE 1.21 ALPHA LINE, given that newer tags exist. Enumerating
# `tp-mcp-gateway-1.2*` UNSCOPED (all refs — a query scoped to `…-1.21.0-alpha` cannot see
# either of these by construction) returns two things above this number:
