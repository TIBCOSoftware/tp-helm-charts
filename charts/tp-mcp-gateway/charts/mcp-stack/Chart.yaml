# --------------------------------------------------------------------
# CHART METADATA - Helm reads this file to identify and display the
# chart in registries such as Artifact Hub or ChartMuseum.
# --------------------------------------------------------------------
apiVersion: v2
name: mcp-stack

description: |
  TIBCO Platform MCP Gateway — full-stack mcp-stack sub-chart.  It bundles:
    - MCP Gateway application (HTTP / WebSocket server)
    - PostgreSQL database with persistent storage
    - Redis cache for sessions & completions
    - Optional PgAdmin and Redis-Commander web UIs

type: application

# --------------------------------------------------------------------
# Versioning
# * version      - chart package version (SemVer).  Bump on *any* chart
#                  change, even if the app container tag is the same.
# * appVersion   - upstream application version; shown in UIs but not
#                  used for upgrade logic.
# --------------------------------------------------------------------
# PCP-23832: RC-38. Template + values change (the pre-upgrade backup window helper,
# postgres.backup.preUpgrade, the status-ConfigMap skip notice). Bumped per the "bump on *any*
# chart change" rule above; the parent's `dependencies:` pin moves in the same commit or
# `helm dependency build` resolves nothing. Safe for the base-parity legs of
# redis-external-assert.sh [5] / redis-tls-assert.sh [8]: their norm() already collapses
# `helm.sh/chart: mcp-stack-<ver>` (redis-external-assert.sh:645), so the label churn is absorbed.
#
# PCP-25210: RC-39. templates/secret-redis.yaml no longer renders the hardcoded
# `redis.auth.password` literal -- mints a random password on first install and reuses the
# live Secret's value via `lookup` on every upgrade (mirrors secret-redis-tls.yaml,
# PCP-20275). Not independently tag-published (consumed only via the parent's file://
# dependency), so no skip_existing collision risk here; bumped per the same "any chart
# change" rule. The parent's dependencies: pin moves in the same commit (below).
version: 1.0.0-RC-39
appVersion: "1.0.0-RC-4"

# Optional but useful metadata
keywords:
  - tibco
  - mcp
  - gateway
  - postgres
  - redis
  - llm
home: https://github.com/tibcosoftware/tp-helm-charts

sources:
  - https://github.com/tibcosoftware/tp-helm-charts

maintainers:
  - name: TIBCO Platform Team
    url: https://github.com/tibcosoftware

# Require Kubernetes ≥1.22: networking v1, recent securityContext fields, and
# ReadWriteOncePod (PCP-21592) which the default redis/postgres PVCs now request.
kubeVersion: ">=1.22.0-0"
