{{- /* LOCAL TIBCO MOD (PCP-20275): server-side TLS cert Secret for the BUNDLED in-cluster Redis.
       This is the ONLY place genSelfSignedCert is called for Redis. Every consumer (Redis server,
       gateway, redis-exporter, redis-commander, probes) mounts THIS secret by the shared
       `mcp-stack.redisTlsSecretName` helper. Keep on upstream mcp-stack (github.com/IBM/mcp-context-forge)
       re-sync. */}}
{{- $bundledServerTls := eq (include "mcp-stack.bundledRedisServerTls" .) "true" -}}
{{- /* Only the SELF-SIGNED path emits a Secret here; an operator-supplied existingSecret is owned
       outside the chart (cert-manager / GitOps) and must already carry tls.crt/tls.key/ca.crt. */}}
{{- if and $bundledServerTls (not .Values.redis.serverTls.existingSecret) }}
{{- $secretName := include "mcp-stack.redisTlsSecretName" . -}}
{{- $altNames := include "mcp-stack.redisTlsAltNames" . | fromJsonArray -}}
{{- $cn := index $altNames 0 -}}
{{- $ips := list "127.0.0.1" -}}
{{- /* Reuse-once across live upgrades: if the secret already exists in-cluster, keep its data so the
       running cert/CA never churns. Under `helm template`/dry-run `lookup` is empty → a fresh cert is
       generated each render (documented in values.yaml: use serverTls.existingSecret for GitOps). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $certKey := .Values.redis.serverTls.certKey -}}
{{- $keyKey := .Values.redis.serverTls.privateKeyKey -}}
{{- $caKey := .Values.redis.serverTls.caKey -}}
{{- $crt := "" -}}
{{- $key := "" -}}
{{- $ca := "" -}}
{{- if and $existing $existing.data (index $existing.data $certKey) (index $existing.data $keyKey) (index $existing.data $caKey) }}
{{- $crt = index $existing.data $certKey -}}
{{- $key = index $existing.data $keyKey -}}
{{- $ca = index $existing.data $caKey -}}
{{- else }}
{{- /* genSelfSignedCert returns a self-signed leaf whose .Cert IS its own CA (one chain): the server
       cert and the gateway-trusted CA are intrinsically identical, so tls.crt == ca.crt. */}}
{{- $gen := genSelfSignedCert $cn $ips $altNames (.Values.redis.serverTls.selfSigned.durationDays | int) -}}
{{- $crt = $gen.Cert | b64enc -}}
{{- $key = $gen.Key | b64enc -}}
{{- $ca = $gen.Cert | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app: {{ include "mcp-stack.fullname" . }}-redis
  annotations:
    # Survive helm uninstall / GitOps prune so a running cluster never loses the cert in use.
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  {{ $certKey }}: {{ $crt }}
  {{ $keyKey }}: {{ $key }}
  {{ $caKey }}: {{ $ca }}
{{- end }}
