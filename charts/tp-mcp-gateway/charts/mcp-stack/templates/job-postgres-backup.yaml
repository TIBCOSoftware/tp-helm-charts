{{- /* LOCAL TIBCO MOD (PCP-23125 + PCP-23089): re-apply on upstream mcp-stack re-vendor.
       Container-registry indirection, same composition as deployment-postgres.yaml: the
       effective repository <registry>/<repository>/<bare-name> is built from
       global.cp.containerRegistry and passed to the ONE mcp-stack.image helper, so the image
       reference has a single composition point. This pre-upgrade Job dumps the CURRENT
       database, so it takes its tag from postgres.image.tag rather than pinning a literal
       major — no destination-dict tag override here. The NAME half goes through
       "mcp-stack.image.bareRepository", the fail-fast that stops an already-qualified
       postgres.image.repository being prefixed a second time. */ -}}
{{- /* Gated for the same reason as deployment-postgres.yaml: bareRepository fails the render on a
       host-qualified value, and this Job only renders under postgres.upgrade.enabled. */ -}}
{{- /* LOCAL TIBCO MOD (PCP-23215) — re-apply on upstream mcp-stack re-vendor.
       ONE name for "does this Job actually render", shared with the `if` that emits it below and
       with the digest look-up, so the two can never drift apart. */ -}}
{{- /* LOCAL TIBCO MOD (PCP-23832) — re-apply on upstream mcp-stack re-vendor.
       The condition MOVED into "mcp-stack.postgres.backupWindowOpen" (_helpers.tpl) and is no
       longer spelled out here. It was previously duplicated by hand at five sites — this Job, both
       hook NetworkPolicies, and both deployment-postgres fail-fasts — and they had ALREADY drifted,
       with THIS gate the loose one. The postgres hook NP required postgres.enabled and this gate did
       not, and the NP was the one that was RIGHT: the database manifest renders under
       $rendersDeployment, which is `postgres.enabled AND (not external.enabled)`
       (deployment-postgres.yaml:50) and says nothing about upgrade.enabled. So
       `postgres.enabled=false` + `upgrade.enabled=true` emitted THIS Job with no PostgreSQL pod
       anywhere — measured on origin/main — leaving it blocked on pg_isready against a database that
       is never created, until Helm timed out the pre-upgrade hook. The helper unifies on the NP's
       stricter condition, so that combination now renders no Job at all.
       The helper also adds the new, default-FALSE general window
       `postgres.backup.preUpgrade.enabled`, which is what relaxes this Job off the
       `targetVersion == "18"` pin (PCP-23832 AC2) without turning a pg_dump loose inside the
       pre-upgrade hook of every routine chart bump.
       The file's `$targetVersion` local went with it: this Job's ONLY other reading of a major is
       `postgres.image.tag` (the CURRENT major it dumps), never the TARGET, so once the gate moved
       the variable had no remaining reader and a dead local that still LOOKS load-bearing is how
       the next edit reintroduces the drift. Read the target major from the helper, not from here. */ -}}
{{- $rendersBackupJob := include "mcp-stack.postgres.backupWindowOpen" . -}}
{{- /* LOCAL TIBCO MOD (PCP-23832) — re-apply on upstream mcp-stack re-vendor.
       Retention window in days for the postgres-backups bucket. ABSENT and EXPLICIT ZERO are
       deliberately different answers, which is why this is not `| default 7`:
         * ABSENT  -> 7, the documented default. `helm upgrade --reuse-values` replays the previous
           release's COALESCED values, so an operator who turns the backup on with
           `--set …preUpgrade.enabled=true` against an older release supplies `enabled` and NOTHING
           else. Falling back to 0 there would silently give them recurring dumps with NO sweep —
           the unbounded-PVC path this key exists to close — while values.yaml documents 7.
         * EXPLICIT 0 -> 0, the "I manage retention myself" escape hatch, which must survive.
       `default` cannot express that split: sprig's `default` treats 0 as empty, so `| default 7`
       would rewrite an explicit 0 into 7 and take the escape hatch away. `kindIs "invalid"` is the
       nil test used elsewhere in this chart (mcp-stack.postgres.assertImageKeys) and distinguishes
       "key not set" from "key set to zero". */ -}}
{{- $keepDays := 7 -}}
{{- if not (kindIs "invalid" ((.Values.postgres.backup).preUpgrade).keepDays) -}}
{{- $keepDays = ((.Values.postgres.backup).preUpgrade).keepDays | int -}}
{{- end -}}
{{- $pgRepo := "" -}}
{{- /* Declared here and only ASSIGNED inside the gate — a `:=` inside an if-block is invisible
       outside it (same idiom as $pgRepo). "" is the un-pinned default and renders tag-only. */ -}}
{{- $pgDigest := "" -}}
{{- if or .Values.postgres.enabled .Values.postgres.upgrade.enabled -}}
{{- /* LOCAL TIBCO MOD (PCP-23215) — re-apply on upstream mcp-stack re-vendor.
       The singular postgres.image.digest aborts the render here too: this Job is a separate
       render surface from deployment-postgres.yaml, and a guard placed only there would leave the
       backup Job free to pin one container of a manifest whose siblings are not. Gate-scoped for
       the same reason as $pgRepo — dead config must not fail the render. */ -}}
{{- include "mcp-stack.postgres.assertImageKeys" . -}}
{{- $pgRepo = printf "%s/%s/%s" (include "mcp-stack.image.registry" .) (include "mcp-stack.image.repository" .) (include "mcp-stack.image.bareRepository" .Values.postgres.image.repository) -}}
{{- /* This Job dumps the CURRENT database, so its major is postgres.image.tag — the same value
       the image reference below takes its tag from. Looked up only when the Job renders: the
       digests map is all-or-nothing per render, and a Job that is not emitted builds nothing to
       pin. */ -}}
{{- if $rendersBackupJob -}}
{{- $pgDigest = include "mcp-stack.postgres.digestFor" (dict "ctx" . "major" .Values.postgres.image.tag) -}}
{{- end -}}
{{- end -}}
{{- /* LOCAL TIBCO MOD (PCP-23215) — re-apply on upstream mcp-stack re-vendor.
       No tag override (this Job follows postgres.image.tag), and the digest for exactly that tag
       in the destination dict. The source block is stripped of BOTH digest keys: `merge` is
       destination-wins only for NON-EMPTY destination values, so an un-pinned "" would otherwise
       be back-filled from the source. Do NOT pass .Values.postgres.image whole.

       COMPOSED ONLY WHEN THE JOB ACTUALLY RENDERS, via the declare-then-assign idiom, for the same
       reason $pgRepo and $pgDigest are: mcp-stack.image validates what it is handed and ABORTS on a
       malformed tag or digest. Evaluating it unconditionally makes a stray postgres.image value —
       replayed by `helm upgrade --reuse-values` from an older release, say — kill the ENTIRE
       gateway render for a database that is disabled on the shipped surface and will never be
       deployed. That is the "dead config must not fail the render" doctrine that
       container-registry-assert.sh:918-931 already fixed once for postgres.image.repository.
       Pinned from the other side by bundled-image-digest-assert.sh (E). */ -}}
{{- $postgresImage := "" -}}
{{- if $rendersBackupJob -}}
{{- $postgresImage = include "mcp-stack.image" (merge (dict "repository" $pgRepo "digest" $pgDigest) (omit .Values.postgres.image "digest" "digests")) -}}
{{- end -}}
{{- if $rendersBackupJob }}
{{- /* LOCAL TIBCO MOD (PCP-23127): re-apply on upstream mcp-stack re-vendor.
       The MinIO SERVER image, composed through the SAME container-registry resolver and in the
       same shape as minio-deployment.yaml and deployment-postgres.yaml. It is rendered here
       because it ships the `mc` CLIENT at /usr/bin/mc: the minio-client-copy init container
       below runs this image and copies that binary into a shared emptyDir for the Debian
       postgres container to execute. That is what replaced the `apt-get install wget jq` +
       `wget https://dl.min.io/...` this Job used to carry — PHASE 1 of the two-step pg17 -> pg18
       upgrade, and the half of that path nothing had noticed was still reaching the public
       internet, so the upgrade could not even take its own backup on a Data Plane with no
       public egress.

       EVALUATED INSIDE THE GATES, exactly like $pgRepo above: mcp-stack.image.bareRepository
       ABORTS the render on a value that is not a bare name, and `helm upgrade --reuse-values`
       from any pre-PCP-23127 release replays the old `minio/minio`. Everything below is already
       inside this file's `upgrade.enabled AND targetVersion 18 AND NOT backupCompleted AND NOT
       external` gate; the extra `minio.enabled` is the USE-SITE condition of the one container
       that consumes it, so the variable exists exactly when that container renders. */ -}}
{{- $minioImage := "" -}}
{{- if .Values.minio.enabled -}}
{{- $minioRepo := printf "%s/%s/%s" (include "mcp-stack.image.registry" .) (include "mcp-stack.image.repository" .) (include "mcp-stack.image.bareRepository" .Values.minio.image.repository) -}}
{{- $minioImage = include "mcp-stack.image" (merge (dict "repository" $minioRepo) .Values.minio.image) -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mcp-stack.fullname" . }}-postgres-backup
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-backup
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
spec:
  template:
    metadata:
      labels:
        {{- include "mcp-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-backup
    spec:
      {{- /* LOCAL TIBCO MOD: this Job runs the BUNDLED postgres image, which now comes from the
             private TIBCO mirror instead of Docker Hub — an anonymous pull no longer works. The
             ServiceAccount carries no pull secret, so the pod needs the same block the sibling
             workloads already declare (verbatim from deployment-postgres.yaml). */}}
      # Image pull secrets
      {{- if (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- range (.Values.global).imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      restartPolicy: Never
      {{- if (include "mcp-stack.useServiceAccount" .) }}
      serviceAccountName: {{ include "mcp-stack.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.minio.enabled }}
      {{- /* LOCAL TIBCO MOD (PCP-23127): re-apply on upstream mcp-stack re-vendor.
             THE AIR-GAP FIX, phase-1 half. The backup container needs a MinIO client to publish
             the dump; it used to `apt-get install wget jq` and `wget` the binary from
             https://dl.min.io, so this Job — the FIRST step of the documented pg17 -> pg18
             upgrade — simply could not run on a Data Plane with no public egress. The MinIO
             SERVER image this chart already deploys SHIPS that client at /usr/bin/mc (a ~30MB
             static Go binary) and ships /bin/sh (proved in-tree: minio-deployment.yaml runs
             `command: [/bin/sh, -c, "minio server /data ..."]` on the very same image), so the
             client is lifted out of the mirrored image instead of fetched from the internet.
             Nothing is installed and nothing is downloaded. Identical container to the one
             deployment-postgres.yaml stages for the phase-2 restore.

             WHY IT IS GATED ON minio.enabled. It is the condition under which $minioImage is
             composed at all, and it keeps this container from being the one thing that pins a
             DATABASE-backup pod to an OBJECT-STORE image on a path where the object store is
             off. In practice the gate cannot be false while this Job renders — the fail-fast in
             deployment-postgres.yaml refuses `upgrade.enabled + targetVersion 18` without
             minio.enabled, and both templates render together — but the two conditions are kept
             explicit rather than inferred from a fail-fast in another file. See the operator
             note on minio.enabled in values.yaml. */}}
      initContainers:
        - name: minio-client-copy
          image: {{ $minioImage | quote }}  # MinIO server image, used ONLY for its bundled /usr/bin/mc
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args: ["install -m 0755 /usr/bin/mc /opt/minio-client/mc"]
          volumeMounts:
            - name: minio-client
              mountPath: /opt/minio-client
          # EXPLICIT, and it has to be. This Job's POD-level securityContext sets ONLY
          # seccompProfile -- unlike the postgres Deployment there is no pod-wide runAsUser /
          # runAsNonRoot / fsGroup to inherit -- so a container with no securityContext of its
          # own runs as ROOT with the full default capability set, which is the exact posture
          # PCP-23127 exists to remove from this path. Nothing here needs root: it copies one
          # world-readable file out of the image into an emptyDir that the kubelet creates
          # 0777 when no fsGroup is set, so any uid can write it. 999 is not load-bearing --
          # no volume ownership depends on it and the (root) backup container reads a 0755
          # binary either way -- it just matches the postgres uid used throughout this
          # sub-chart. It must stay NON-ZERO to satisfy runAsNonRoot.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
      {{- end }}
      containers:
        - name: postgres-backup
          image: {{ $postgresImage | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash
              set -e

              echo "Starting PostgreSQL backup..."

              # Wait for PostgreSQL to be ready
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                sleep 2
              done

              # Create backup file
              BACKUP_FILE="/tmp/postgres-dump-$(date +%Y%m%d-%H%M%S).sql"
              pg_dump -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" \
                      -U "$POSTGRES_USER" \
                      -d "$POSTGRES_DB" \
                      --no-password > $BACKUP_FILE

              echo "Database dumped to $BACKUP_FILE"

              # The MinIO client is ALREADY here: the minio-client-copy init container lifted
              # /usr/bin/mc out of the MinIO server image into the shared minio-client
              # emptyDir. Nothing is installed and nothing is downloaded -- the
              # `apt-get update && apt-get install -y wget jq` + `wget
              # https://dl.min.io/client/mc/release/linux-amd64/mc` that used to sit at this
              # point is exactly what made phase 1 of the upgrade impossible on a Data Plane
              # with no public egress (PCP-23127). That download was also hardcoded to
              # linux-amd64, so it staged an x86-64 binary onto an arm64 node and died with
              # "exec format error"; the mc that ships in the MinIO image is by construction
              # built for the same architecture as the image itself. jq went with them: it was
              # installed here but never used by a single line of this script.
              # --config-dir is deliberate and container-local, matching the restore step in
              # deployment-postgres.yaml: mc refuses to start when it cannot create its config
              # dir, and it must not be left to whatever $HOME happens to be.
              MC=/opt/minio-client/mc

              # Configure MinIO client
              "$MC" --config-dir /tmp/.mc alias set minio http://{{ include "mcp-stack.fullname" . }}-minio:{{ .Values.minio.service.apiPort }} $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD

              # Create bucket if it doesn't exist
              "$MC" --config-dir /tmp/.mc mb minio/postgres-backups --ignore-existing
{{- if gt $keepDays 0 }}
              # RETENTION (PCP-23832). Before this ticket the dump was a ONCE-EVER event on the
              # pg17 -> pg18 path, so an unbounded bucket cost one object. postgres.backup.
              # preUpgrade.enabled makes it PER-UPGRADE, and nothing here ever deleted anything:
              # BACKUP_FILE is timestamped per run and uploaded to a flat prefix, and the restore
              # step reads only the newest key. Left unbounded, the bundled MinIO PVC grows by one
              # full database dump on every `helm upgrade`, forever -- and when it fills, the `cp`
              # below fails, `set -e` kills this Job, and the pre-upgrade hook FAILS THE UPGRADE.
              # That is the same outcome the opt-in default exists to avoid, reached slowly.
              #
              # Pruned BEFORE the upload, deliberately: the point is to leave room for the dump
              # that is about to be written. The dump itself is already complete on local disk at
              # this line (pg_dump ran above, under `set -e`), so pruning first cannot trade a
              # real backup for a hypothetical one.
              #
              # NON-FATAL by design -- `|| echo` rather than letting `set -e` act. A retention
              # sweep that fails (a transient MinIO error, a permissions change) must not be the
              # thing that fails a customer's upgrade: the BACKUP is this Job's contract, and
              # retention is housekeeping. It is reported loudly instead of silently swallowed.
              echo "Pruning dumps older than {{ $keepDays }}d from minio/postgres-backups ..."
              "$MC" --config-dir /tmp/.mc rm --recursive --force --older-than {{ $keepDays }}d minio/postgres-backups/ \
                || echo "WARNING: retention sweep failed; continuing with the backup (the bucket may be growing unbounded -- check postgres.backup.preUpgrade.keepDays and the MinIO PVC)"
{{- end }}
              # Upload the backup file to MinIO. Deliberately AFTER pg_dump has exited 0 (a
              # non-zero pg_dump kills the script under `set -e` and nothing is published):
              # the dump lands locally first and only a COMPLETE dump is ever uploaded, so the
              # restore step can never pick up a truncated file as a database. Do not
              # "simplify" this into a dump streamed straight at the object store.
              "$MC" --config-dir /tmp/.mc cp $BACKUP_FILE minio/postgres-backups/

              echo "Backup uploaded to MinIO successfully"

              # Clean up local file
              rm $BACKUP_FILE

              echo "PostgreSQL backup completed and stored in MinIO"
          env:
            - name: POSTGRES_HOST
              value: {{ printf "%s-postgres" (include "mcp-stack.fullname" .) }}
            - name: POSTGRES_PORT
              value: "{{ .Values.postgres.service.port }}"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-stack.postgresSecretName" . | trim }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-stack.postgresSecretName" . | trim }}
                  key: POSTGRES_USER
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-stack.postgresSecretName" . | trim }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-stack.postgresSecretName" . | trim }}
                  key: POSTGRES_PASSWORD
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.minio.existingSecret }}{{ .Values.minio.existingSecret }}{{ else }}{{ include "mcp-stack.fullname" . }}-minio{{ end }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.minio.existingSecret }}{{ .Values.minio.existingSecret }}{{ else }}{{ include "mcp-stack.fullname" . }}-minio{{ end }}
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            # The mc binary staged by minio-client-copy. Mounted read-only: this container
            # only executes it. The dump itself is written to the container's own /tmp, which
            # is where the atomic-publish property lives -- do not move it here.
            - name: minio-client
              mountPath: /opt/minio-client
              readOnly: true
      {{- /* LOCAL TIBCO MOD (PCP-23127): this Job had no volumes at all before the air-gap fix,
             because it downloaded its tooling from the internet. One node-local emptyDir now
             carries the mc binary from the init container to the backup container. sizeLimit
             caps a volume that only ever holds that one ~30MB binary. */}}
      volumes:
        - name: minio-client
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
