{{- /*
  Postgres credential Secret(s). The local-Postgres block and the external-Postgres
  block are MUTUALLY EXCLUSIVE (local requires postgres.external.enabled=false; external
  requires it true), so at most one renders. Emit NO document separator or leading comment
  between them: an unconditional `---` (or a bare leading comment) leaves an empty YAML
  document whenever a block is skipped, which `helm install` / `kubectl apply` reject
  ("Object 'Kind' is missing"). See PCP-20747.
*/}}
{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) (not .Values.postgres.external.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "mcp-stack.postgresSecretName" . | trim }}"
type: Opaque
stringData:
  # add the keys the Postgres image needs
  POSTGRES_USER:      {{ .Values.postgres.credentials.user      | quote }}
  POSTGRES_PASSWORD:  {{ .Values.postgres.credentials.password  | quote }}
  POSTGRES_DB:        {{ .Values.postgres.credentials.database  | quote }}
{{- end }}
{{- /* External PostgreSQL secret - created when external is enabled without an existingSecret */}}
{{- if and .Values.postgres.external.enabled (not .Values.postgres.external.existingSecret) }}
{{- /* PCP-20620: fail closed on an INCOMPLETE CP DBCONFIG injection. Treat a
       DBCONFIG as ALL-OR-NOTHING and SYMMETRICALLY: if ANY of host/database/user/
       password is injected at global.cp.resources.dbconfig.*, then ALL FOUR must
       resolve to a usable value. Otherwise the per-field `coalesce` in the
       externalPg.* helpers would silently mix the injected fields with the parent
       chart's remaining topology default (`mcpforgedb`) and, before PCP-21192, the weak
       `postgres/postgres` credential — e.g. customer creds against the shared database,
       or a customer host with the shared password. The credential defaults are now
       BLANK, and so is the HOST default (it used to be the shared-CP
       postgresql.tibco-ext Service name, unreachable from a Data Plane), but the guard
       still matters so an incomplete DBCONFIG can't be paired with a blank/mismatched
       cred or a blank host. A `not <field>` test covers nil (key present but
       null) AND empty-string; do NOT `toString` first, since toString of nil is a
       non-empty "<nil>" that would bypass the check. A still-redacted value
       ("Redacted-XXXXXXXX", tp-cp-orchestrator consts.go REDACTED_VALUE — applied
       to any password-typed field) is also rejected. */}}
{{- $db := dig "cp" "resources" "dbconfig" dict (.Values.global | default dict) | default dict }}
{{- $dbHost := get $db "dbHost" }}{{- $dbName := get $db "dbName" }}{{- $dbUser := get $db "dbUser" }}{{- $dbPw := get $db "secretDbPassword" }}
{{- /* `dbPort` is included in the "is a DBCONFIG present?" probe (so a port-only
       injection still trips the completeness check) but is intentionally NOT in
       the REQUIRED set below — externalPg.port legitimately defaults to 5432. */}}
{{- $anyDb := or $dbHost $dbName $dbUser $dbPw (get $db "dbPort") }}
{{- $redacted := false }}
{{- range $v := (list $dbHost $dbName $dbUser $dbPw) }}{{- if and (kindIs "string" $v) (hasPrefix "Redacted-" $v) }}{{- $redacted = true }}{{- end }}{{- end }}
{{- if and $anyDb (or (not $dbHost) (not $dbName) (not $dbUser) (not $dbPw) $redacted) }}
{{- fail "external PostgreSQL: the selected CP DBCONFIG resource is incomplete — it must provide ALL of host, database, username and a usable (non-empty, non-redacted) password. Refusing to mix it with the shared default host/credential/database. Re-select/repair the DBCONFIG resource so all connection fields resolve, or set postgres.external.existingSecret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "mcp-stack.fullname" . }}-postgres-external"
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-postgres
type: Opaque
stringData:
  {{- /* Use the configured key names for CloudNativePG compatibility.
         PCP-20620: values resolve via the externalPg.* helpers so a CP DBCONFIG
         selection (injected at global.cp.resources.dbconfig.*) populates the
         connection when the explicit postgres.external.* values are blank. */}}
  {{ .Values.postgres.external.hostKey | default "host" }}:     {{ include "mcp-stack.externalPg.host" . | quote }}
  {{ .Values.postgres.external.portKey | default "port" }}:     {{ include "mcp-stack.externalPg.port" . | quote }}
  {{ .Values.postgres.external.databaseKey | default "dbname" }}:  {{ include "mcp-stack.externalPg.database" . | quote }}
  {{ .Values.postgres.external.userKey | default "user" }}:     {{ include "mcp-stack.externalPg.user" . | quote }}
  {{ .Values.postgres.external.passwordKey | default "password" }}: {{ include "mcp-stack.externalPg.password" . | quote }}
{{- end }}
