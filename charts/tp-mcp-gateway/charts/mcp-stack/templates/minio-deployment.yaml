{{- if .Values.minio.enabled }}
{{- /* LOCAL TIBCO MOD (PCP-23127): re-apply on upstream mcp-stack re-vendor.
       Container-registry indirection — compose the EFFECTIVE repository
       <registry>/<repository>/<bare-name> ONCE, file-scoped, from global.cp.containerRegistry
       via the two zero-logic house helpers, then pass it to the ONE mcp-stack.image helper as
       the `repository` key of the image block. Same shape as the $pgRepo in
       deployment-postgres.yaml and the redis composition in deployment-redis.yaml.

       WHY NOT THE HAND-BUILT LITERAL THIS REPLACES. `"{{ .repository }}:{{ .tag }}"` is not
       merely untidy: it silently DROPS a digest, so the moment one is added to this block the
       pod quietly goes back to a mutable reference with nothing reporting it (PCP-23214), and it
       re-inherits the leading-slash / double-prefix defect class the helper exists to close
       (PCP-23208). It also cannot be seen by image-provenance-assert.sh's resolver rules. The
       helper has one composition point and one set of rules; the literal has neither.

       WHY IT IS EVALUATED INSIDE THE ENABLING GATE. mcp-stack.image.bareRepository ABORTS the
       render on a value that is not a bare name, and `helm upgrade --reuse-values` from any
       release older than PCP-23127 replays the old `minio/minio`. Computing this at
       unconditional file scope would therefore kill the WHOLE chart render over an object store
       that is disabled by default and would never be deployed — the exact bug
       deployment-postgres.yaml:37-46 documents and scopes its own $pgRepo to avoid. */ -}}
{{- $minioRepo := printf "%s/%s/%s" (include "mcp-stack.image.registry" .) (include "mcp-stack.image.repository" .) (include "mcp-stack.image.bareRepository" .Values.minio.image.repository) -}}
{{- $minioImage := include "mcp-stack.image" (merge (dict "repository" $minioRepo) .Values.minio.image) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-stack.fullname" . }}-minio
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  # PCP-22409: this selector is intentionally VERSION-FREE. It must NOT include
  # "mcp-stack.labels" (which emits the version-bearing helm.sh/chart:
  # mcp-stack-<version> label) because spec.selector is IMMUTABLE — a
  # version-bearing selector changes on every chart-version bump, so `helm upgrade`
  # then fails with "spec.selector: field is immutable" on any existing MinIO
  # install. It mirrors deployment-postgres.yaml, and the pod template below already
  # carries this same `app: <fullname>-minio` label so the selector stays a subset of
  # the pod labels. When upgrading FROM a pre-fix release (mcp-stack chart ≤ 1.0.0-RC-25)
  # whose live MinIO Deployment still has the old version-bearing selector, delete it
  # ONCE (the PVC and its data are preserved) then re-run the upgrade:
  #   kubectl delete deployment <release>-mcp-stack-minio --cascade=foreground
  selector:
    matchLabels:
      app: {{ include "mcp-stack.fullname" . }}-minio
  # PCP-22409: single-writer MinIO on a ReadWriteOnce PVC (minio.persistence.accessModes
  # defaults to [ReadWriteOnce], replicas: 1). Force non-overlapping updates so a
  # version-bump rollout tears down the old pod BEFORE starting the new one (mirrors
  # deployment-postgres.yaml / deployment-redis.yaml). Without this, the default
  # RollingUpdate (maxSurge 1 / maxUnavailable 0 at replicas:1) surges a second pod
  # that cannot attach the RWO PVC -> Multi-Attach deadlock (or same-node double-mount)
  # on every future upgrade once the selector is stable.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "mcp-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
        app: {{ include "mcp-stack.fullname" . }}-minio
    spec:
      {{- /* LOCAL TIBCO MOD (PCP-23127): this Deployment runs the BUNDLED MinIO image, which now
             comes from the private TIBCO mirror instead of Docker Hub — an anonymous pull no
             longer works. The ServiceAccount carries no pull secret, and this was the only
             workload ON THE UPGRADE PATH with no such block (registration-jobs.yaml renders four
             more workloads without one, but those images do not route through the mirror, so
             they are deliberately left alone), so without this it ImagePullBackOffs the moment
             the mirror needs credentials. Verbatim from job-postgres-backup.yaml /
             deployment-postgres.yaml. */}}
      # Image pull secrets
      {{- if (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- range (.Values.global).imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if (include "mcp-stack.useServiceAccount" .) }}
      serviceAccountName: {{ include "mcp-stack.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          securityContext:
            allowPrivilegeEscalation: false
          image: {{ $minioImage | quote }}
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - "minio server /data --console-address :{{ .Values.minio.service.consolePort }}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.minio.existingSecret }}{{ .Values.minio.existingSecret }}{{ else }}{{ include "mcp-stack.fullname" . }}-minio{{ end }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.minio.existingSecret }}{{ .Values.minio.existingSecret }}{{ else }}{{ include "mcp-stack.fullname" . }}-minio{{ end }}
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: {{ .Values.minio.service.apiPort }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.minio.service.consolePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mcp-stack.fullname" . }}-minio
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
