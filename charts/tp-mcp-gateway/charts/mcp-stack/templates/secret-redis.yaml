# templates/secret-redis.yaml
{{- /* LOCAL TIBCO MOD (PCP-20474): bundled-Redis gate (suppressed for the effective-external path). */}}
{{- if and (eq (include "mcp-stack.bundledRedisEnabled" .) "true") .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
{{- /* LOCAL TIBCO MOD (PCP-25210): no more hardcoded default password. Precedence (see
       mcp-stack.redisAuthEffectivePassword in _helpers.tpl, shared with the
       checksum/redis-secret annotation on the redis + gateway Deployments): an explicit
       .Values.redis.auth.password always wins (operator pinned it deliberately); else reuse
       whatever password is already in the live Secret (lookup), so an upgrade never rotates
       a password the running Redis and gateway already share; else (no prior Secret -- first
       install) mint a fresh random one. A prior value equal to the OLD hardcoded literal
       "change-me-redis" is deliberately REUSED here too, not auto-rotated: Redis is a single
       `Recreate` pod and the gateway is a rolling multi-replica Deployment, so an unattended
       rotation cannot be proven to land on both sides in the same instant. NOTES.txt flags
       that case instead and documents the manual rotation step (the operator's call, per
       PCP-25210). Mirrors secret-redis-tls.yaml's lookup/keep pattern, incl. its caveat:
       under `helm template`/dry-run `lookup` is empty, so use existingSecret above for
       GitOps/dry-render. Keep this block on upstream mcp-stack re-sync. */}}
{{- $secretName := include "mcp-stack.redisSecretName" . | trim }}
{{- $pwKey := .Values.redis.auth.passwordKey | default "REDIS_PASSWORD" }}
{{- $effectivePw := include "mcp-stack.redisAuthEffectivePassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $secretName }}"
  annotations:
    # Survive helm uninstall / GitOps prune so a running Redis never loses the password the
    # gateway still has (mirrors secret-redis-tls.yaml, PCP-20275).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $pwKey }}: {{ $effectivePw | quote }}
{{- end }}
{{- /* --------------------------------------------------------------------
     External Redis secret (PCP-20474) — LOCAL TIBCO MOD, NOT upstream
     mcp-stack (vendored from github.com/IBM/mcp-context-forge).

     The in-cluster block above is gated on the bundled-Redis predicate, so it
     renders NOTHING for the external path. This dedicated block mirrors
     secret-postgres.yaml's external branch: it renders only when the
     mcp-stack.renderExternalRedisSecret gate is true — i.e. external Redis is
     enabled via the redis.external.enabled toggle, no redis.external.existingSecret
     was supplied, and a password is present (which may be the orchestrator-injected
     global.cp.resources.redisconfig password, consumed once the toggle is on). It
     carries ONLY the raw REDIS_PASSWORD key.

     LOCAL TIBCO MOD (PCP-20474, cross-review): the generated secret deliberately
     does NOT carry a REDIS_URL key. The gateway composes its own URL from the
     discrete REDIS_PASSWORD/HOST/PORT it injects (deployment-mcpgateway.yaml),
     and the redis-exporter / redis-commander likewise reference only this
     secret's REDIS_PASSWORD key — NOTHING consumes a REDIS_URL key from this
     generated secret (the existingSecret URL path keys off
     redis.external.existingSecret, a user-supplied secret, not this one).
     A composed REDIS_URL here would also embed the raw, un-URL-encoded password,
     so dropping it removes a footgun rather than papering over it. Keep on
     upstream re-sync.
     -------------------------------------------------------------------- */}}
{{- if eq (include "mcp-stack.renderExternalRedisSecret" .) "true" }}
{{- $pw := include "mcp-stack.redisExternalPassword" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "mcp-stack.redisExternalSecretName" . }}"
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-redis
type: Opaque
stringData:
  REDIS_PASSWORD: {{ $pw | quote }}
{{- end }}
