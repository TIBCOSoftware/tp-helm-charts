{{/* -------------------------------------------------------------------
     SECRET - Gateway Sensitive Configuration
     -------------------------------------------------------------------
     - Renders a Secret named   <release>-mcp-stack-gateway-secret
     - Keys come from values.yaml → mcpContextForge.secret
     - Sensitive keys (JWT_SECRET_KEY / AUTH_ENCRYPTION_SECRET /
       PLATFORM_ADMIN_PASSWORD) are STRONG-secret-generated when no value is
       supplied — never a weak static default (PCP-20165 SA-16). Resolution per key:
         1. operator-supplied non-empty value wins;
         2. else reuse the cluster Secret's value IF already strong (>= 32 chars)
            so an upgrade does not rotate it;
         3. else mint a fresh strong random (first install, or migration off a
            previously-shipped weak value whose len < 32 — so the now-active
            REQUIRE_STRONG_SECRETS gate cannot reject a reused weak secret).
       `lookup` is empty during `helm template`/dry-run (renders a fresh random);
       real install/upgrade reads the cluster (idempotent).
     ------------------------------------------------------------------- */}}

{{- if .Values.mcpContextForge.secret }}
{{- /*
  PCP-22913: mirror of the mode-invariant lookup in the parent chart's
  lite-secret.yaml. secretName embeds the MODE, so a lite<->full switch misses
  the existing Secret and re-mints AUTH_ENCRYPTION_SECRET -- orphaning every
  value already encrypted in the EXTERNAL database that outlives the release.
  Check this mode's name, then the sibling mode's, then generate.
*/}}
{{- $secretName := printf "%s-gateway-secret" (include "mcp-stack.fullname" .) }}
{{- $siblingName := printf "%s-mcp-gateway-secret" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- if not $existing }}
{{- $existing = (lookup "v1" "Secret" .Release.Namespace $siblingName) }}
{{- end }}
{{- $existingData := (and $existing $existing.data) | default dict }}
{{- $generate := list "JWT_SECRET_KEY" "AUTH_ENCRYPTION_SECRET" "PLATFORM_ADMIN_PASSWORD" "BASIC_AUTH_PASSWORD" "DEFAULT_USER_PASSWORD" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # PCP-22913: survive helm uninstall / GitOps prune -- the external database
    # outlives the release and losing this key orphans its encrypted rows.
    helm.sh/resource-policy: keep
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
{{- range $key, $val := .Values.mcpContextForge.secret }}
{{- if and (has $key $generate) (not $val) }}
{{- $prev := index $existingData $key | default "" | b64dec }}
{{- if ge (len $prev) 32 }}
  {{ $key }}: {{ $prev | quote }}
{{- else }}
  {{ $key }}: {{ randAlphaNum 40 | quote }}
{{- end }}
{{- else }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
{{- end }}
{{- end }}
