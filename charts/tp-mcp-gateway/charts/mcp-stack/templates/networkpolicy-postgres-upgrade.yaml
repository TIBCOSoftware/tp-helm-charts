{{- /*
  PCP-22375: pre-upgrade hook NetworkPolicies for the PostgreSQL major-version upgrade flow.

  The `-postgres-backup` Job (helm.sh/hook: pre-upgrade, hook-weight -5) and the
  `-postgres-migration-check` Job (post-upgrade) run during the Helm hook phase. On a
  `helm upgrade` the main-manifest NetworkPolicies (networkpolicies.yaml) are applied only in
  the main phase — i.e. AFTER the pre-upgrade backup Job has already tried to reach postgres /
  minio. If the persistent postgres/minio NP does not yet carry the upgrade-job ingress rules
  (e.g. an upgrade from an older release that lacked them), the backup pod is fenced off and the
  upgrade stalls. These hook-scoped NPs (hook-weight -10, so they are created BEFORE the
  backup Job at -5) grant that same ingress for the duration of the upgrade hooks and are then
  torn down (delete-policy before-hook-creation,hook-succeeded,hook-failed — cleaned up whether
  the pre-upgrade phase SUCCEEDS or FAILS, so no orphan NP can outlive the upgrade). They mirror
  the persistent rules in networkpolicies.yaml.
*/}}
{{- if .Values.networkPolicies.enabled }}
{{- $fullName := include "mcp-stack.fullname" . -}}

{{- /* LOCAL TIBCO MOD (PCP-23832) — re-apply on upstream mcp-stack re-vendor.
       The "is the pre-upgrade backup Job actually rendering" half of this gate now comes from
       "mcp-stack.postgres.backupWindowOpen", so this NetworkPolicy cannot disagree with the Job it
       exists to unblock. It PREVIOUSLY DID: this gate carried `.Values.postgres.enabled` and the
       Job's gate did not — and THIS gate was the correct one. The database manifest renders under
       $rendersDeployment = `postgres.enabled AND (not external.enabled)`
       (deployment-postgres.yaml:50), so `postgres.enabled=false` + `upgrade.enabled=true` emitted a
       backup Job against a database that is never deployed. The helper adopts this file's stricter
       condition, so the fix CLOSES that window rather than granting it ingress. `postgres.enabled`
       is consequently no longer restated here — it lives in the helper. What is left is only what is
       genuinely NetworkPolicy-specific: is this component's NP switched on, and is it permitted to
       carry the upgrade-job rules. */ -}}
{{- if and (include "mcp-stack.postgres.backupWindowOpen" .) .Values.networkPolicies.postgres.enabled .Values.networkPolicies.postgres.allowUpgradeJobs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-postgres-upgrade
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: networkpolicy
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  podSelector:
    matchLabels:
      app: {{ $fullName }}-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres-backup
              app.kubernetes.io/name: {{ $fullName }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres-migration-check
              app.kubernetes.io/name: {{ $fullName }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.service.port }}
{{- end }}

{{- /* LOCAL TIBCO MOD (PCP-23832) — re-apply on upstream mcp-stack re-vendor.
       Same single source of truth as the postgres NP above. `minio.enabled` STAYS: it is the
       use-site condition of the object store this policy selects, not a restatement of the backup
       window, and deployment-postgres.yaml's fail-fast is what guarantees it is true whenever the
       window is open. */ -}}
{{- if and (include "mcp-stack.postgres.backupWindowOpen" .) .Values.networkPolicies.minio.enabled .Values.minio.enabled .Values.networkPolicies.minio.allowUpgradeJobs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-minio-upgrade
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: networkpolicy
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: minio
      app: {{ $fullName }}-minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres-backup
              app.kubernetes.io/name: {{ $fullName }}
      ports:
        - protocol: TCP
          port: {{ .Values.minio.service.apiPort }}
{{- end }}

{{- end }}
