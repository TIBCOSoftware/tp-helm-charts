{{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled (not .Values.postgres.external.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcp-stack.fullname" . }}-postgres-pvc
  labels:
    {{- include "mcp-stack.labels" . | nindent 4 }}
    app: {{ include "mcp-stack.fullname" . }}-postgres
    component: storage
  {{- if .Values.postgres.persistence.annotations }}
  annotations:
    {{- toYaml .Values.postgres.persistence.annotations | nindent 4 }}
  {{- end }}
spec:
  {{- $sc := include "mcp-stack.storageClassName" (dict "local" .Values.postgres.persistence.storageClassName "ctx" $) }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
  {{- if .Values.postgres.persistence.useReadWriteOncePod }}
  accessModes:
    - ReadWriteOncePod
  {{- else }}
  accessModes: {{- toYaml .Values.postgres.persistence.accessModes | nindent 4 }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
