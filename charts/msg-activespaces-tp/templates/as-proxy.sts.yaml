{{- $params := include "need.msg.as.params" . | fromYaml -}}
{{- $basename := $params.as.basename -}}
{{- $stsname := printf "%s-proxy" $params.as.basename -}}
{{- $scheme := $.Values.secure.tls | ternary "https" "http" -}}

{{- if not $params.as.useCompact }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $stsname }}
  labels:
    tib-dp-release: {{ $.Release.Name }}
    tib-msg-stsname: "{{ $stsname }}"
    com.tibco.datagrid.service: {{ $stsname }}
{{ include "tibdg.labels" $ | indent 4 }}
    {{ include "msg.as.labels" $params | nindent 4 }}
spec:
  serviceName: {{ $stsname }}-pods
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  replicas: {{ $params.as.numProxies }}
  selector:
    matchLabels:
      tib-dp-release: {{ $.Release.Name }}
      tib-msg-stsname: "{{ $stsname }}"
      com.tibco.datagrid.service: {{ $stsname }}
  template:
    metadata:
      name: tibdgproxy
      labels:
        tib-dp-release: {{ $.Release.Name }}
        tib-msg-stsname: "{{ $stsname }}"
        com.tibco.datagrid.service: {{ $stsname }}
{{ include "tibdg.labels" $ | indent 8 }}
        {{ include "msg.as.labels" $params | nindent 8 }}
        {{ include "msg.dp.net.all" . | indent 8}}
    spec:
      enableServiceLinks: false
{{- if $.Values.pod.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $.Values.pod.terminationGracePeriodSeconds }}
{{- end }}
      serviceAccountName: "{{ $params.dp.serviceAccount }}"
      topologySpreadConstraints:
      # FIXME: Use helpers
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        {{- if $params.as.isProduction }}
        whenUnsatisfiable: DoNotSchedule
        {{- else }}
        whenUnsatisfiable: ScheduleAnyway
        {{- end }}
        labelSelector:
          matchLabels:
            tib-msg-stsname: "{{ $stsname }}"
            tib-dp-release: "{{ .Release.Name }}"
      {{- if ne "none" $params.as.zoneLabel }}
      - maxSkew: 1
        topologyKey: {{ $params.as.zoneLabel }}
        {{- if $params.as.isProduction }}
        whenUnsatisfiable: DoNotSchedule
        {{- else }}
        whenUnsatisfiable: ScheduleAnyway
        {{- end }}
        labelSelector:
          matchLabels:
            tib-msg-stsname: "{{ $stsname }}"
            tib-dp-release: "{{ .Release.Name }}"
      {{- end }}
      {{- if ne "none" $params.dp.pullSecret }}
      imagePullSecrets:
      - name: {{ $params.dp.pullSecret }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{ include "msg.dp.security.pod" $params | nindent 6 }}
      containers:
        - name: {{ $stsname }}
          image: {{ $params.as.image}}
          {{ include "msg.dp.security.container" $params | nindent 10 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              COPY_FROM=/boot COPY_TO=/logs/boot bash < /boot/copy-boot-config.sh ;
              exec watchdog

#           args:
#             - |
#               /opt/tibco/as/current-version/bin/tibdgproxy \
#               -r '{{ include "ftl-server-url" $ }}' \
#               -n '$(POD_NAME)' \
# FIXME: 
# {{- if $params.as.basename }}
#               -g '{{ $params.as.basename }}' \
# {{- end }}
# {{- if $.Values.secure.tls }}
#               --trust-file /secrets/ftlserver-trust/ftl-trust.pem \
# {{- end }}
# {{- if $.Values.secure.auth }}
#               --user-password-file /auth/userpw.txt \
# {{- end }}
#               --health-server ":9191"
          livenessProbe:
            httpGet:
              path: /alive
              port: 9191
            initialDelaySeconds: 5
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 9191
            initialDelaySeconds: 5
            periodSeconds: 3
          env:
            {{ include "msg.dp.stdenv" $params | indent  12 }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AS_USE_COMPACT
              value: {{ $params.as.useCompact | quote }}
            - name: UPGRADE_ACTION
              value: {{ $params.as.forceBootUpgrade | quote }}
            - name: REALM_POD_URL
              value: "{{ include "ftl-server-url" $ }}"
            - name: REALM_SVC_URL
              value: "{{ printf "%s://%s.%s.svc.cluster.local:%d" $scheme $stsname .Release.Namespace (int $.Values.ftlserver.ports.http) }}"
            - name: TIBFTL_LICENSE
              value: "{{ $params.dp.activationUrl }}"
            - name: WATCHDOG_LOG_FILE
              value: /logs/watchdog.log
            - name: WATCHDOG_CONFIG
              value: "/logs/boot/proxy-watchdog.yaml"
            - name: WATCHDOG_HOSTPORT
              value: "$(POD_NAME):{{ $params.as.ports.watchdogPort }}"
            - name: TIBDG_FTL
              valueFrom:
                secretKeyRef:
                  name: {{ $basename }}-conf
                  key: TIBDG_FTL
                  optional: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp-vol
            - mountPath: /boot
              {{ include "msg.pv.vol.mount" $params.as.boot | nindent 14 }}
            - mountPath: /conf
              {{ include "msg.pv.vol.mount" $params.as.conf | nindent 14 }}
            - mountPath: /logs
              {{ include "msg.pv.vol.mount" $params.as.logs | nindent 14 }}
{{- if $.Values.secure.tls }}
            - name: ftlserver-trust
              mountPath: /secrets/ftlserver-trust
{{- end }}
{{- if $.Values.secure.auth }}
            - name: auth
              mountPath: /auth
{{- end }}
          resources:
            {{ $params.proxy.resources | toYaml | nindent 12 }}
      volumes:
        - name: tmp-vol
          emptyDir: {}
        {{ include "msg.pv.vol.def" $params.as.boot | nindent 8 }}
        {{ include "msg.pv.vol.def" $params.as.conf | nindent 8 }}
        {{ include "msg.pv.vol.def" $params.as.logs | nindent 8 }}

{{ if $.Values.secure.tls }}
        - name: ftlserver-trust
          secret:
            secretName: ftlserver-trust
{{- end }}
{{- if $.Values.secure.auth }}
        - name: auth
          secret:
            secretName: tibdgproxy-user-creds
            items:
              - key: userpw.txt
                path: userpw.txt
{{- end }}
  volumeClaimTemplates:
    {{ include "msg.pv.vol.vct" $params.as.logs | nindent 4 }}

...
{{- end }} {{/* end of if not useCompact */}}
