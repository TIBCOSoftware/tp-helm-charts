apiVersion: v1
kind: Service
metadata:
  name: {{ include "flogoprovisioner.fullname" . }}
  labels:
    {{- include "flogoprovisioner.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
    - port: {{ .Values.publicApiService.port }}
      targetPort: {{ .Values.publicApiService.targetPort }}
      protocol: TCP
      name: publicapihttp
    # Caching Go module proxy for build jobs (must match FLOGO_APP_BUILD_MODULE_PROXY_URL).
    # ClusterIP load-balances across provisioner pods; each caches independently (a "wrong",
    # cold pod just re-fetches + caches there), so no session affinity is needed.
    - port: 7817
      targetPort: 7817
      protocol: TCP
      name: modproxy
  selector:
    {{- include "flogoprovisioner.selectorLabels" . | nindent 4 }}
