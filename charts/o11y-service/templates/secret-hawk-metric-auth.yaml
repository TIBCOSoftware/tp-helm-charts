{{- /*
  PCP-24369: HawkConsole metric-scrape client credential for otel-userapp-metrics.

  cp-orchestrator sets o11yv3.metricsServer.secret.hawkconsole.metricAuthToken to the data plane's
  top-level --ct-metric-auth-token from v3_data_planes.dp_config, unchanged: base64("<user>:<password>"),
  i.e. an HTTP Basic credential. (scriptArgs.--ct-metric-auth-token is the bcrypt HASH HawkConsole
  validates against; it cannot be used to authenticate.)

  The credential is held only in this Secret. The otel-userapp-metrics recipe (tp-cp-o11y) mounts it
  by this fixed name and reads basic_auth username_file / password_file, so the plaintext never lands
  in the collector ConfigMap. Hawk scrape targets exist only on control-tower data planes (see
  hawktargets in configmap.yaml), so the Secret is rendered only there. With no token set, nothing
  renders: the recipe's volume is optional, the collector still starts, and only the Hawk scrape fails.
  A malformed token fails this release on purpose: it is a cp-orchestrator contract violation, and failing
  loudly beats shipping a credential that silently 401s. The token must be standard padded base64;
  whitespace (padding, line wraps) is stripped first, and a non-string value is stringified so it hits the
  contract message instead of a template type error.

  A separate Secret from the o11y-service fullname Secret (secrets.yaml) so the collector can mount
  exactly these two files; the collector already gets that Secret as env vars (extraEnvsFrom).
*/ -}}
{{- $token := dig "hawkconsole" "metricAuthToken" "" .Values.global.cp.resources.o11yv3.metricsServer.secret | toString | nospace -}}
{{- if and (eq (.Values.global.cp.dataplane.hostCloudType | default "") "control-tower") $token }}
{{- $pair := b64dec $token -}}
{{- /* sprig b64dec returns the error text instead of failing, so verify the round trip. */ -}}
{{- if ne (b64enc $pair) $token }}
{{- fail "o11yv3.metricsServer.secret.hawkconsole.metricAuthToken must be base64(\"<user>:<password>\")" }}
{{- end }}
{{- $parts := splitn ":" 2 $pair }}
{{- if not (and $parts._0 $parts._1) }}
{{- fail "o11yv3.metricsServer.secret.hawkconsole.metricAuthToken must decode to \"<user>:<password>\"" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: o11y-hawk-metric-auth
  labels:
    {{- include "o11y-service.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ b64enc $parts._0 }}
  password: {{ b64enc $parts._1 }}
{{- end }}
