{{ if .Values.ingress.enabled -}}
{{- $dot := . }}
{{- $fullName := include "o11y-service.fullname" . -}}
{{- $releaseName := .Release.Name -}}

{{- /* built-in haProxy (default): no custom ingress controller and no gateway api */ -}}
{{- if and (empty .Values.global.cp.routeResources.ingress.ingressController) (empty .Values.global.cp.routeResources.gatewayapi.gatewayAPIControllerName) }}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ .Values.ingress.className }}-o11y-prom-scraper
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-namespace: {{ .Values.global.cp.resources.serviceaccount.namespace }}
    meta.helm.sh/release-name: {{ include "o11y-service.fullname" . }}
    haproxy.org/cors-enable: "true"
    haproxy.org/load-balance: leastconn
    haproxy.org/src-ip-header: X-Real-IP
    ingress.kubernetes.io/path-rewrite: /tibco/agent/o11y/{{ .Values.global.cp.dataplaneId }}/otlp/exporter/metrics/(.*) /\1
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: tibco-dp-{{ .Values.global.cp.dataplaneId }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    {{- if .host }}
    - host: {{ .host | quote }}
      http:
    {{- else }}
    - host: {{ tpl $.Values.global.cp.dpUrl.host $dot }}
      http:
    {{- end }}
        paths:
        - path: /tibco/agent/o11y/{{ $.Values.global.cp.dataplaneId }}/otlp/exporter/metrics/
          pathType: Prefix
          backend:
            service:
              name: otel-userapp-metrics
              port:
                number: 4320
  {{- end }}
{{- end }}

{{- /* custom haProxy (user-managed HAProxy ingress controller, not the bundled one) */ -}}
{{- if eq .Values.global.cp.routeResources.ingress.ingressController "haProxy" }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: haproxy-o11y-prom-scraper
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-namespace: {{ .Values.global.cp.resources.serviceaccount.namespace }}
    meta.helm.sh/release-name: {{ $fullName }}
    ingress.kubernetes.io/path-rewrite: "{{ $.Values.global.cp.routeResources.pathPrefix }}/o11y/{{ .Values.global.cp.dataplaneId }}/otlp/exporter/metrics/(.*) /\\1"
    {{- with .Values.global.cp.routeResources.ingress.annotations }}
    {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.cp.routeResources.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    {{- if .host }}
    - host: {{ .host | quote }}
    {{- else }}
    - host: {{ $.Values.global.cp.routeResources.ingress.fqdn | quote }}
    {{- end }}
      http:
        paths:
        - pathType: Prefix
          path: {{ $.Values.global.cp.routeResources.pathPrefix }}/o11y/{{ $.Values.global.cp.dataplaneId }}/otlp/exporter/metrics/
          backend:
            service:
              name: otel-userapp-metrics
              port:
                number: 4320
  {{- end }}
{{- end }}

{{- /* nginx */ -}}
{{- if eq .Values.global.cp.routeResources.ingress.ingressController "nginx" }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: nginx-o11y-prom-scraper
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-namespace: {{ .Values.global.cp.resources.serviceaccount.namespace }}
    meta.helm.sh/release-name: {{ $fullName }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    {{- with .Values.global.cp.routeResources.ingress.annotations }}
    {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.cp.routeResources.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    {{- if .host }}
    - host: {{ .host | quote }}
    {{- else }}
    - host: {{ $.Values.global.cp.routeResources.ingress.fqdn | quote }}
    {{- end }}
      http:
        paths:
        - pathType: ImplementationSpecific
          path: {{ $.Values.global.cp.routeResources.pathPrefix }}/o11y/{{ $.Values.global.cp.dataplaneId }}/otlp/exporter/metrics/(.*)
          backend:
            service:
              name: otel-userapp-metrics
              port:
                number: 4320
  {{- end }}
{{- end }}

{{- /* traefik */ -}}
{{- if eq .Values.global.cp.routeResources.ingress.ingressController "traefik" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: promscraper-strip-prefix
  labels:
    {{- include "o11y-service.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $.Values.global.cp.routeResources.pathPrefix }}/o11y/{{ .Values.global.cp.dataplaneId }}/otlp/exporter/metrics/
---
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: traefik-o11y-prom-scraper
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-namespace: {{ .Values.global.cp.resources.serviceaccount.namespace }}
    meta.helm.sh/release-name: {{ $fullName }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.global.cp.resources.serviceaccount.namespace }}-promscraper-strip-prefix@kubernetescrd
    {{- with .Values.global.cp.routeResources.ingress.annotations }}
    {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.global.cp.routeResources.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    {{- if .host }}
    - host: {{ .host | quote }}
    {{- else }}
    - host: {{ $.Values.global.cp.routeResources.ingress.fqdn | quote }}
    {{- end }}
      http:
        paths:
        - pathType: Prefix
          path: {{ $.Values.global.cp.routeResources.pathPrefix }}/o11y/{{ $.Values.global.cp.dataplaneId }}/otlp/exporter/metrics/
          backend:
            service:
              name: otel-userapp-metrics
              port:
                number: 4320
  {{- end }}
{{- end }}

{{- /* openshiftRouter */ -}}
{{- if eq .Values.global.cp.routeResources.ingress.ingressController "openshiftRouter" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: o11y-prom-scraper
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-namespace: {{ .Values.global.cp.resources.serviceaccount.namespace }}
    meta.helm.sh/release-name: {{ $fullName }}
    haproxy.router.openshift.io/rewrite-target: /
    {{- with .Values.global.cp.routeResources.ingress.annotations }}
    {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.global.cp.routeResources.ingress.fqdn }}
  host: {{ . | quote }}
  {{- end }}
  path: {{ $.Values.global.cp.routeResources.pathPrefix }}/o11y/{{ .Values.global.cp.dataplaneId }}/otlp/exporter/metrics/
  to:
    kind: Service
    name: otel-userapp-metrics
    weight: 100
  port:
    targetPort: 4320
  wildcardPolicy: None
{{- end }}

{{- /* gatewayapi */ -}}
{{- if not (empty .Values.global.cp.routeResources.gatewayapi.gatewayAPIControllerName) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: o11y-prom-scraper
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.global.cp.routeResources.gatewayapi.gatewayName }}
    namespace: {{ .Values.global.cp.routeResources.gatewayapi.gatewayNamespace }}
    {{- with .Values.global.cp.routeResources.gatewayapi.gatewaySectionName }}
    sectionName: {{ . }}
    {{- end }}
  hostnames:
  - {{ .Values.global.cp.routeResources.gatewayapi.gatewayHostOrDomainName | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ $.Values.global.cp.routeResources.pathPrefix }}/o11y/{{ .Values.global.cp.dataplaneId }}/otlp/exporter/metrics/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: otel-userapp-metrics
      port: 4320
{{- /* GKE needs an explicit HealthCheckPolicy so the gateway backend probes the collector health_check extension, not the default "/" on the metrics port */ -}}
{{- if eq .Values.global.cp.routeResources.gatewayapi.gatewayAPIControllerName "GKE" }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: o11y-prom-scraper-hc
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "o11y-service.labels" . | nindent 4 }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 13133
        requestPath: /
  targetRef:
    group: ""
    kind: Service
    name: otel-userapp-metrics
{{- end }}
{{- end }}
{{- end -}}
