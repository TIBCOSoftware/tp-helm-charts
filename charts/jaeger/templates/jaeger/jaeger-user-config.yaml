{{- if .Values.userconfig -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jaeger.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "jaeger.annotations" . | nindent 4 }}
  {{- end }}
data:
  {{- $storageType := include "collector.storage.type" . | trim -}}
  {{- if not $storageType -}}
  {{- $storageType = include "query.storage.type" . | trim -}}
  {{- end -}}
  {{- $config := deepCopy .Values.userconfig -}}
  {{- if and (eq $storageType "memory") (dig "extensions" "jaeger_storage" "backends" "primary_store" "elasticsearch" nil $config) }}
  {{- $primaryStore := dict "memory" (dict "max_traces" 100000) -}}
  {{- $_ := set (index $config "extensions" "jaeger_storage" "backends") "primary_store" $primaryStore -}}
  {{- end }}
  user-config.yaml: |
{{ toYaml $config | indent 4 }}
{{- end -}}
