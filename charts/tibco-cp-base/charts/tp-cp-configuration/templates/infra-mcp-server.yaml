apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tp-cp-configuration.name" . }}-infra-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tp-cp-configuration.labels" . | nindent 4 }}
data:
  version.json: |
    {
      "capabilityVersion": "1.20.0",
      "minCPVersion": "1.20.0",
      "maxCPVersion": "",
      "releaseDate": {{ .Values.capabilities.inframcpserver.releaseDate | quote }},
      "releaseNotes": {{ .Values.capabilities.inframcpserver.releaseNotes | quote }},
      "minVersionRequiredForUpgrade": "1.19.0",
      "minDPVersion": {
         "dp-core-infrastructure": "1.18.0",
         "dp-configure-namespace": "1.20.0"
      }
    }
  package.json: |
    {
      "package": {
        "services": [
          {
            "name": "tp-dp-infra-mcp-server",
            "description": "TIBCO® Platform Infra Model Context Protocol (MCP) Server",
            "monitoringPriority": "essential"
          }
        ],
        "dependsOn": [],
        "provisioningRoles": [
          "DEV_OPS"
        ],
        "allowMultipleInstances": false
      }
    }
  recipe.yaml: |
    recipe:
      helmCharts:
        - name: tp-dp-infra-mcp-server
          namespace: ${NAMESPACE}
          version: {{ .Values.capabilities.inframcpserver.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                dataplaneId: ${DATAPLANE_ID}
                dpName: ${DATAPLANE_NAME}
                namespace: ${NAMESPACE}
                image:
                  tag: {{ .Values.capabilities.inframcpserver.tag | quote }}
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
---

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tp-cp-configuration.name" . }}-infra-mcp-server-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tp-cp-configuration.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "tp-cp-configuration.labels" . | nindent 8 }}
    spec:
    {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
    {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: infra-mcp-server
        image: {{ include "tp-cp-configuration.image.registry" .}}{{"/"}}{{ include "tp-cp-configuration.image.repository" .}}{{"/common-distroless-base-debian-debug"}}:{{ .Values.global.tibco.commonImages.distrolessDebug.tag }}
        imagePullPolicy: IfNotPresent
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        {{- if eq (include "tp-cp-configuration.enableResourceConstraints" . ) "true" }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10}}
        {{- end }}
        {{- end }}
        env:
        - name: CAPABILITY_NAME
          value: "inframcpserver"
        - name: RECIPE_MOUNT_LOCATION
          value: "/opt/tibco/recipe"
        - name: RECIPE_TARGET_LOCATION
          value: "/private/tsc/config/capabilities/platform"
        - name: RECIPE_RELEASE_VERSION
          value: "1.20.0"
        - name: SPACE_SEPARATED_UNSUPPORTED_RECIPE_VERSIONS
          value: ""
        - name: OVERWRITE_RECIPE
          value: {{ .Values.capabilities.inframcpserver.overwriteRecipe | quote }}
        - name: IS_LATEST
          value: {{ .Values.capabilities.inframcpserver.isLatest | quote }}
        volumeMounts:
        - name: {{ include "tp-cp-configuration.name" . }}-infra-mcp-server-volume
          mountPath: /opt/tibco/recipe
        - name: scripts-config-volume
          mountPath: /opt/tibco/scripts
        - name: store-vol
          mountPath: /private/tsc/config
          subPath: tsc/config
        command: ["sh"]
        args: ["-c", "/opt/tibco/scripts/run.sh"]
      restartPolicy: Never
      volumes:
        - name: {{ include "tp-cp-configuration.name" . }}-infra-mcp-server-volume
          configMap:
            name: {{ include "tp-cp-configuration.name" . }}-infra-mcp-server
        - name: scripts-config-volume
          configMap:
            name: {{ include "tp-cp-configuration.name" . }}-script
            defaultMode: 0777
        - name: store-vol
          persistentVolumeClaim:
            claimName: {{ include "tp-cp-configuration.pvc-name" . }}
      imagePullSecrets:
        {{- if (include "tp-cp-configuration.container-registry.secret" .) }}
        - name: {{ include "tp-cp-configuration.container-registry.secret" . }}
        {{- end}}
