idm {
      enable-cic-short-cookie = "true"
}

idps {
    default-idp {
      autoRegisterDomains = ""
      hostName = "localhost"
      hostName = ${?IDENTITY_MANAGEMENT_DEFAULTIDP_HOSTNAME}
      podHostName = "localhost"
      podHostName = ${?TP_CP_IDP_HOST}
      attributeMappings {
        email = "urn:oid:1.3.6.1.4.1.5923.1.1.1.6"
        firstName = "urn:oid:2.5.4.42"
        lastName = "urn:oid:2.5.4.4"
        subject = "subject"
      }
      issuer = "tibco-controlplane"
      searchUrl = "http://"${idps.default-idp.podHostName}":7893/v1/users"
      inviteUrl = "http://"${idps.default-idp.podHostName}":7893/v1/users"
      cleanupResourcesUrl = "http://"${idps.default-idp.podHostName}":7893/v1/expired-resources/cleanup"
      loginUrl = "https://"${idps.default-idp.hostName}"/sso"
      loginbind = "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
      trustedCerts = "/etc/idm/certs/idp.pem"

      #Supported signature algorithms for default idp
      supportedSignatureAlgorithms = ["http://www.w3.org/2000/09/xmldsig#rsa-sha1", "http://www.w3.org/2001/04/xmldsig-more#rsa-sha256",
          "http://www.w3.org/2001/04/xmldsig-more#rsa-sha384", "http://www.w3.org/2001/04/xmldsig-more#rsa-sha512"]

      keystoreURL = "/etc/idm/certs/idm.p12"
      keystoreURL = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_KEYSTORE_URL}
      keystorepassword = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_KEY_STORE_PASSWORD}
      keystorekeyalias = "cic_cloud"
      keystorekeyalias = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_KEY_STORE_KEY_ALIAS}
      keystoretype = "PKCS12"
      nameidformattransient = "urn:oasis:names:tc:SAML:2.0:nameid-format:transient"
      passwordprotectedtransport = "urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport"
      TSC {
        requestingSystem = "ignored"
        requestingSystemUsername = "ignored"
        secretKey = "ignored"
      }
    }

    # PureAuth configuration for UAT/QA (renegadir)
    renegadir {
      isPureAuth = true
      autoRegisterDomains = "tibco-support.com, tibco.com, tibcoapps.com, cloud.com, citrix.com, arctera.com"


      issuer = "poc_cloud_platform2"
      issuer = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_TSC_ISSUER}

      oauth {
        clientId = "83TLAh5T1h5yp7Sqy8xbq9efI45f84WcteVZx9gl"  # gitleaks:allow
        clientId = ${?IDENTITY_MANAGEMENT_PUREAUTH_OAUTH_CLIENT_ID}  # gitleaks:allow
        clientSecret = "xyel1TV88HyDrt6i1Fzel1Yw9ifqaZBvOEa2Ynk7Gi8MuVjJ2iuQMb"  # gitleaks:allow
        clientSecret = ${?IDENTITY_MANAGEMENT_PUREAUTH_OAUTH_CLIENT_SECRET}  # gitleaks:allow
        tokenEndpoint = "https://api.renegadir.net/api/v1/oauth/token/"
        tokenEndpoint = ${?IDENTITY_MANAGEMENT_PUREAUTH_TOKEN_ENDPOINT}
      }

      api {
        usersUrl = "https://api.renegadir.net/api/v1/users/"
        usersUrl = ${?IDENTITY_MANAGEMENT_PUREAUTH_API_USERS_URL}
        defaultGroupId = ${?IDENTITY_MANAGEMENT_PUREAUTH_DEFAULT_GROUP_ID}
      }

      keystoreURL = "resource://sso-conf/cic_cloud.p12"
      keystorepassword = ${IDENTITY_MANAGEMENT_TIBCOACCOUNT_KEY_STORE_PASSWORD}
      keystorekeyalias = "cic_cloud"

      SP_Id = "6k9fVP0J4GlYI44UfY39h"  # gitleaks:allow
      SP_Id = ${?IDENTITY_MANAGEMENT_PUREAUTH_SP_ID}  # gitleaks:allow
      loginUrl = "https://auth.renegadir.net/saml/sso/"${idps.renegadir.SP_Id}"/"
      logoutUrl = "https://auth.renegadir.net/saml/slo/"${idps.renegadir.SP_Id}"/"
      loginbind = "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
      logoutbind = "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
      trustedCerts = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_TA_CERTS}
      passwordprotectedtransport = "urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport"

      #Supported signature algorithms for TA
      supportedSignatureAlgorithms = ["http://www.w3.org/2001/04/xmldsig-more#rsa-sha256",
                "http://www.w3.org/2001/04/xmldsig-more#rsa-sha384", "http://www.w3.org/2001/04/xmldsig-more#rsa-sha512",
                "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha256", "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha384",
                "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha512"]
      nameidformattransient = "urn:oasis:names:tc:SAML:2.0:nameid-format:transient"
    }

    # PureAuth configuration for production (auth.cloud.com)
    auth_cloud_com {
      isPureAuth = true
      autoRegisterDomains = "tibco-support.com, tibco.com, tibcoapps.com, cloud.com, citrix.com, arctera.com"

      issuer = "tibco_platform"
      issuer = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_TSC_ISSUER}

      oauth {
        clientId = "placeholder-client-id"  # gitleaks:allow
        clientId = ${?IDENTITY_MANAGEMENT_PUREAUTH_OAUTH_CLIENT_ID}  # gitleaks:allow
        clientSecret = "placeholder-client-secret"  # gitleaks:allow
        clientSecret = ${?IDENTITY_MANAGEMENT_PUREAUTH_OAUTH_CLIENT_SECRET}  # gitleaks:allow
        tokenEndpoint = "https://api.auth.cloud.com/api/v1/oauth/token/"
        tokenEndpoint = ${?IDENTITY_MANAGEMENT_PUREAUTH_TOKEN_ENDPOINT}
      }

      api {
        usersUrl = "https://api.auth.cloud.com/api/v1/users/"
        usersUrl = ${?IDENTITY_MANAGEMENT_PUREAUTH_API_USERS_URL}
        defaultGroupId = ${?IDENTITY_MANAGEMENT_PUREAUTH_DEFAULT_GROUP_ID}
      }

      keystoreURL = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_KEYSTORE_URL}
      keystorepassword = ${IDENTITY_MANAGEMENT_TIBCOACCOUNT_KEY_STORE_PASSWORD}
      keystorekeyalias = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_KEY_STORE_KEY_ALIAS}

      SP_Id = "placeholder_SP_Id"  # gitleaks:allow
      SP_Id = ${?IDENTITY_MANAGEMENT_PUREAUTH_SP_ID}  # gitleaks:allow
      loginUrl = "https://auth.cloud.com/saml/sso/"${idps.auth_cloud_com.SP_Id}"/"
      logoutUrl = "https://auth.cloud.com/saml/slo/"${idps.auth_cloud_com.SP_Id}"/"
      loginbind = "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
      logoutbind = "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
      trustedCerts = ${?IDENTITY_MANAGEMENT_TIBCOACCOUNT_TA_CERTS}
      passwordprotectedtransport = "urn:oasis:names:tc:SAML:2.0:ac:classes:PasswordProtectedTransport"

      #Supported signature algorithms for TA
      supportedSignatureAlgorithms = ["http://www.w3.org/2001/04/xmldsig-more#rsa-sha256",
            "http://www.w3.org/2001/04/xmldsig-more#rsa-sha384", "http://www.w3.org/2001/04/xmldsig-more#rsa-sha512",
            "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha256", "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha384",
            "http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha512"]
      nameidformattransient = "urn:oasis:names:tc:SAML:2.0:nameid-format:transient"
    }
  }
