apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tp-control-plane.consts.appName" . }}-env
  namespace: {{ include "tp-control-plane.consts.namespace" . }}
  labels:
    {{- include "tp-control-plane.shared.labels.standard" . | nindent 4 }}
data:
    {{/* Defined the Global scope to access the variables from Values.yaml */}}
    {{- $currentScope := . -}}
    {{- $disabledCaps := .Values.global.tibco.disabledInfraCapabilities | default list -}}
    {{- $validCaps := list "MONITORINGAGENT" "CPPROXY" "O11Y" "HAWKCONSOLE" "BWADAPTER" "MFTADAPTER" -}}
    {{- range $disabledCaps -}}
      {{- if not (has . $validCaps) -}}
        {{- fail (printf "global.tibco.disabledInfraCapabilities: unknown capability '%s'. Valid values: %s" . (join ", " $validCaps)) -}}
      {{- end -}}
    {{- end -}}
    {{- with $currentScope}}
      {{- $finalPath := "files/common.yaml" -}}
      {{ $content := .Files.Get ( printf "%s" $finalPath ) | fromYaml }}
      {{- range $key, $val := $content -}}
        {{- $typeParent := typeOf $val -}}
        {{- if eq $typeParent "map[string]interface {}" -}}
          {{- range $nestedKey, $nestedValue := $val -}}
            {{- if and $disabledCaps (eq $nestedKey "mandatoryInfraCapabilityLists") -}}
              {{- $capVal := $nestedValue -}}
              {{- range $disabledCaps -}}
                {{- $capVal = $capVal | replace (printf ", '%s'" .) "" | replace (printf "'%s', " .) "" | replace (printf "'%s'" .) "" -}}
              {{- end -}}
                   {{ printf "%s.%s" $key $nestedKey | trim | nindent 2 }}: {{ $capVal | quote }}
            {{- else -}}
                   {{ printf "%s.%s" $key $nestedKey | trim | nindent 2 }}: {{ $nestedValue | quote }}
            {{- end -}}
          {{- end -}}
        {{- else -}}
          {{ $key | trim | nindent 2 }}: {{ $val | quote }}
        {{- end -}}
      {{- end -}}
    {{- end -}}
