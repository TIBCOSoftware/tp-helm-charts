# Global section will apply to this chart and all of its subcharts.
global:
  external:
    environment: ""
    helmRepo: "https://tibcosoftware.github.io/tp-helm-charts"
  tibco:
    image_name:
      webserver: ""
    image_repo_path: ""
    self_hosted_deployment: true
    finops: "disable"
    msg_dp_config_enabled: "true"
    artifact_manager_disk_storage_threshold: 80
    bpm_auto_discovery_enabled: false

  # Pod Security Context configuration
  # This configuration ensures that the pod is run with non-root privileges for enhanced security.
  # The user, group, and filesystem group IDs are all set to 1000.
  # The filesystem group change policy is set to "Always", meaning the filesystem group is always set to the fsGroup.
  # The seccomp (secure computing mode) profile is set to RuntimeDefault, which means it uses the default profile provided by the runtime.
  # The sysctls configuration allows the platform hybrid proxy to bind to low ports (below 1024) as a non-root user.
  # This is achieved by setting the 'net.ipv4.ip_unprivileged_port_start' sysctl to 0.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "Always"
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    # It specifies that privilege escalation is not allowed for security reasons.
    # Additionally, it drops all capabilities, which is a common security practice to minimize potential risks.
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
        - CAP_NET_RAW

# Resource values for production like setup
cpwebserver:
  aiAgent:
    enabled: false
  # Enable the Infra MCP Server capability in the web-server UI
  infraMcpServerEnabled: true
  # PCP-22688: gates Oracle/MSSQL DB types, SSL support in DBCONFIG, and SEARCHCONFIG resource type.
  # Default true = nothing hidden. Set to false to restrict extended resource features.
  extendedResourcesEnabled: false
  # PCP-19468: Pendo product analytics. On by default, but SaaS only — the
  # template renders PENDO_ENABLED=false whenever global.tibco.self_hosted_deployment
  # is true, so self-hosted installs never get Pendo no matter what this says.
  # Set to false to switch Pendo off on SaaS as well.
  pendoEnabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi
fluentbit:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 100m
      memory: 150Mi
checkPodDependencies:
  resources:
    requests:
      cpu: "10m"
      memory: "20Mi"
    limits:
      cpu: "30m"
      memory: "40Mi"

# HPA
hpa:
  cpu: 70
  memory: 70

# no of replicas
# replicaCount: "1"  # Commented out - HPA manages replicas dynamically


# MCP Hub
mcpHub:
  enabled: false

# CP MCP Server
cpmcpserver:
  enabled: false
  image:
    name: infra-cp-mcp-server
    tag: "1070-distroless"
  logLevel: "INFO"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
mcpAggregator:
  image:
    name: infra-cp-mcp-aggregator
    # Move this by ancestry, not by build number: a branch build forks from wherever its
    # branch was cut, so a higher number can be missing commits a lower one already has.
    tag: "207-distroless"
  logLevel: "INFO"
  # Scopes tools/list_changed to the affected session. With this false, one tenant onboarding
  # a data plane notifies every other tenant's connected session.
  listChangedScoping: true
  # Go duration string WITH a unit suffix; a bare number is rejected at render time. "" and
  # "0s" mean the image default, not off -- only a negative value disables idle reaping.
  sessionIdleTimeout: "10m"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # The aggregator's own log-shipper sizing, kept separate from the cp-web-server pod's
  # top-level `fluentbit.resources`. Values match what it previously inherited.
  fluentbit:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 150Mi
