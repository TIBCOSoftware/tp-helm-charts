apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tp-cp-o11y.appName" . }}-o11y
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tp-cp-o11y.labels" . | nindent 4 }}
data:
  version.json: |
    {
      "capabilityVersion": "1.20.0",
      "minCPVersion": "1.2.0",
      "maxCPVersion": "",
      "releaseDate": {{ .Values.capabilities.o11y.default.releaseDate | quote }},
      "releaseNotes": {{ .Values.capabilities.o11y.default.releaseNotes | quote }},
      "minVersionRequiredForUpgrade": "1.2.0",
      "minDPVersion": {
        "dp-core-infrastructure": "1.4.0",
        "dp-configure-namespace": "1.4.0"
      }
    }
  package.json: |
    {
      "package": {
        "services": [
          {
            "name": "o11y-service",
            "description": "o11y Service",
            "monitoringPriority": "essential"
          },
          {
            "name": "jaeger",
            "description": "jaeger",
            "monitoringPriority": "optional"
          },
          {
            "name": "otel-userapp",
            "description": "otel userapp",
            "monitoringPriority": "essential"
          },
          {
            "name": "otel-userapp-metrics",
            "description": "otel userapp metrics",
            "monitoringPriority": "essential"
          }
        ],
        "dependsOn": [],
        "provisioningRoles": [
          "DEV_OPS"
        ],
        "allowMultipleInstances": false
      }
    }
  recipe.yaml: |
    recipe:
      deploymentStrategy: "weighted-concurrency"
      helmCharts:
        - name: o11yservice
          namespace: ${NAMESPACE}
          version: {{ .Values.capabilities.o11y.default.o11yservice.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  cp:
                    logging:
                      fluentbit:
                        image:
                          tag: {{ .Values.global.tibco.commonImages.fluentbit.tag | quote }}
                  o11yservice:
                    job:
                      image:
                        tag: {{ .Values.global.tibco.commonImages.cpScripts.tag | quote }}
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
        - name: opentelemetry-collector
          namespace: ${NAMESPACE} 
          releaseName: otel-services
          version: {{ .Values.capabilities.o11y.default.opentelemetryCollector.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  cp:
                    svcPod:
                      enabled: false
                mode: "deployment"
                fullnameOverride: otel-services
                internalTelemetryViaOTLP:
                  endpoint: ""
                  traces:
                    enabled: false
                    endpoint: ""
                  metrics:
                    enabled: false
                    endpoint: ""
                  logs:
                    enabled: false
                    endpoint: ""
                serviceAccount:
                  create: false
                  annotations: {}
                  name: ${SERVICE-ACCOUNT}
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
        - name: opentelemetry-collector
          namespace: ${NAMESPACE}
          releaseName: otel-userapp
          version: {{ .Values.capabilities.o11y.default.opentelemetryCollector.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  cp:
                    serviceLogs:
                      enabled: true
                    serviceTraces:
                      enabled: true
                    serviceSvcLogs:
                      enabled: true
                mode: "deployment"
                fullnameOverride: otel-userapp
                internalTelemetryViaOTLP:
                  endpoint: ""
                  traces:
                    enabled: false
                    endpoint: ""
                  metrics:
                    enabled: false
                    endpoint: ""
                  logs:
                    enabled: false
                    endpoint: ""
                podLabels:
                  networking.platform.tibco.com/kubernetes-api: enable
                  networking.platform.tibco.com/logServer-egress: enable
                  networking.platform.tibco.com/internet-egress: enable
                  networking.platform.tibco.com/cluster-egress: enable
                serviceAccount:
                  create: false
                  annotations: {}
                  name: ${SERVICE-ACCOUNT}
                extraEnvs:
                  - name: KUBE_NODE_NAME
                    valueFrom:
                      fieldRef:
                        apiVersion: v1
                        fieldPath: spec.nodeName
                extraEnvsFrom:
                  - secretRef:
                      name: o11y-service
                  - configMapRef:
                      name: o11y-service
                ports:
                  otlp:
                    enabled: true
                    containerPort: 4317
                    servicePort: 4317
                    hostPort: 4317
                    protocol: TCP
                    # nodePort: 30317
                    appProtocol: grpc
                  otlp-http:
                    enabled: true
                    containerPort: 4318
                    servicePort: 4318
                    hostPort: 4318
                    protocol: TCP
                  metrics:
                    enabled: false
                    containerPort: 8888
                    servicePort: 8888
                    protocol: TCP
                config:
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                          endpoint: 0.0.0.0:4317
                        http:
                          cors:
                            allowed_origins:
                              - http://*
                              - https://*
                          endpoint: 0.0.0.0:4318
                    k8s_events:
                      namespaces: ["${env:app_namespace}"]
                  processors:
                    memory_limiter:
                      check_interval: 5s
                      limit_percentage: 80
                      spike_limit_percentage: 25
                      limit_mib: 2000
                    batch: {}
                    filter/devnull-logs:
                      error_mode: ignore
                      logs:
                        log_record:
                          - 'IsMatch(body, "")'
                    filter/devnull-traces:
                      error_mode: ignore
                      traces:
                        span:
                          - 'name != ""'
                    filter/health-traces:
                      error_mode: ignore
                      traces:
                        span:
                          - 'IsMatch(attributes["http.route"], ".*actuator/*") and IsMatch(resource.attributes["service.name"], "sb-app\\..*")'
                    k8sattributes/general:
                      auth_type: "serviceAccount"
                      passthrough: false
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        annotations:
                          - tag_name: connectors
                            key: platform.tibco.com/connectors
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                    k8sattributes/general-ns:
                      auth_type: "serviceAccount"
                      passthrough: false
                      filter:
                        namespace: ${env:app_namespace}
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        annotations:
                          - tag_name: connectors
                            key: platform.tibco.com/connectors
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                    transform/traces:
                      trace_statements:
                      - context: span
                        statements:
                          - delete_key(attributes, "error") where attributes["error"] == "false"
                          - set(attributes["pod_name"], resource.attributes["k8s.pod.name"])
                          - set(attributes["pod_namespace"], resource.attributes["k8s.namespace.name"])
                          - set(attributes["app_id"], resource.attributes["app_id"])
                          - set(attributes["app_type"], resource.attributes["app_type"])
                          - set(attributes["dataplane_id"], resource.attributes["dataplane_id"])
                          - set(attributes["workload_type"], resource.attributes["workload_type"])
                          - set(attributes["app_tags"], resource.attributes["app_tags"])
                          - set(attributes["app_name"], resource.attributes["app_name"])
                          - set(attributes["app_version"], resource.attributes["app_version"])
                          - set(attributes["capability_instance_id"], resource.attributes["capability_instance_id"])
                          - set(attributes["dataplane_id"], "${DATAPLANE-ID}") where attributes["dataplane_id"] == nil
                    filter/pod-warnings:
                      error_mode: ignore
                      logs:
                        log_record:
                          - 'severity_text != "Warning"'
                          - 'resource.attributes["k8s.object.kind"] != "Pod"'
                          - 'attributes["k8s.event.count"] != 1'
                    filter/pod-reasons:
                      error_mode: ignore
                      logs:
                        log_record:
                          - 'not IsMatch(attributes["k8s.event.reason"], "^(BackOff|OOMKilled|Failed|ErrImagePull|ImagePullBackOff|FailedScheduling|FailedMount|FailedAttachVolume)$")'
                    transform/pod-to-audit:
                      error_mode: ignore
                      log_statements:
                        - context: log
                          statements:
                            - set(resource.attributes["k8s.pod.name"], resource.attributes["k8s.object.name"]) where resource.attributes["k8s.object.kind"] == "Pod"
                            - set(resource.attributes["k8s.pod.uid"], resource.attributes["k8s.object.uid"]) where resource.attributes["k8s.object.kind"] == "Pod"
                            - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"])
                    k8sattributes/k8sevents:
                      auth_type: "serviceAccount"
                      passthrough: false
                      filter:
                        namespace: ${env:app_namespace}
                      pod_association:
                        - sources:
                          - from: resource_attribute
                            name: k8s.pod.uid
                        - sources:
                          - from: resource_attribute
                            name: k8s.pod.name
                          - from: resource_attribute
                            name: k8s.namespace.name
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                    transform/audit-body:
                      error_mode: ignore
                      log_statements:
                        - context: log
                          statements:
                            # Set resource attributes for count connector metric labels
                            - set(resource.attributes["audit.service_name"], "KubernetesEventNotify")
                            - set(resource.attributes["audit.audit_event"], "POD_CRASH_LOOP") where attributes["k8s.event.reason"] == "BackOff"
                            - set(resource.attributes["audit.audit_event"], "POD_OOM_KILLED") where attributes["k8s.event.reason"] == "OOMKilled"
                            - set(resource.attributes["audit.audit_event"], "POD_CONTAINER_FAILED") where attributes["k8s.event.reason"] == "Failed"
                            - set(resource.attributes["audit.audit_event"], "POD_IMAGE_PULL_FAILED") where attributes["k8s.event.reason"] == "ErrImagePull"
                            - set(resource.attributes["audit.audit_event"], "POD_IMAGE_PULL_BACKOFF") where attributes["k8s.event.reason"] == "ImagePullBackOff"
                            - set(resource.attributes["audit.audit_event"], "POD_SCHEDULING_FAILED") where attributes["k8s.event.reason"] == "FailedScheduling"
                            - set(resource.attributes["audit.audit_event"], "POD_VOLUME_MOUNT_FAILED") where attributes["k8s.event.reason"] == "FailedMount"
                            - set(resource.attributes["audit.audit_event"], "POD_VOLUME_ATTACH_FAILED") where attributes["k8s.event.reason"] == "FailedAttachVolume"
                            - set(resource.attributes["audit.audit_status"], "FAILURE")
                            # audit_status: WARNING for probe/volume events (lower priority than pod crash/image failures)
                            - set(resource.attributes["audit.audit_status"], "WARNING") where attributes["k8s.event.reason"] == "Unhealthy" or attributes["k8s.event.reason"] == "FailedMount" or attributes["k8s.event.reason"] == "FailedAttachVolume"
                            - set(resource.attributes["audit.app_id"], resource.attributes["app_id"])
                            - set(resource.attributes["audit.app_type"], resource.attributes["app_type"])
                            - set(resource.attributes["audit.dataplane_id"], resource.attributes["dataplane_id"])
                            - set(resource.attributes["audit.instance"], resource.attributes["k8s.object.name"])
                            - set(resource.attributes["audit.app_instance"], resource.attributes["k8s.object.name"])
                            # Severity: default warning for forwarded Warning pod events
                            - set(resource.attributes["audit.severity"], "warning")
                            # Severity: critical for pod crash/image/scheduling failures
                            - set(resource.attributes["audit.severity"], "critical") where attributes["k8s.event.reason"] == "BackOff" or attributes["k8s.event.reason"] == "OOMKilled" or attributes["k8s.event.reason"] == "ErrImagePull" or attributes["k8s.event.reason"] == "ImagePullBackOff" or attributes["k8s.event.reason"] == "FailedScheduling" or attributes["k8s.event.reason"] == "Failed"
                            # Scope: derived from workload_type label (user-app=APP, capability-service=CAP, infra=DP)
                            - set(resource.attributes["audit.scope"], "DP") where resource.attributes["workload_type"] == "infra"
                            - set(resource.attributes["audit.scope"], "CAP") where resource.attributes["workload_type"] == "capability-service"
                            - set(resource.attributes["audit.scope"], "APP") where resource.attributes["workload_type"] == "user-app"
                            # Compose audit event body — only ES-mapped fields in cache
                            - 'set(cache["trans_desp"], Concat([attributes["k8s.event.reason"], body], ": "))'
                            - set(cache["trans_id"], UUID())
                            - set(cache["service_name"], "KubernetesEventNotify")
                            - set(cache["trans_status"], "FAILURE")
                            - set(cache["trans_status"], "WARNING") where attributes["k8s.event.reason"] == "Unhealthy" or attributes["k8s.event.reason"] == "FailedMount" or attributes["k8s.event.reason"] == "FailedAttachVolume"
                            - set(cache["trans_state"], attributes["k8s.event.reason"])
                            - set(cache["trans_source"], "System")
                            - set(cache["trans_destination"], attributes["k8s.namespace.name"])
                            - set(cache["trans_ts"], FormatTime(log.time, "%Y-%m-%dT%H:%M:%S.%LZ"))
                            - set(cache["create_ts"], FormatTime(log.time, "%Y-%m-%dT%H:%M:%S.%LZ"))
                            - set(cache["user_trans_id"], resource.attributes["dataplane_id"]) where resource.attributes["workload_type"] == "infra"
                            - set(cache["user_trans_id"], resource.attributes["capability_instance_id"]) where resource.attributes["workload_type"] == "capability-service"
                            - set(cache["user_trans_id"], resource.attributes["app_id"]) where resource.attributes["workload_type"] == "user-app"
                            - set(cache["user_id"], "System")
                            - set(cache["entry_id"], "")
                            - set(cache["parent_id"], "")
                            # Build extra_props entries (matching Go collectExtraProps field names)
                            - set(cache["ep0"]["prop_name"], "Scope")
                            - set(cache["ep0"]["prop_value"], resource.attributes["audit.scope"])
                            - set(cache["ep1"]["prop_name"], "UserId")
                            - set(cache["ep1"]["prop_value"], "System")
                            - set(cache["ep2"]["prop_name"], "DataPlaneId")
                            - set(cache["ep2"]["prop_value"], resource.attributes["dataplane_id"])
                            - set(cache["ep2"]["prop_value"], "") where resource.attributes["dataplane_id"] == nil
                            - set(cache["ep3"]["prop_name"], "DataPlaneType")
                            - set(cache["ep3"]["prop_value"], "k8s")
                            - set(cache["ep4"]["prop_name"], "CapabilityInstanceId")
                            - set(cache["ep4"]["prop_value"], resource.attributes["capability_instance_id"])
                            - set(cache["ep4"]["prop_value"], "") where resource.attributes["capability_instance_id"] == nil
                            - set(cache["ep5"]["prop_name"], "CapabilityName")
                            - set(cache["ep5"]["prop_value"], resource.attributes["app_type"])
                            - set(cache["ep5"]["prop_value"], "") where resource.attributes["app_type"] == nil
                            - set(cache["ep6"]["prop_name"], "AppId")
                            - set(cache["ep6"]["prop_value"], resource.attributes["app_id"])
                            - set(cache["ep6"]["prop_value"], "") where resource.attributes["app_id"] == nil
                            - set(cache["ep7"]["prop_name"], "AppName")
                            - set(cache["ep7"]["prop_value"], resource.attributes["app_name"])
                            - set(cache["ep7"]["prop_value"], "") where resource.attributes["app_name"] == nil
                            - set(cache["ep8"]["prop_name"], "k8s.event.reason")
                            - set(cache["ep8"]["prop_value"], attributes["k8s.event.reason"])
                            - set(cache["ep9"]["prop_name"], "k8s.event.count")
                            - set(cache["ep9"]["prop_value"], attributes["k8s.event.count"])
                            - set(cache["ep10"]["prop_name"], "k8s.object.kind")
                            - set(cache["ep10"]["prop_value"], resource.attributes["k8s.object.kind"])
                            - set(cache["ep11"]["prop_name"], "severity")
                            - set(cache["ep11"]["prop_value"], resource.attributes["audit.severity"])
                            - set(cache["ep12"]["prop_name"], "PodName")
                            - set(cache["ep12"]["prop_value"], resource.attributes["k8s.object.name"])
                            # Set body from cache, then remove epN staging keys (not in ES mapping)
                            - set(body, cache)
                            - delete_key(body, "ep0")
                            - delete_key(body, "ep1")
                            - delete_key(body, "ep2")
                            - delete_key(body, "ep3")
                            - delete_key(body, "ep4")
                            - delete_key(body, "ep5")
                            - delete_key(body, "ep6")
                            - delete_key(body, "ep7")
                            - delete_key(body, "ep8")
                            - delete_key(body, "ep9")
                            - delete_key(body, "ep10")
                            - delete_key(body, "ep11")
                            - delete_key(body, "ep12")
                            # Construct extra_props nested array (same pattern as transform/auditsafe)
                            - append(body["extra_props"], values = ["el0", "el1", "el2", "el3", "el4", "el5", "el6", "el7", "el8", "el9", "el10", "el11", "el12"])
                            - set(body["extra_props"][0], cache["ep0"])
                            - set(body["extra_props"][1], cache["ep1"])
                            - set(body["extra_props"][2], cache["ep2"])
                            - set(body["extra_props"][3], cache["ep3"])
                            - set(body["extra_props"][4], cache["ep4"])
                            - set(body["extra_props"][5], cache["ep5"])
                            - set(body["extra_props"][6], cache["ep6"])
                            - set(body["extra_props"][7], cache["ep7"])
                            - set(body["extra_props"][8], cache["ep8"])
                            - set(body["extra_props"][9], cache["ep9"])
                            - set(body["extra_props"][10], cache["ep10"])
                            - set(body["extra_props"][11], cache["ep11"])
                            - set(body["extra_props"][12], cache["ep12"])
                  exporters:
                    debug: {}
                    otlp/trace:
                      endpoint: ${env:JAEGER_COLLECTOR_ENDPOINT}
                      tls:
                        insecure: true
                    otlphttp/cp-audit:
                      endpoint: ${env:PLATFORM_POD_ALERT_EVENT_EXPORTER_OTLP_URL}
                  extensions:
                    health_check: {}
                  service:
                    telemetry:
                      logs: {}
                    extensions:
                      - health_check
                    pipelines:
                      logs:
                        exporters:
                          - debug
                        processors:
                          - filter/devnull-logs
                          - memory_limiter
                          - batch
                        receivers:
                          - otlp
                      traces:
                        receivers: ${env:traces_receiver}
                        processors: ${env:traces_processor}
                        exporters: ${env:traces_exporter}
                      logs/k8sevents:
                        receivers:
                          - k8s_events
                        processors:
                          - filter/pod-reasons
                          - filter/pod-warnings
                          - transform/pod-to-audit
                          - k8sattributes/k8sevents
                          - transform/audit-body
                          - memory_limiter
                          - batch
                        exporters:
                          - otlphttp/cp-audit
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
            isDevTesting: true
        - name: opentelemetry-collector
          namespace: ${NAMESPACE}
          releaseName: otel-userapp-metrics
          version: {{ .Values.capabilities.o11y.default.opentelemetryCollector.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                mode: "deployment"
                fullnameOverride: otel-userapp-metrics
                internalTelemetryViaOTLP:
                  endpoint: ""
                  traces:
                    enabled: false
                    endpoint: ""
                  metrics:
                    enabled: false
                    endpoint: ""
                  logs:
                    enabled: false
                    endpoint: ""
                podLabels:
                  networking.platform.tibco.com/kubernetes-api: enable
                  networking.platform.tibco.com/prometheus: enable
                  networking.platform.tibco.com/internet-egress: enable
                  networking.platform.tibco.com/cluster-egress: enable
                  prometheus.io/scrape: "true"
                  prometheus.io/path: "metrics"
                  prometheus.io/port: "4319"
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: 1000m
                    memory: 1024Mi
                serviceAccount:
                  create: false
                  name: ${SERVICE-ACCOUNT}
                extraVolumes:
                  - name: hawktargets
                    configMap:
                      defaultMode: 420
                      items:
                      - key: hawktargets
                        path: hawktargets.yml
                      name: o11y-service
                extraVolumeMounts:
                  - mountPath: /conf/hawkconsole
                    name: hawktargets
                extraEnvs:
                  - name: KUBE_NODE_NAME
                    valueFrom:
                      fieldRef:
                        apiVersion: v1
                        fieldPath: spec.nodeName
                extraEnvsFrom:
                  - secretRef:
                      name: o11y-service
                  - configMapRef:
                      name: o11y-service
                ports:
                  otlp:
                    enabled: true
                    containerPort: 4317
                    servicePort: 4317
                    hostPort: 4317
                    protocol: TCP
                    # nodePort: 30317
                    appProtocol: grpc
                  otlp-http:
                    enabled: true
                    containerPort: 4318
                    servicePort: 4318
                    hostPort: 4318
                    protocol: TCP
                  metrics:
                    enabled: true
                    containerPort: 8888
                    servicePort: 8888
                    hostPort: 8888
                    protocol: TCP
                  prometheus:
                    enabled: true
                    containerPort: 4319
                    servicePort: 4319
                    hostPort: 4319
                    protocol: TCP
                  prometheus-ext:
                    enabled: true
                    containerPort: 4320
                    servicePort: 4320
                    hostPort: 4320
                    protocol: TCP
