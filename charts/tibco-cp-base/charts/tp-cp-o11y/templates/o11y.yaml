---

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tp-cp-o11y.appName" . }}-o11y-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tp-cp-o11y.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "tp-cp-o11y.labels" . | nindent 8 }}
    spec:
    {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
    {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: o11y
        image: {{ include "tp-cp-o11y.image.registry" .}}{{"/"}}{{ include "tp-cp-o11y.image.repository" .}}{{"/common-distroless-base-debian-debug"}}:{{ .Values.global.tibco.commonImages.distrolessDebug.tag }}
        imagePullPolicy: IfNotPresent
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        {{- if eq (include "tp-cp-o11y.enableResourceConstraints" . ) "true" }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10}}
        {{- end }}
        {{- end }}
        env:
        - name: CAPABILITY_NAME
          value: "o11y"
        - name: RECIPE_MOUNT_LOCATION
          value: "/opt/tibco/recipe"
        - name: RECIPE_TARGET_LOCATION
          value: "/private/tsc/config/capabilities/infra"
        - name: RECIPE_RELEASE_VERSION
          value: "1.20.0"
        - name: SPACE_SEPARATED_UNSUPPORTED_RECIPE_VERSIONS
          value: ""
        - name: OVERWRITE_RECIPE
          value: {{ .Values.capabilities.o11y.default.overwriteRecipe | quote }}
        - name: IS_LATEST
          value: {{ .Values.capabilities.o11y.default.isLatest | quote }}
        volumeMounts:
        - name: {{ include "tp-cp-o11y.appName" . }}-o11y-volume
          mountPath: /opt/tibco/recipe
        - name: scripts-config-volume
          mountPath: /opt/tibco/scripts
        - name: store-vol
          mountPath: /private/tsc/config
          subPath: tsc/config
        command: ["sh"]
        args: ["-c", "/opt/tibco/scripts/run.sh"]
      restartPolicy: Never
      volumes:
        - name: {{ include "tp-cp-o11y.appName" . }}-o11y-volume
          configMap:
            name: {{ include "tp-cp-o11y.appName" . }}-o11y
        - name: scripts-config-volume
          configMap:
            name: {{ include "tp-cp-o11y.appName" . }}-script
            defaultMode: 0777
        - name: store-vol
          persistentVolumeClaim:
            claimName: {{ include "tp-cp-o11y.pvc-name" . }}
      imagePullSecrets:
        {{- if (include "tp-cp-o11y.container-registry.secret" .) }}
        - name: {{ include "tp-cp-o11y.container-registry.secret" . }}
        {{- end}}