                            - delete_key(body, "ep0")
                            - delete_key(body, "ep1")
                            - delete_key(body, "ep2")
                            - delete_key(body, "ep3")
                            - delete_key(body, "ep4")
                            - delete_key(body, "ep5")
                            - delete_key(body, "ep6")
