                            - set(body["extra_props"][0], cache["ep0"])
                            - set(body["extra_props"][1], cache["ep1"])
                            - set(body["extra_props"][2], cache["ep2"])
                            - set(body["extra_props"][3], cache["ep3"])
                            - set(body["extra_props"][4], cache["ep4"])
                            - set(body["extra_props"][5], cache["ep5"])
