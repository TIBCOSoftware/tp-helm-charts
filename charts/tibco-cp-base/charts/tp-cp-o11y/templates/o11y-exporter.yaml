                             regex: "(hawk_trao11y_getserviceinstancesdetails_statecode|hawk_trao11y_onnewstatusorcmd_cpu_percent|hawk_trao11y_onnewstatusorcmd_cpu_total|hawk_trao11y_onnewstatusorcmd_mem_usage|hawk_bw5o11y_getprocessdefinitions_aborted|hawk_bw5o11y_getprocessdefinitions_completed|hawk_bw5o11y_getprocessdefinitions_created|hawk_bw5o11y_getprocessdefinitions_totalelapsed|hawk_bw5o11y_getprocessdefinitions_totalexecution)"
                           # Drop labels that are not required for hawkconsole metrics
                           - action: labeldrop
                             regex: "(?i)^(agent_os_name|agent_os_version|agent_host_name|agent_ip|agent_name|component_instance|microagent_display_name|microagent_instance|data|out_of_sync|archive_instance|net_host_name|net_host_port|job|url_scheme|http_scheme|instance)$"
                  processors:
                    memory_limiter:
                      check_interval: 5s
                      limit_percentage: 80
                      spike_limit_percentage: 25
                    batch:
                      # PCP-23711: deliberate ~30s cadence (matches the o11ymetrics CP scrape), not the
                      # raw otelcol default (batch: {} = 200ms/8192 ~ a 5 req/s firehose to CP under the
                      # continuous appengines OTLP stream). send_batch_size bounds request SIZE; a
                      # timeout-only batch buffers ~30s in RAM (~3.8x RSS) and would reinstate the
                      # cardinality memory this push fix removes (measured, PCP-23711).
                      timeout: 30s
                      send_batch_size: 8192
                    {{- if $mp.enabled }}
                    # PCP-23522: convert delta->cumulative before pushing to the Prometheus OTLP
                    # receiver (cumulative-only). max_streams bounds the state map so it does not
                    # reintroduce the cardinality-proportional memory this fix removes.
                    deltatocumulative:
                      max_stale: {{ dig "deltatocumulative" "maxStale" "5m" $mp }}
                      max_streams: {{ dig "deltatocumulative" "maxStreams" 100000 $mp | int64 }}
                    {{- end }}
                    filter/devnull:
                      error_mode: ignore
                      metrics:
                        metric:
                          - 'name != ""'
                        datapoint:
                          - 'metric.name != ""'
                    k8sattributes/general-ns:
                      auth_type: "serviceAccount"
                      filter:
                        namespace: ${env:app_namespace}
                      extract:
                        annotations:
                        - from: pod
                          key: platform.tibco.com/connectors
                          tag_name: connectors
                        - from: pod
                          key: platform.tibco.com/tags
                          tag_name: app_tags
                        labels:
                        - from: pod
                          key: platform.tibco.com/app-id
                          tag_name: app_id
                        - from: pod
                          key: platform.tibco.com/app-type
                          tag_name: app_type
                        - from: pod
                          key: platform.tibco.com/dataplane-id
                          tag_name: dataplane_id
                        - from: pod
                          key: platform.tibco.com/workload-type
                          tag_name: workload_type
                        - from: pod
                          key: platform.tibco.com/app-name
                          tag_name: app_name
                        - from: pod
                          key: platform.tibco.com/app-version
                          tag_name: app_version
                        - from: pod
                          key: platform.tibco.com/tags
                          tag_name: app_tags
                        - from: pod
                          key: platform.tibco.com/capability-instance-id
                          tag_name: capability_instance_id
                        metadata:
                        - k8s.pod.name
                        - k8s.pod.uid
                        - k8s.namespace.name
                        - k8s.pod.start_time
                      passthrough: false
                    k8sattributes/pa-ns:
                      auth_type: "serviceAccount"
                      filter:
                        namespace: ${env:app_namespace}
                      extract:
                        annotations:
                        - from: pod
                          key: platform.tibco.com/connectors
                          tag_name: connectors
                        - from: pod
                          key: platform.tibco.com/tags
                          tag_name: app_tags
                        labels:
                        - from: pod
                          key: platform.tibco.com/app-id
                          tag_name: app_id
                        - from: pod
                          key: platform.tibco.com/app-type
                          tag_name: app_type
                        - from: pod
                          key: platform.tibco.com/dataplane-id
                          tag_name: dataplane_id
                        - from: pod
                          key: platform.tibco.com/workload-type
                          tag_name: workload_type
                        - from: pod
                          key: platform.tibco.com/app-name
                          tag_name: app_name
                        - from: pod
                          key: platform.tibco.com/app-version
                          tag_name: app_version
                        - from: pod
                          key: platform.tibco.com/tags
                          tag_name: app_tags
                        - from: pod
                          key: platform.tibco.com/capability-instance-id
                          tag_name: capability_instance_id
                        - from: pod
                          key: tib-msg-group-name
                          tag_name: tib-msg-group-name
                        metadata:
                        - k8s.pod.name
                        - k8s.pod.uid
                        - k8s.namespace.name
                        - k8s.pod.start_time
                      passthrough: false
                      pod_association:
                      - sources:
                        - from: resource_attribute
                          name: k8s.pod.uid
                      - sources:
                        - from: resource_attribute
                          name: k8s.pod.name
                        - from: resource_attribute
                          name: k8s.namespace.name
                    k8sattributes/general:
                      auth_type: "serviceAccount"
                      passthrough: false
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        annotations:
                          - tag_name: connectors
                            key: platform.tibco.com/connectors
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                    k8sattributes/pa:
                      auth_type: "serviceAccount"
                      passthrough: false
                      pod_association:
                      - sources:
                        - from: resource_attribute
                          name: k8s.pod.uid
                      - sources:
                        - from: resource_attribute
                          name: k8s.pod.name
                        - from: resource_attribute
                          name: k8s.namespace.name
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        annotations:
                          - tag_name: connectors
                            key: platform.tibco.com/connectors
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                          - tag_name: tib-msg-group-name
                            key: tib-msg-group-name
                            from: pod
                    transform/metrics:
                      metric_statements:
                      - context: datapoint
                        statements:
                        - set(resource.attributes["k8s.pod.name"], attributes["Host"]) where resource.attributes["k8s.pod.uid"] == nil
                        - set(attributes["app_tags"], attributes["tags"]) where attributes["tags"] != ""
                        - delete_key(attributes, "tags") where attributes["tags"] != ""
                    transform/msg:
                      metric_statements:
                      - context: datapoint
                        statements:
                        - set(attributes["app_id"], resource.attributes["capability_instance_id"]) where IsMatch(resource.attributes["app_type"], "msg-*")
                        - set(attributes["dataplane_id"], "${DATAPLANE-ID}") where attributes["dataplane_id"] == nil
                    {{- if $mp.enabled }}
                    # PCP-23925: the CP-System push exporter (otlphttp/cp-metrics) has no
                    # resource_to_telemetry_conversion (otlphttp structurally can't), unlike the
                    # pull prometheus/ext exporter which promoted OTLP resource attributes ->
                    # per-series Prometheus labels. Reproduce that rtc on the push path by merging
                    # the metric's resource (envelope) attributes into its datapoint attributes so
                    # they land as series labels on CP Prometheus (app_type/dataplane_id/app_id/
                    # capability_instance_id/workload_type/k8s_*/service_name/...). Wired into
                    # metrics/appengines only when push is enabled; pull-mode render stays
                    # byte-identical. See tasks/PCP-23925-fix-handoff.md.
                    transform/userapp-promote-resource:
                      metric_statements:
                      - context: datapoint
                        statements:
                        - merge_maps(attributes, resource.attributes, "upsert")
                    # PCP-23925 (prom/scrape slice): restore rtc-equivalent label promotion on the
                    # prometheus/receive scrape pipeline under push. Card-critical k8s_namespace_name
                    # + service_name are resource attrs (k8sattributes/pa + the prometheus receiver)
                    # dropped by otlphttp on push. Promote them onto the datapoint with explicit,
                    # nil-guarded set()s (NOT merge_maps — merge_maps did not land on this pipeline
                    # live). CRITICAL: use the DOTTED resource key names ("k8s.namespace.name",
                    # "service.name") verbatim — NOT the underscore label names. The BYO pull exporter
                    # prometheus/user has resource_to_telemetry_conversion, which promotes the SAME
                    # resource attrs as CONSTANT labels; a datapoint attr keyed "service_name"
                    # (underscore) collides with rtc's "service_name" constant → the prometheus
                    # exporter fails with "duplicate label names in constant and variable labels" and
                    # DROPS those series from :4319 (breaks BYO pull — live-proven). Keying the
                    # datapoint attr "service.name" (dotted, == rtc's source key) dedupes cleanly, so
                    # :4319 is byte-identical while CP-push (otlphttp, no rtc) still gains the labels.
                    # Surgical (only card-critical labels) so it never overwrites transform/msg's
                    # datapoint app_id/dataplane_id. Wired AFTER transform/msg. Scope/HTTP-target
                    # attrs (otel_scope_*, server_*, url_scheme, service_instance_id) are accepted
                    # push-model differences (per-card acceptance).
                    transform/prom-promote-resource:
                      metric_statements:
                      - context: datapoint
                        statements:
                        - set(attributes["k8s.namespace.name"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
                        - set(attributes["service.name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
                        # PCP-24403: EMS (job="ems-pod", app_type="msg-ems") cards filter on
                        # capability_instance_id (+ the msg envelope), resource attrs lost under push
                        # (otlphttp, no rtc). This processor runs on the SHARED metrics/prom pipeline, so
                        # every set() is scoped defensively to EMS datapoints (app_type == "msg-ems"):
                        # non-EMS series (o11y-svc, hawkconsole, monitoring-agent) are untouched by
                        # construction (predicate false -> no-op), so no non-EMS label/cardinality change.
                        # Each set() key MUST also match its resource source key verbatim
                        # (underscore/hyphen/dotted) so the :4319 rtc exporter dedupes it — a mismatched key
                        # trips "duplicate label names" and drops the series from BYO pull.
                        - set(attributes["capability_instance_id"], resource.attributes["capability_instance_id"]) where resource.attributes["app_type"] == "msg-ems" and resource.attributes["capability_instance_id"] != nil
                        - set(attributes["app_type"], resource.attributes["app_type"]) where resource.attributes["app_type"] == "msg-ems"
                        - set(attributes["workload_type"], resource.attributes["workload_type"]) where resource.attributes["app_type"] == "msg-ems" and resource.attributes["workload_type"] != nil
                        - set(attributes["tib-msg-group-name"], resource.attributes["tib-msg-group-name"]) where resource.attributes["app_type"] == "msg-ems" and resource.attributes["tib-msg-group-name"] != nil
                        - set(attributes["k8s.pod.name"], resource.attributes["k8s.pod.name"]) where resource.attributes["app_type"] == "msg-ems" and resource.attributes["k8s.pod.name"] != nil
                    {{- end }}
                  exporters:
                    debug: {}
                    prometheus/user:
                      endpoint: 0.0.0.0:4319
                      enable_open_metrics: true
                      resource_to_telemetry_conversion:
                        enabled: true
                    prometheus/ext:
                      endpoint: 0.0.0.0:4320
                      enable_open_metrics: true
                      resource_to_telemetry_conversion:
                        enabled: true
                    otlphttp/metrics-export:
                      endpoint: ${env:METRICS_EXPORTER_OTLPHTTP_URL}
                      tls:
                        insecure_skip_verify: true
                      headers: ${env:headers_metrics_otlp_exporter}
                      {{- if $mp.enabled }}
                      # PCP-23522: same disk-buffered queue for the user's BYO OTLP endpoint.
                      sending_queue:
                        enabled: true
                        storage: file_storage/metrics
                        num_consumers: 10
                        sizer: bytes
                        queue_size: {{ dig "queue" "sizeBytes" 268435456 $mp | int64 }}
                        block_on_overflow: false
                      retry_on_failure:
                        enabled: true
                        initial_interval: 5s
                        max_interval: 30s
                        max_elapsed_time: 300s
                      {{- end }}
                    otlp/metrics-export:
                      endpoint: ${env:METRICS_EXPORTER_OTLPGRPC_URL}
                      tls:
                        insecure: true
                        insecure_skip_verify: true
                      headers: ${env:headers_metrics_otlp_exporter}
                      {{- if $mp.enabled }}
                      # PCP-24428: disk-buffer the BYO OTLP gRPC leg too (parity with the http BYO
                      # exporter above and the cp-metrics push exporter). exporterhelper's
                      # sending_queue + file_storage works identically for otlp (grpc) and otlphttp.
                      sending_queue:
                        enabled: true
                        storage: file_storage/metrics
                        num_consumers: 10
                        sizer: bytes
                        queue_size: {{ dig "queue" "sizeBytes" 268435456 $mp | int64 }}
                        block_on_overflow: false
                      retry_on_failure:
                        enabled: true
                        initial_interval: 5s
                        max_interval: 30s
                        max_elapsed_time: 300s
                      {{- end }}
                    {{- if $mp.enabled }}
                    # PCP-23522: CP-System metrics PUSH exporter, disk-buffered (file_storage-backed
                    # persistent sending_queue) — collector emits-and-forgets, so memory tracks queue
                    # depth, not live cardinality. Replaces the :4320 pull for CP-System delivery.
                    otlphttp/cp-metrics:
                      # No custom headers: the DP reaches CP via cp-proxy, which injects the DP
                      # OAuth bearer that the CP secure listener validates (PCP-23524 route).
                      endpoint: ${env:CP_METRICS_OTLPHTTP_URL}
                      tls:
                        insecure_skip_verify: true
                      sending_queue:
                        enabled: true
                        storage: file_storage/metrics
                        num_consumers: 10
                        sizer: bytes
                        queue_size: {{ dig "queue" "sizeBytes" 268435456 $mp | int64 }}
                        block_on_overflow: false
                      retry_on_failure:
                        enabled: true
                        initial_interval: 5s
                        max_interval: 30s
                        max_elapsed_time: 300s
                    {{- end }}
                    kafka/metrics-export-auth:
                      brokers: ${env:METRICS_EXPORTER_KAFKA_BROKERS}
                      protocol_version: ${env:METRICS_EXPORTER_KAFKA_PROTOCOL_VERSION}
                      metrics:
                        topic: ${env:METRICS_EXPORTER_KAFKA_TOPIC}
                      auth:
                        plain_text:
                          username: ${env:METRICS_EXPORTER_KAFKA_USERNAME}
                          password: ${env:METRICS_EXPORTER_KAFKA_PASSWORD}
                      {{- if $mp.enabled }}
                      # PCP-24428: disk-buffer the BYO kafka leg too. The kafka exporter uses
                      # exporterhelper, so it takes the same file_storage-backed sending_queue as the
                      # otlp/otlphttp legs (the Sarama producer's own buffering sits behind this queue).
                      sending_queue:
                        enabled: true
                        storage: file_storage/metrics
                        num_consumers: 10
                        sizer: bytes
                        queue_size: {{ dig "queue" "sizeBytes" 268435456 $mp | int64 }}
                        block_on_overflow: false
                      retry_on_failure:
                        enabled: true
                        initial_interval: 5s
                        max_interval: 30s
                        max_elapsed_time: 300s
                      {{- end }}
                    kafka/metrics-export:
                      brokers: ${env:METRICS_EXPORTER_KAFKA_BROKERS}
                      protocol_version: ${env:METRICS_EXPORTER_KAFKA_PROTOCOL_VERSION}
                      metrics:
                        topic: ${env:METRICS_EXPORTER_KAFKA_TOPIC}
                      {{- if $mp.enabled }}
                      # PCP-24428: disk-buffer the BYO kafka leg too (see kafka/metrics-export-auth).
                      sending_queue:
                        enabled: true
                        storage: file_storage/metrics
                        num_consumers: 10
                        sizer: bytes
                        queue_size: {{ dig "queue" "sizeBytes" 268435456 $mp | int64 }}
                        block_on_overflow: false
                      retry_on_failure:
                        enabled: true
                        initial_interval: 5s
                        max_interval: 30s
                        max_elapsed_time: 300s
                      {{- end }}
                  extensions:
                    health_check: {}
                    {{- if $mp.enabled }}
                    # PCP-23522: on-disk WAL backing the persistent sending_queue.
                    file_storage/metrics:
                      directory: /var/lib/otelcol/metrics-queue
                      timeout: 10s
                      fsync: true
                    {{- end }}
                  service:
                    telemetry:
                      logs: {}
                      # PCP-23799: expose otelcol_* self-telemetry on :8888 (level detailed includes
                      # the exporter queue-depth metrics) for pipeline-degradation RCA.
                      metrics:
                        level: detailed
                        readers:
                          - pull:
                              exporter:
                                prometheus:
                                  host: 0.0.0.0
                                  port: 8888
                    extensions:
                      - health_check
                      {{- if $mp.enabled }}
                      - file_storage/metrics
                      {{- end }}
                    pipelines:
                      metrics/appengines:
                        receivers: ${env:metrics_appengines_rec}
                        processors: ${env:metrics_appengines_proc}
                        exporters: ${env:metrics_appengines_exp}
                      metrics/prom:
                        receivers: ${env:metrics_prom_rec}
                        processors: ${env:metrics_prom_proc}
                        exporters: ${env:metrics_prom_exp}
                      # PCP-23799: collector self-telemetry pipeline — otelcol_* scraped from :8888,
                      # dataplane_id-stamped (transform/msg), delivered via the SAME CP-System exporter
                      # selection as metrics/prom (env-driven: push, or the :4320 pull on fallback).
                      # Hard-wired, delivery-agnostic, always on.
                      metrics/otelcol-self:
                        receivers: [prometheus/otelcol-self]
                        processors: [memory_limiter, transform/msg, batch]
                        exporters: ${env:metrics_prom_exp}
                      metrics/ext:
                        receivers: [nop]
                        exporters: [prometheus/ext]
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
            isDevTesting: true
        - name: opentelemetry-collector
          namespace: ${NAMESPACE} 
          releaseName: otel-finops
          version: {{ .Values.capabilities.o11y.default.opentelemetryCollector.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  cp:
                    svcPod:
                      enabled: false
                mode: "deployment"
                fullnameOverride: otel-finops
                internalTelemetryViaOTLP:
                  endpoint: ""
                  traces:
                    enabled: false
                    endpoint: ""
                  metrics:
                    enabled: false
                    endpoint: ""
                  logs:
                    enabled: false
                    endpoint: ""
                serviceAccount:
                  create: false
                  annotations: {}
                  name: ${SERVICE-ACCOUNT}
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
        - name: jaeger
          namespace: ${NAMESPACE}
          releaseName: jaeger
          version: {{ .Values.capabilities.o11y.withResources.jaeger.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  cp:
                    resources:
                      o11y:
                        tracesServer:
                          enabled: false
                fullnameOverride: jaeger
                storage:
                  type: elasticsearch
                  elasticsearch:
                    tls:
                      enabled: false
                      secretName: jaeger-elasticsearch
                jaeger:
                  podLabels:
                    networking.platform.tibco.com/kubernetes-api: enable
                    networking.platform.tibco.com/logServer-egress: enable
                    networking.platform.tibco.com/internet-egress: enable
                    networking.platform.tibco.com/cluster-egress: enable
                  resources:
                    requests:
                      cpu: 200m
                      memory: 256Mi
                    limits:
                      cpu: 1000m
                      memory: 1024Mi
                  serviceAccount:
                    create: false
                    name: ${SERVICE-ACCOUNT}
                uiconfig:
                  monitor:
                    menuEnabled: false
                  dependencies:
                    menuEnabled: false
                  menu:
                    - label: "Control Panel"
                      items:
                        - label: "Home"
                          url: "../../../../cp"
                        - label: "Data Planes"
                          url: "../../../../cp/app/subscription"
                        - label: "Observability"
                          url: "../../../../cp/metrics"
                  linkPatterns:
                    - type: "tags"
                      key: "app_id"
                      url: "../../../../cp/#{app_type}/appdetails/processes?dp_id=#{dataplane_id}&capability_instance_id=#{capability_instance_id}&app_id=#{app_id}"
                      text: "Open app details #{app_name}"
                userconfig:
                  service:
                    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
                    pipelines:
                      traces:
                        receivers: [otlp]
                        exporters: [jaeger_storage_exporter]
                    telemetry:
                      resource:
                        service.name: jaeger
                      metrics:
                        level: detailed
                        readers:
                          - pull:
                              exporter:
                                prometheus:
                                  host: 0.0.0.0
                                  port: 8888
                  extensions:
                    healthcheckv2:
                      use_v2: true
                      http:
                        endpoint: 0.0.0.0:13133
                    jaeger_query:
                      base_path: /o11y/v1/traceproxy/${DATAPLANE-ID}
                      storage:
                        traces: primary_store
                      ui:
                        config_file: /etc/jaeger/ui-config.json
                    jaeger_storage:
                      backends:
                        primary_store:
                          elasticsearch:
                            server_urls: ["${env:ES_SERVER_URLS}"]
                            auth:
                              basic:
                                username: "${env:ES_USERNAME}"
                                password: "${env:ES_PASSWORD}"
                            tls:
                              insecure_skip_verify: true
                            # Index templates are pre-created in Elasticsearch (dp-config-es),
                            # so Jaeger must not create them on startup. This also skips the
                            # PUT _index_template request whose duplicate Authorization header
                            # (go-elasticsearch v9.x) is rejected by AWS ELB with a 400. (PCP-21169)
                            create_mappings: false
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                          endpoint: 0.0.0.0:4317
                        http:
                          endpoint: 0.0.0.0:4318
                  exporters:
                    jaeger_storage_exporter:
                      trace_storage: primary_store
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
            isDevTesting: true

---

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tp-cp-o11y.appName" . }}-o11y-exporter-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tp-cp-o11y.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "tp-cp-o11y.labels" . | nindent 8 }}
    spec:
    {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
    {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: o11y
        image: {{ include "tp-cp-o11y.image.registry" .}}{{"/"}}{{ include "tp-cp-o11y.image.repository" .}}{{"/common-distroless-base-debian-debug"}}:{{ .Values.global.tibco.commonImages.distrolessDebug.tag }}
        imagePullPolicy: IfNotPresent
        {{- if .Values.securityContext }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        {{- end }}
        {{- if eq (include "tp-cp-o11y.enableResourceConstraints" . ) "true" }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10}}
        {{- end }}
        {{- end }}
        env:
        - name: CAPABILITY_NAME
          value: "o11y"
        - name: RECIPE_MOUNT_LOCATION
          value: "/opt/tibco/recipe"
        - name: RECIPE_TARGET_LOCATION
          value: "/private/tsc/config/capabilities/platform"
        - name: RECIPE_RELEASE_VERSION
          value: "1.21.0"
        - name: SPACE_SEPARATED_UNSUPPORTED_RECIPE_VERSIONS
          value: ""
        - name: OVERWRITE_RECIPE
          value: {{ .Values.capabilities.o11y.withResources.overwriteRecipe | quote }}
        - name: IS_LATEST
          value: {{ .Values.capabilities.o11y.withResources.isLatest | quote }}
        volumeMounts:
        - name: {{ include "tp-cp-o11y.appName" . }}-o11y-exporter-volume
          mountPath: /opt/tibco/recipe
        - name: scripts-config-volume
          mountPath: /opt/tibco/scripts
        - name: store-vol
          mountPath: /private/tsc/config
          subPath: tsc/config
        command: ["sh"]
        args: ["-c", "/opt/tibco/scripts/run.sh"]
      restartPolicy: Never
      volumes:
        - name: {{ include "tp-cp-o11y.appName" . }}-o11y-exporter-volume
          configMap:
            name: {{ include "tp-cp-o11y.appName" . }}-o11y-exporter
        - name: scripts-config-volume
          configMap:
            name: {{ include "tp-cp-o11y.appName" . }}-script
            defaultMode: 0777
        - name: store-vol
          persistentVolumeClaim:
            claimName: {{ include "tp-cp-o11y.pvc-name" . }}
      imagePullSecrets:
        {{- if (include "tp-cp-o11y.container-registry.secret" .) }}
        - name: {{ include "tp-cp-o11y.container-registry.secret" . }}
        {{- end}}