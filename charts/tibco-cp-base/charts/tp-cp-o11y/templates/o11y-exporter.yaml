{{- /* PCP-23522: metricsPush gate — disk-buffered OTLP push for otel-userapp-metrics (default OFF). */ -}}
{{- $mp := .Values.capabilities.o11y.withResources.metricsPush | default dict -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tp-cp-o11y.appName" . }}-o11y-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tp-cp-o11y.labels" . | nindent 4 }}
data:
  version.json: |
    {
      "capabilityVersion": "1.21.0",
      "minCPVersion": "1.2.0",
      "maxCPVersion": "",
      "releaseDate": {{ .Values.capabilities.o11y.withResources.releaseDate | quote }},
      "releaseNotes": {{ .Values.capabilities.o11y.withResources.releaseNotes | quote }},
      "minVersionRequiredForUpgrade": "1.2.0",
      "minDPVersion": {
        "dp-core-infrastructure": "1.4.0",
        "dp-configure-namespace": "1.4.0"
      }
    }
  package.json: |
    {
      "package": {
        "services": [
          {
            "name": "o11y-service",
            "description": "o11y Service",
            "monitoringPriority": "essential"
          },
          {
            "name": "jaeger",
            "description": "jaeger",
            "monitoringPriority": "optional"
          },
          {
            "name": "otel-userapp",
            "description": "otel userapp",
            "monitoringPriority": "essential"
          },
          {
            "name": "otel-userapp-metrics",
            "description": "otel userapp metrics",
            "monitoringPriority": "essential"
          }
        ],
        "dependsOn": [],
        "provisioningRoles": [
          "DEV_OPS"
        ],
        "allowMultipleInstances": false
      }
    }
  recipe.yaml: |
    recipe:
      deploymentStrategy: "weighted-concurrency"
      helmCharts:
        - name: o11yservice
          namespace: ${NAMESPACE}
          version: {{ .Values.capabilities.o11y.withResources.o11yservice.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  o11yservice:
                    job:
                      image:
                        tag: {{ .Values.global.tibco.commonImages.cpScripts.tag | quote }}
                  cp:
                    logging:
                      fluentbit:
                        image:
                          tag: {{ .Values.global.tibco.commonImages.fluentbit.tag | quote }}
                    resources:
                      o11y:
                        logsServer:
                          config:
                            exporter:
                              userapp:
                                enabled: true
                              services:
                                enabled: true
                        metricsServer:
                          enabled: true
                        tracesServer:
                          enabled: true
                autoscaling:
                  enabled: true
                  minReplicas: 1
                  maxReplicas: 5
                  targetCPUUtilizationPercentage: 80
                  targetMemoryUtilizationPercentage: 80
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
        - name: opentelemetry-collector
          namespace: ${NAMESPACE} 
          releaseName: otel-services
          version: {{ .Values.capabilities.o11y.default.opentelemetryCollector.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  cp:
                    svcPod:
                      enabled: false
                mode: "deployment"
                fullnameOverride: otel-services
                internalTelemetryViaOTLP:
                  endpoint: ""
                  traces:
                    enabled: false
                    endpoint: ""
                  metrics:
                    enabled: false
                    endpoint: ""
                  logs:
                    enabled: false
                    endpoint: ""
                serviceAccount:
                  create: false
                  annotations: {}
                  name: ${SERVICE-ACCOUNT}
          flags:
            install: true
            createNamespace: false
            dependencyUpdate: true
        - name: opentelemetry-collector
          namespace: ${NAMESPACE}
          releaseName: otel-userapp
          version: {{ .Values.capabilities.o11y.withResources.opentelemetryCollector.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                global:
                  cp:
                    serviceLogs:
                      enabled: true
                    serviceTraces:
                      enabled: true
                    serviceSvcLogs:
                      enabled: true
                mode: "deployment"
                fullnameOverride: otel-userapp
                internalTelemetryViaOTLP:
                  endpoint: ""
                  traces:
                    enabled: false
                    endpoint: ""
                  metrics:
                    enabled: false
                    endpoint: ""
                  logs:
                    enabled: false
                    endpoint: ""
                podLabels:
                  networking.platform.tibco.com/kubernetes-api: enable
                  networking.platform.tibco.com/logServer-egress: enable
                  networking.platform.tibco.com/internet-egress: enable
                  networking.platform.tibco.com/cluster-egress: enable
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 1024Mi
                autoscaling:
                  enabled: true
                  minReplicas: 1
                  maxReplicas: 3
                  behavior:
                    scaleUp:
                      stabilizationWindowSeconds: 15
                    scaleDown:
                      stabilizationWindowSeconds: 15
                  targetCPUUtilizationPercentage: 80
                  targetMemoryUtilizationPercentage: 80
                serviceAccount:
                  create: false
                  name: ${SERVICE-ACCOUNT}
                extraEnvs:
                  - name: KUBE_NODE_NAME
                    valueFrom:
                      fieldRef:
                        apiVersion: v1
                        fieldPath: spec.nodeName
                extraEnvsFrom:
                  - secretRef:
                      name: o11y-service
                  - configMapRef:
                      name: o11y-service
                ports:
                  otlp:
                    enabled: true
                    containerPort: 4317
                    servicePort: 4317
                    hostPort: 4317
                    protocol: TCP
                    # nodePort: 30317
                    appProtocol: grpc
                  otlp-http:
                    enabled: true
                    containerPort: 4318
                    servicePort: 4318
                    hostPort: 4318
                    protocol: TCP
                  metrics:
                    enabled: true
                    containerPort: 8888
                    servicePort: 8888
                    hostPort: 8888
                    protocol: TCP
                  otlp-tas:
                    enabled: true
                    containerPort: 24317
                    servicePort: 24317
                    hostPort: 24317
                    protocol: TCP
                    appProtocol: grpc
                  otlp-http-tas:
                    enabled: true
                    containerPort: 24318
                    servicePort: 24318
                    hostPort: 24318
                    protocol: TCP
                config:
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                          endpoint: 0.0.0.0:4317
                        http:
                          cors:
                            allowed_origins:
                              - http://*
                              - https://*
                          endpoint: 0.0.0.0:4318
                    otlp/auditsafe:
                      protocols:
                        grpc:
                          endpoint: 0.0.0.0:24317
                        http:
                          cors:
                            allowed_origins:
                              - http://*
                              - https://*
                          endpoint: 0.0.0.0:24318
                    k8s_events:
                      namespaces: ["${env:app_namespace}"]
                  processors:
                    memory_limiter:
                      check_interval: 5s
                      limit_percentage: 80
                      spike_limit_percentage: 25
                      limit_mib: 2000
                    batch: {}
                    filter/userapp:
                      logs:
                        include:
                          match_type: strict
                          resource_attributes:
                          - key: workload_type
                            value: user-app
                    filter/svc:
                      logs:
                        include:
                          match_type: regexp
                          resource_attributes:
                          - key: workload_type
                            value: infra|capability-service
                    filter/devnull-logs:
                      error_mode: ignore
                      logs:
                        log_record:
                          - 'IsMatch(body, "")'
                    filter/devnull-traces:
                      error_mode: ignore
                      traces:
                        span:
                          - 'name != ""'
                    filter/health-traces:
                      error_mode: ignore
                      traces:
                        span:
                          - 'IsMatch(attributes["http.route"], ".*actuator/*") and IsMatch(resource.attributes["service.name"], "sb-app\\..*")'
                    k8sattributes/general:
                      auth_type: "serviceAccount"
                      passthrough: false
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        annotations:
                          - tag_name: connectors
                            key: platform.tibco.com/connectors
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                    k8sattributes/general-ns:
                      auth_type: "serviceAccount"
                      passthrough: false
                      filter:
                        namespace: ${env:app_namespace}
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        annotations:
                          - tag_name: connectors
                            key: platform.tibco.com/connectors
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: app_tags
                            key: platform.tibco.com/tags
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                    transform/logs:
                      log_statements:
                      - context: log
                        statements:
                        - set(resource.attributes["pod_namespace"], resource.attributes["k8s.namespace.name"])
                        - set(resource.attributes["pod_namespace"], "") where resource.attributes["app_type"] == "bw5"
                        - set(resource.attributes["pod_name"], resource.attributes["k8s.pod.name"])
                        - set(resource.attributes["pod_name"], "") where resource.attributes["app_type"] == "bw5"
                        - set(resource.attributes["pod_uid"], resource.attributes["k8s.pod.uid"])
                        - set(resource.attributes["pod_start_time"], resource.attributes["k8s.pod.start_time"])
                        - set(resource.attributes["workload_type"], "user-app") where IsMatch(resource.attributes["app_type"], "msg-*") or IsMatch(body["host_cloud_type"], "control-tower")
                        - set(resource.attributes["app_id"], body["app_id"]) where IsMatch(body["host_cloud_type"], "control-tower")
                        - set(resource.attributes["app_id"], resource.attributes["capability_instance_id"]) where IsMatch(resource.attributes["app_type"], "msg-*")
                        - set(resource.attributes["server_name"], resource.attributes["pod_name"]) where IsMatch(resource.attributes["app_type"], "msg-*")
                        - set(resource.attributes["server_name"], body["server_name"]) where IsMatch(body["host_cloud_type"], "control-tower")
                        - delete_key(resource.attributes, "k8s.namespace.name")
                        - delete_key(resource.attributes, "k8s.pod.name")
                        - delete_key(resource.attributes, "k8s.pod.uid")
                        - delete_key(resource.attributes, "k8s.pod.ip")
                        - delete_key(resource.attributes, "k8s.pod.start_time")
                    transform/logs-ext:
                      log_statements:
                      - context: log
                        statements:
                        - set(body["@timestamp"], body["log_time"])
                        - set(body["app_id"], resource.attributes["app_id"]) where body["app_id"] == nil
                        - set(body["app_name"], resource.attributes["app_name"])
                        - set(body["app_tags"], resource.attributes["app_tags"])
                        - set(body["app_type"], resource.attributes["app_type"])
                        - set(body["app_version"], resource.attributes["app_version"])
                        - set(body["capability_instance_id"], resource.attributes["capability_instance_id"])
                        - set(body["dataplane_id"], resource.attributes["dataplane_id"])
                        - set(body["dataplane_id"], "${DATAPLANE-ID}") where resource.attributes["dataplane_id"] == nil
                        - set(body["pod_name"], resource.attributes["pod_name"])
                        - set(body["pod_namespace"], resource.attributes["pod_namespace"])
                        - set(body["pod_uid"], resource.attributes["pod_uid"])
                        - set(body["pod_start_time"], resource.attributes["pod_start_time"])
                        - set(body["workload_type"], resource.attributes["workload_type"])
                        - set(body["server_name"], resource.attributes["server_name"]) where body["server_name"] == nil
                    transform/svclogs-ext:
                      log_statements:
                      - context: log
                        statements:
                        - set(body["@timestamp"], FormatTime(log.time, "%Y-%m-%dT%H:%M:%S.%LZ"))
                        - set(body["dataplane_id"], resource.attributes["dataplane_id"])
                        - set(body["capability_instance_id"], resource.attributes["capability_instance_id"])
                        - set(body["workload_type"], resource.attributes["workload_type"])
                        - set(body["pod_name"], resource.attributes["k8s.pod.name"])
                        - set(body["pod_namespace"], resource.attributes["k8s.namespace.name"])
                        - set(body["pod_start_time"], resource.attributes["k8s.pod.start_time"])
                        - set(body["pod_uid"], resource.attributes["k8s.pod.uid"])
                        - set(body["pod_ip"], resource.attributes["k8s.pod.ip"])
                    transform/msg-excl:
                      log_statements:
                      - context: log
                        statements:
                        - set(resource.attributes["workload_type"], "user-app") where IsMatch(resource.attributes["app_type"], "msg-*") or IsMatch(body["host_cloud_type"], "control-tower")
                    transform/es-bodymap:
                      log_statements:
                      - context: scope
                        statements:
                        - set(attributes["elastic.mapping.mode"], "bodymap")
                    transform/traces:
                      trace_statements:
                      - context: span
                        statements:
                          - delete_key(attributes, "error") where attributes["error"] == "false"
                          - set(attributes["pod_name"], resource.attributes["k8s.pod.name"])
                          - set(attributes["pod_namespace"], resource.attributes["k8s.namespace.name"])
                          - set(attributes["app_id"], resource.attributes["app_id"])
                          - set(attributes["app_type"], resource.attributes["app_type"])
                          - set(attributes["dataplane_id"], resource.attributes["dataplane_id"])
                          - set(attributes["workload_type"], resource.attributes["workload_type"])
                          - set(attributes["app_tags"], resource.attributes["app_tags"])
                          - set(attributes["app_name"], resource.attributes["app_name"])
                          - set(attributes["app_version"], resource.attributes["app_version"])
                          - set(attributes["capability_instance_id"], resource.attributes["capability_instance_id"])
                          - set(attributes["dataplane_id"], "${DATAPLANE-ID}") where attributes["dataplane_id"] == nil
                    transform/auditsafe:
                      error_mode: ignore
                      log_statements:
                      - context: log
                        statements:
                        - set(cache["ep0"]["prop_name"], "dataplane_id")
                        - set(cache["ep0"]["prop_value"], resource.attributes["dataplane_id"])
                        - set(cache["ep0"]["prop_value"], "${DATAPLANE-ID}") where resource.attributes["dataplane_id"] == nil
                        - set(cache["ep1"]["prop_name"], "workload_type")
                        - set(cache["ep1"]["prop_value"], resource.attributes["workload_type"])
                        - set(cache["ep2"]["prop_name"], "namespace")
                        - set(cache["ep2"]["prop_value"], resource.attributes["pod_namespace"])
                        - set(cache["ep3"]["prop_name"], "pod_name")
                        - set(cache["ep3"]["prop_value"], resource.attributes["pod_name"])
                        - set(cache["ep4"]["prop_name"], "app_id")
                        - set(cache["ep4"]["prop_value"], resource.attributes["app_id"])
                        - set(cache["ep5"]["prop_name"], "origin")
                        - set(cache["ep5"]["prop_value"], "pod")
                        - set(cache["ep5"]["prop_value"], "external") where resource.attributes["dataplane_id"] == nil
                        - set(cache["len"], Len(body["extra_props"])) where body["extra_props"] != nil or Len(body["extra_props"]) > 0
                        - set(cache["len"], 0) where body["extra_props"] == nil or Len(body["extra_props"]) == 0
                        - append(body["extra_props"], values = ["el0", "el1", "el2", "el3", "el4", "el5"])
                        - set(body["extra_props"][Int(cache["len"])], cache["ep0"])
                        - set(body["extra_props"][Int(cache["len"]+Int(1))], cache["ep1"])
                        - set(body["extra_props"][Int(cache["len"]+Int(2))], cache["ep2"])
                        - set(body["extra_props"][Int(cache["len"]+Int(3))], cache["ep3"])
                        - set(body["extra_props"][Int(cache["len"]+Int(4))], cache["ep4"])
                        - set(body["extra_props"][Int(cache["len"]+Int(5))], cache["ep5"])
                    filter/pod-warnings:
                      error_mode: ignore
                      logs:
                        log_record:
                          - 'severity_text != "Warning"'
                          - 'resource.attributes["k8s.object.kind"] != "Pod"'
                          - 'attributes["k8s.event.count"] != 1'
                    filter/pod-reasons:
                      error_mode: ignore
                      logs:
                        log_record:
                          - 'not IsMatch(attributes["k8s.event.reason"], "^(BackOff|OOMKilled|Failed|ErrImagePull|ImagePullBackOff|FailedScheduling|FailedMount|FailedAttachVolume)$")'
                    transform/pod-to-audit:
                      error_mode: ignore
                      log_statements:
                        - context: log
                          statements:
                            - set(resource.attributes["k8s.pod.name"], resource.attributes["k8s.object.name"]) where resource.attributes["k8s.object.kind"] == "Pod"
                            - set(resource.attributes["k8s.pod.uid"], resource.attributes["k8s.object.uid"]) where resource.attributes["k8s.object.kind"] == "Pod"
                            - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"])
                    k8sattributes/k8sevents:
                      auth_type: "serviceAccount"
                      passthrough: false
                      filter:
                        namespace: ${env:app_namespace}
                      pod_association:
                        - sources:
                          - from: resource_attribute
                            name: k8s.pod.uid
                        - sources:
                          - from: resource_attribute
                            name: k8s.pod.name
                          - from: resource_attribute
                            name: k8s.namespace.name
                      extract:
                        metadata:
                          - k8s.pod.name
                          - k8s.pod.uid
                          - k8s.namespace.name
                          - k8s.pod.start_time
                        labels:
                          - tag_name: app_id
                            key: platform.tibco.com/app-id
                            from: pod
                          - tag_name: app_type
                            key: platform.tibco.com/app-type
                            from: pod
                          - tag_name: dataplane_id
                            key: platform.tibco.com/dataplane-id
                            from: pod
                          - tag_name: workload_type
                            key: platform.tibco.com/workload-type
                            from: pod
                          - tag_name: app_name
                            key: platform.tibco.com/app-name
                            from: pod
                          - tag_name: app_version
                            key: platform.tibco.com/app-version
                            from: pod
                          - tag_name: capability_instance_id
                            key: platform.tibco.com/capability-instance-id
                            from: pod
                    transform/audit-body:
                      error_mode: ignore
                      log_statements:
                        - context: log
                          statements:
                            - set(resource.attributes["audit.service_name"], "KubernetesEventNotify")
                            - set(resource.attributes["audit.audit_status"], "FAILURE")
                            # audit_status: WARNING for probe/volume events (lower priority than pod crash/image failures)
                            - set(resource.attributes["audit.audit_status"], "WARNING") where attributes["k8s.event.reason"] == "FailedMount" or attributes["k8s.event.reason"] == "FailedAttachVolume"
                            - set(resource.attributes["audit.app_id"], resource.attributes["app_id"])
                            - set(resource.attributes["audit.app_type"], resource.attributes["app_type"])
                            - set(resource.attributes["audit.dataplane_id"], resource.attributes["dataplane_id"])
                            - set(resource.attributes["audit.instance"], resource.attributes["k8s.object.name"])
                            - set(resource.attributes["audit.app_instance"], resource.attributes["k8s.object.name"])
                            - set(resource.attributes["audit.severity"], "warning")
                            - set(resource.attributes["audit.severity"], "critical") where attributes["k8s.event.reason"] == "BackOff" or attributes["k8s.event.reason"] == "OOMKilled" or attributes["k8s.event.reason"] == "ErrImagePull" or attributes["k8s.event.reason"] == "ImagePullBackOff" or attributes["k8s.event.reason"] == "FailedScheduling" or attributes["k8s.event.reason"] == "Failed"
                            - set(resource.attributes["audit.scope"], "DP") where resource.attributes["workload_type"] == "infra"
                            - set(resource.attributes["audit.scope"], "CAP") where resource.attributes["workload_type"] == "capability-service"
                            - set(resource.attributes["audit.scope"], "APP") where resource.attributes["workload_type"] == "user-app"
                            # Compose audit event body — only ES-mapped fields in cache
                            - 'set(cache["trans_desp"], Concat([attributes["k8s.event.reason"], body], ": "))'
                            - set(cache["trans_id"], UUID())
                            - set(cache["service_name"], "KubernetesEventNotify")
                            - set(cache["trans_status"], "FAILURE")
                            - set(cache["trans_status"], "WARNING") where attributes["k8s.event.reason"] == "Unhealthy" or attributes["k8s.event.reason"] == "FailedMount" or attributes["k8s.event.reason"] == "FailedAttachVolume"
                            - set(cache["trans_state"], attributes["k8s.event.reason"])
                            - set(cache["trans_source"], "System")
                            - set(cache["trans_destination"], attributes["k8s.namespace.name"])
                            - set(cache["trans_ts"], FormatTime(log.time, "%Y-%m-%dT%H:%M:%S.%LZ"))
                            - set(cache["create_ts"], FormatTime(log.time, "%Y-%m-%dT%H:%M:%S.%LZ"))
                            - set(cache["user_trans_id"], resource.attributes["dataplane_id"]) where resource.attributes["workload_type"] == "infra"
                            - set(cache["user_trans_id"], resource.attributes["capability_instance_id"]) where resource.attributes["workload_type"] == "capability-service"
                            - set(cache["user_trans_id"], resource.attributes["app_id"]) where resource.attributes["workload_type"] == "user-app"
                            - set(cache["user_id"], "System")
                            - set(cache["entry_id"], "")
                            - set(cache["parent_id"], "")
                            # Build extra_props entries (matching Go collectExtraProps field names)
                            - set(cache["ep0"]["prop_name"], "Scope")
                            - set(cache["ep0"]["prop_value"], resource.attributes["audit.scope"])
                            - set(cache["ep1"]["prop_name"], "UserId")
                            - set(cache["ep1"]["prop_value"], "System")
                            - set(cache["ep2"]["prop_name"], "DataPlaneId")
                            - set(cache["ep2"]["prop_value"], resource.attributes["dataplane_id"])
                            - set(cache["ep2"]["prop_value"], "") where resource.attributes["dataplane_id"] == nil
                            - set(cache["ep3"]["prop_name"], "DataPlaneType")
                            - set(cache["ep3"]["prop_value"], "k8s")
                            - set(cache["ep4"]["prop_name"], "CapabilityInstanceId")
                            - set(cache["ep4"]["prop_value"], resource.attributes["capability_instance_id"])
                            - set(cache["ep4"]["prop_value"], "") where resource.attributes["capability_instance_id"] == nil
                            - set(cache["ep5"]["prop_name"], "CapabilityName")
                            - set(cache["ep5"]["prop_value"], resource.attributes["app_type"])
                            - set(cache["ep5"]["prop_value"], "") where resource.attributes["app_type"] == nil
                            - set(cache["ep6"]["prop_name"], "AppId")
                            - set(cache["ep6"]["prop_value"], resource.attributes["app_id"])
                            - set(cache["ep6"]["prop_value"], "") where resource.attributes["app_id"] == nil
                            - set(cache["ep7"]["prop_name"], "AppName")
                            - set(cache["ep7"]["prop_value"], resource.attributes["app_name"])
                            - set(cache["ep7"]["prop_value"], "") where resource.attributes["app_name"] == nil
                            - set(cache["ep8"]["prop_name"], "k8s.event.reason")
                            - set(cache["ep8"]["prop_value"], attributes["k8s.event.reason"])
                            - set(cache["ep9"]["prop_name"], "k8s.event.count")
