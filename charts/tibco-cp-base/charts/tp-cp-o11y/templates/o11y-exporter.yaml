        - name: opentelemetry-collector
          namespace: ${NAMESPACE}
          releaseName: otel-userapp-metrics
          version: {{ .Values.capabilities.o11y.withResources.opentelemetryCollector.version | quote }}
          repository:
            chartMuseum:
              host: ${HELM_REPO}
          values:
            - content: |
                mode: "deployment"
                fullnameOverride: otel-userapp-metrics
                internalTelemetryViaOTLP:
                  endpoint: ""
                  traces:
                    enabled: false
                    endpoint: ""
                  metrics:
                    enabled: false
                    endpoint: ""
                  logs:
                    enabled: false
                    endpoint: ""
                podLabels:
                  networking.platform.tibco.com/kubernetes-api: enable
                  networking.platform.tibco.com/prometheus: enable
                  networking.platform.tibco.com/internet-egress: enable
                  networking.platform.tibco.com/cluster-egress: enable
                  prometheus.io/scrape: "true"
                  prometheus.io/path: "metrics"
                  prometheus.io/port: "4319"
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: 1000m
                    memory: 1024Mi
                serviceAccount:
                  create: false
                  name: ${SERVICE-ACCOUNT}
                extraVolumes:
                  - name: hawktargets
                    configMap:
                      defaultMode: 420
                      items:
                      - key: hawktargets
                        path: hawktargets.yml
                      name: o11y-service
                {{- if $mp.enabled }}
                  - name: metrics-queue
                    # PCP-23522: node-ephemeral disk for the file_storage queue. NOT medium: Memory
                    # (that would reinstate RAM pressure). Survives container restart / OOM-kill in
                    # place (replay); a pod reschedule wipes it, an accepted loss <= today's pull
                    # gaps. sizeLimit is a HARD cap (pod eviction if exceeded) so it is kept above
                    # the SUM of the disk-buffered queues. PCP-24428: a BYO DP runs TWO queues on this
                    # one volume (the BYO leg — otlp or kafka — plus otlphttp/cp-metrics), so sizeLimit
                    # must clear ~2x queue.sizeBytes + boltdb overhead (default bumped to 1Gi;
                    # perf-validate the dual-queue worst case per the PCP-23710 method). Queue sheds first.
                    # Ownership: the
                    # subchart podSecurityContext (fsGroup 1000 + fsGroupChangePolicy Always) lets
                    # the uid-1000 collector write it — no chown initContainer needed.
                    emptyDir:
                      sizeLimit: {{ dig "emptyDir" "sizeLimit" "512Mi" $mp | quote }}
                {{- end }}
                extraVolumeMounts:
                  - mountPath: /conf/hawkconsole
                    name: hawktargets
                {{- if $mp.enabled }}
                  - mountPath: /var/lib/otelcol/metrics-queue
                    name: metrics-queue
                {{- end }}
                extraEnvs:
                  - name: KUBE_NODE_NAME
                    valueFrom:
                      fieldRef:
                        apiVersion: v1
                        fieldPath: spec.nodeName
                extraEnvsFrom:
                  - secretRef:
                      name: o11y-service
                  - configMapRef:
                      name: o11y-service
                ports:
                  otlp:
                    enabled: true
                    containerPort: 4317
                    servicePort: 4317
                    hostPort: 4317
                    protocol: TCP
                    # nodePort: 30317
                    appProtocol: grpc
                  otlp-http:
                    enabled: true
                    containerPort: 4318
                    servicePort: 4318
                    hostPort: 4318
                    protocol: TCP
                  metrics:
                    enabled: true
                    containerPort: 8888
                    servicePort: 8888
                    hostPort: 8888
                    protocol: TCP
                  prometheus:
                    enabled: true
                    containerPort: 4319
                    servicePort: 4319
                    hostPort: 4319
                    protocol: TCP
                  prometheus-ext:
                    enabled: true
                    containerPort: 4320
                    servicePort: 4320
                    hostPort: 4320
                    protocol: TCP
                config:
                  receivers:
                    nop: {}
                    otlp:
                      protocols:
                        grpc:
                          endpoint: 0.0.0.0:4317
                        http:
                          cors:
                            allowed_origins:
                              - http://*
                              - https://*
                          endpoint: 0.0.0.0:4318
                    # PCP-23799: scrape THIS collector's own :8888 self-telemetry (otelcol_*) so the
                    # pipeline-degradation signals (queue depth / drops / send failures / receiver
                    # backpressure / RSS) ride the same delivery to CP Prometheus. Static localhost
                    # target — no kubernetes_sd, so it needs no RBAC (works in ns-role or clusterrole
                    # mode); dataplane_id is stamped downstream by transform/msg.
