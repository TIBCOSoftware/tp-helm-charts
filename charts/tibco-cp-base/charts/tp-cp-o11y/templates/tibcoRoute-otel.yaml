{{- if .Values.tibcoRouter.create }}
apiVersion: cloud.tibco.com/v1
kind: TibcoRoute
metadata:
  labels:
    {{- include "tp-cp-o11y.shared.labels.standard" . | nindent 4 }}
  name: otel-services-audit-tibcoroute
spec:
  serviceName: otel-services
  endpoints:
    - protocol: http
      path: /otel-service/audit/events/v1/logs
      port: 24318
      internalPath: /v1/logs
      proxies:
        - listener: virtual
          config: secure
          configVariables:
            SECURE_REDIRECT_SKIP_ACCTS_CHECK: "true"
            SECURE_REDIRECT_SKIP_EULA_CHECK: "true"
            SECURE_REDIRECT_SKIP_ORG_CHECK: "true"
          methods:
            - POST
          fqdn: ${TSC_DNS_DOMAIN}
          allowClientCache: false
          allowXFrameOptions: false
          enableRedirects: false
  env:
    - name: TSC_DNS_DOMAIN
      valueFrom:
        configMapKeyRef:
          name: {{ include "tp-cp-o11y-dnsdomain-configmap" . }}
          key: TSC_DNS_DOMAIN
{{- end }}
