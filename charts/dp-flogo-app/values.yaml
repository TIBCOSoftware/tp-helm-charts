# Default values for dp-flogo-app.

dpConfig:
  dataplaneId: ""
  capabilityInstanceId: ""
  capabilityVersion: ""
  capabilityDefaultNamespace: ""
  helmRepoAlias: ""
  licenseMountPath: ""
  licenseSecretName: ""
  customCertSecretName: ""

appConfig:
  appId: ""
  buildId: ""
  workloadType: "user-app"
  appVersion: "1.0.0"
  originalAppName: ""
  flogoBuildTypeTag: "2.26.9-b784"
  flogoBaseImageTag: "2.26.9-b784"
  customFQImage: ""
  tags: ""
  connectors: ""
  lastUpdated: ""
  flogoAppPropsEnv: "auto"
  flogoExposeSwaggerEp: true
  flogoHttpServicePort: 7777
  flogoAppMetrics: true

otel:
  traces:
    enabled: true
  metrics:
    enabled: true

auditSafe:
  enabled: true

serviceMesh:
  enabled: false

networkPolicy:
  internetAll: enable
  internetWeb: enable
  msgInfra: enable
  databaseEgress: enable
  proxyEgress: enable
  userApps: enable
  clusterEgress: enable

replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  appInitImageName: "tp-flogo-app-init"
  appInitImageTag: "102"
  fluentBitImageName: "common-fluentbit"
  fluentBitImageTag: "5.1.5"
  flogoBaseImageName: "tp-flogo-app-base"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# for future use, workload can be "statufulset", "deployment", etc
workload: "deployment"

serviceAccountName: ""

deploymentAnnotations: {}

deploymentLabels: {}

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: Always
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

flogoapp:
  securityContext:
    allowPrivilegeEscalation: false
    # To enable readOnlyRootFilesystem, the app build must use the flogo version (buildtype tag) 2.25.11-b336 or higher.
    readOnlyRootFilesystem: false
    capabilities:
      drop:
      - ALL
      - CAP_NET_RAW
  resources: {}
  #  limits:
  #    cpu: 500m
  #    memory: 1Gi
  #  requests:
  #    cpu: 250m
  #    memory: 512Mi
  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true
  envs: []
  # - name: foo
  #   value: bar
  envFrom:
    configMapRef: []
    #  - "cm1"
    secretRef: []
    #  - "secret1"
  startupProbe:
    failureThreshold: 50
    httpGet:
      path: /ping
      port: 7777
      scheme: HTTP
    periodSeconds: 6
    successThreshold: 1
    timeoutSeconds: 5
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /ping
      port: 7777
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 6
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /ping
      port: 7777
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 5
  lifecycle: {}

fluentBit:
  enabled: true
  configMapName: "otel-config-flogo"
  securityContext:
    capabilities:
      drop:
      - ALL
      - CAP_NET_RAW
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
  resources: {}
  #  limits:
  #    cpu: 100m
  #    memory: 100Mi
  #  requests:
  #    cpu: 10m
  #    memory: 10Mi
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/v1/uptime
      port: 2020
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  lifecycle: {}

appInit:
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
      - CAP_NET_RAW
  resources: {}
  #  limits:
  #    cpu: 200m
  #    memory: 200Mi
  #  requests:
  #    cpu: 100m
  #    memory: 100Mi

service:
  serviceDiscoverable: true
  serviceDescription: ""
  type: ClusterIP
  ports: []
  # ports:
  #  - port: 9999
  #    targetPort: 9999
  # Backend TLS for a wss:// app, service-scoped controllers.
  # Only needed when the websocket trigger sets enableTLS: true: the app then
  # serves TLS itself while the router forwards plain HTTP, and the handshake
  # fails with "Client sent an HTTP request to an HTTPS server". A websocket
  # app that does not enable TLS on its trigger needs nothing here.
  # traefik and kong read these off the Service, so putting them under
  # ingress.annotations has no effect.
  #   traefik.ingress.kubernetes.io/service.serversscheme: https
  #   konghq.com/protocol: https
  annotations: {}
  labels: {}
  # for GKE gateway loadbalancer health check policy
  customhealthCheckPolicy: {}

ingress:
  enabled: false
  className: ""
  # currently supported controllerName are: nginx, kong, traefik
  controllerName: ""
  resourceInstanceName: ""
  # Backend TLS for a wss:// app, ingress-scoped controllers. See
  # service.annotations above for when this is needed; nginx and haproxy read
  # it from the Ingress, traefik and kong do not.
  #   nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  #   haproxy.org/server-ssl: "true"
  # OpenShift Route also renders from this block, but its tls.termination is
  # hardcoded to "edge" in openshift-route.yaml, so re-encrypting to a
  # TLS-enabled websocket app cannot be expressed here without a chart change.
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  rules:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix
          port: 9999
          serviceDiscoverable: true
          serviceDescription: ""
          customCRDConfig: {}
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

gateway:
  enabled: false
  name: ""
  namespace: ""
  sectionName: ""
  controllerName: ""
  resourceInstanceName: ""
  # GKE URL Map compatibility. When true, the generated HTTPRoute omits
  # spec.hostnames and publishes the host on the
  # platform.tibco.com/gateway-hostname annotation instead.
  # Use this when the Gateway is shared with existing hostname-less HTTPRoutes
  # that GKE would otherwise partition into a separate URL Map host rule,
  # causing 404s on the pre-existing routes.
  # Applies to Helm-managed apps only; apps exposed through the Control Plane
  # UI always carry spec.hostnames.
  # Caveats when enabled:
  #  - requires a flogoprovisioner build that reads the annotation; on older
  #    builds listing the app's endpoints fails.
  #  - the route then matches every hostname the parent listener accepts; on
  #    GKE a hostname-less route acts as the Gateway's default backend, so at
  #    most one app on a Gateway may use path "/".
  #  - every app sharing the listener must use a unique, non-overlapping path
  #    prefix; ties resolve by oldest creation timestamp, then by
  #    alphabetical "{namespace}/{name}".
  #  - X-Forwarded-Host is still set from rules[].host by the default
  #    filters; a path that supplies its own filters must set it itself.
  gkeUrlMapEnabled: false
  # Backend TLS for a wss:// app, Gateway API. There is no annotation for it:
  # a TLS-enabled websocket app needs a BackendTLSPolicy targeting this app's
  # Service, applied separately. It cannot be set from this chart.
  annotations: {}
  rules:
  - host: example.com
    paths:
    - path: /
      pathType: PathPrefix
      port: 9999
      serviceDiscoverable: true
      serviceDescription: ""
      filters: []
      customCRDConfig: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  behavior: {}
