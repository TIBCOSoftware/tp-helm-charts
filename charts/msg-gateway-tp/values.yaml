# CP common setting
global:
  cp:
    dpUrl:
      host: "dp-{{ $.Values.global.cp.dataplaneId }}.platform.local"
      port: 443
    dataplane:
      hostCloudType: "unset"
    dataplaneId: "xx123"
    containerRegistry:
      registry: "ghcr.io"
      repository: "tibco/msg-platform-cicd"
      secret: ""
      pullSecret: ""
      pullPolicy: ""
    resources:
      serviceaccount:
        serviceAccountName: "provisioner"
    logging:
      fluentbit:
        enabled: true
    routeResources:
      pathPrefix: /tibco/agent   # per-DP prefix; OHC2 control planes send "" or a custom value
      controllerServiceDNS: cpdpproxy   # service DNS for tibtunnel (hybrid connectivity)
      ingress:
        ingressController: ""    # "" | "haProxy" (default) | "nginx" | "traefik" | "openshiftRouter"
        ingressClassName: ""
        fqdn: ""
        annotations: {}
      gatewayapi:
        gatewayAPIControllerName: ""
        gatewayName: ""
        gatewayNamespace: ""
        gatewayHostOrDomainName: ""
        gatewaySectionName: ""

# Message Gateway additional settings
msggw:
  basename: ""
  image: ""
dp:
  pullSecret: ""
  registry: ""
  repo: ""
  pullPolicy: ""
  serviceAccount: ""
  routing:
    enabled:
      haProxy: true
      traefik: true
      nginx: true
      openshiftRouter: true
      gatewayapi: true
    gatewayapi:
      # Lowercase cp-provided controller names. Empty list = allow any once the gate above is on.
      allowedControllers:
        - haproxy
        - openshiftrouter
        - traefik
        - nginx
        - istio
        - netscaler
        - gke
        # named in the OHC2 design doc
        - envoy
        - kong
# Support EMS values files
ems:
  msgData: {}
