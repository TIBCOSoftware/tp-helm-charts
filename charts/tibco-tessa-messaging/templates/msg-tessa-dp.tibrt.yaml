{{-  $cpParams := include "need.msg.cp.params" . | fromYaml }}
apiVersion: cloud.tibco.com/v1
kind: TibcoRoute
metadata:
  name: tp-cp-msg-tessa-emsmcp
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: msg-tessa
    app.kubernetes.io/component: msg
spec:
  endpoints:
  - internalPath: /v1/proxy/$1/tibco/agent/msg/tessa/ems/mcp$2
    # OHC2:  internalPath: /v1/proxy/$1/msg/tessa/ems/mcp$2
    path: /cp/api/v1/msgdp/([^/]+)/tessa/ems/mcp(.*)
    port: 80
    protocol: http
    proxies:
    - allowClientCache: true
      allowXFrameOptions: true
      config: secure
      configVariables:
        SECURE_REDIRECT_SKIP_ACCTS_CHECK: "true"
        SECURE_REDIRECT_SKIP_EULA_CHECK: "true"
        SECURE_REDIRECT_SKIP_ORG_CHECK: "true"
      enableRedirects: true
      fqdn: "{{ $cpParams.cp.DNS_DOMAIN }}"
      listener: virtual
  serviceName: dp-proxy
  serviceNamespace: {{ .Release.Namespace }}
