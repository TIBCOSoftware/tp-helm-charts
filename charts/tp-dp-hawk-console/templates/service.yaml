---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tp-dp-hawk-console.consts.appName" . }}-connect
  namespace: {{ .Release.Namespace }}
  {{- if include "tp-dp-hawk-console.traefikIngressActive" . }}
  {{- /* traefik reads these off the Service, not the Ingress; without serversscheme it would talk plaintext to the TLS port */}}
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-{{ include "tp-dp-hawk-console.consts.appName" . }}-transport@kubernetescrd
  {{- end }}
  labels:
      app.kubernetes.io/name: {{ include "tp-dp-hawk-console.consts.appName" . }}-connect
      app.kubernetes.io/component: {{ include "tp-dp-hawk-console.consts.component" . }}
      app.kubernetes.io/part-of: {{ include "tp-dp-hawk-console.consts.team" . }}
      app.kubernetes.io/managed-by: {{ .Release.Service }}
      app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ports:
    - port: 9687
      protocol: TCP
      targetPort: 9687
      appProtocol: https
      name: hawk-rest-port
  selector:
      app.kubernetes.io/name: {{ include "tp-dp-hawk-console.consts.appName" . }}
  clusterIP: None
