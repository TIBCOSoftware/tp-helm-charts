          service:
            name: "{{ $svcname}}"
            port:
              number: {{ int $params.msggw.ports.gatewayApiPort | default 8376 }}
  - host: "{{ .Values.global.cp.routeResources.controllerServiceDNS | default "cpdpproxy" }}"
