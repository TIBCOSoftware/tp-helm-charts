{{- /* gatewayapi */ -}}
{{- if and (eq $ic "gatewayapi") $en.gatewayapi }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ $basename }}-ops"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msg-gateway.std.labels" $params | nindent 4 }}
    app.kubernetes.io/component: msg-gateway-ingress
spec:
  parentRefs:
  - name: {{ .Values.global.cp.routeResources.gatewayapi.gatewayName }}
    namespace: {{ .Values.global.cp.routeResources.gatewayapi.gatewayNamespace }}
    {{- with .Values.global.cp.routeResources.gatewayapi.gatewaySectionName }}
    sectionName: {{ . }}
    {{- end }}
  hostnames:
  - {{ .Values.global.cp.routeResources.gatewayapi.gatewayHostOrDomainName | quote }}
  - "{{ .Values.global.cp.routeResources.controllerServiceDNS | default "cpdpproxy" }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.global.cp.routeResources.pathPrefix }}/msg/ops/shell/toolset/
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: "{{ $svcname}}"
      port: {{ int $params.msggw.ports.gatewayApiPort | default 8376 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ $basename }}-api"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "msg-gateway.std.labels" $params | nindent 4 }}
    app.kubernetes.io/component: msg-gateway-ingress
spec:
  parentRefs:
  - name: {{ .Values.global.cp.routeResources.gatewayapi.gatewayName }}
    namespace: {{ .Values.global.cp.routeResources.gatewayapi.gatewayNamespace }}
    {{- with .Values.global.cp.routeResources.gatewayapi.gatewaySectionName }}
    sectionName: {{ . }}
    {{- end }}
  hostnames:
  - {{ .Values.global.cp.routeResources.gatewayapi.gatewayHostOrDomainName | quote }}
  - "{{ .Values.global.cp.routeResources.controllerServiceDNS | default "cpdpproxy" }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.global.cp.routeResources.pathPrefix }}/msg/ct/toolset/
    timeouts:
      request: 90s
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: "{{ $svcname}}"
      port: {{ int $params.msggw.ports.gatewayApiPort | default 8376 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
