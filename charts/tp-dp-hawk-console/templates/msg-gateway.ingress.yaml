  rules:
  - host: {{ .Values.global.cp.routeResources.ingress.fqdn }}
    http:
      paths:
      - pathType: ImplementationSpecific
        path: {{ .Values.global.cp.routeResources.pathPrefix }}/msg/ops/shell/toolset/(.*)
