# HELPER VARIABLE DEFINITIONS
{{- $params := include "need.msg.gateway.params" . | fromYaml -}}
{{- $basename := printf "%s" $params.msggw.basename  -}}
{{- $svcname := $basename -}}
#
{{- if $params.enableIngress }}

{{- $rr := .Values.global.cp.routeResources -}}
{{- $en := default dict .Values.dp.routing.enabled -}}
{{- $ic := include "msg.dp.routing.ic" . -}}
{{- /* ingressClassName is only honoured when an IC was explicitly selected; otherwise the built-in per-DP class wins. */ -}}
{{- $className := printf "tibco-dp-%s" $params.dp.name -}}
{{- if and $rr.ingress.ingressController $rr.ingress.ingressClassName }}{{- $className = $rr.ingress.ingressClassName -}}{{- end }}

{{- /* haProxy default */ -}}
{{- if and (eq $ic "haProxy") $en.haProxy }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $basename }}-ops"
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/path-rewrite: '{{ .Values.global.cp.routeResources.pathPrefix }}/msg/ops/shell/toolset/(.*) /\1'
    {{- with .Values.global.cp.routeResources.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "msg-gateway.std.labels" $params | nindent 4 }}
    app.kubernetes.io/component: msg-gateway-ingress
spec:
  ingressClassName: {{ $className | quote }}
  rules:
  - host: {{ include "msg.dp.dpUrl.host" . }}
    http:
      paths:
      - pathType: Prefix
        path: {{ .Values.global.cp.routeResources.pathPrefix }}/msg/ops/shell/toolset/
        backend:
          service:
            name: "{{ $svcname}}"
            port:
              number: {{ int $params.msggw.ports.gatewayApiPort | default 8376 }}
  - host: "{{ $params.route.cpHost }}"
    http:
      paths:
      - pathType: Prefix
        path: {{ .Values.global.cp.routeResources.pathPrefix }}/msg/ops/shell/toolset/
        backend:
          service:
            name: "{{ $svcname}}"
            port:
              number: {{ int $params.msggw.ports.gatewayApiPort | default 8376 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $basename }}-api"
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/path-rewrite: '{{ .Values.global.cp.routeResources.pathPrefix }}/msg/ct/toolset/(.*) /\1'
    haproxy.org/timeout-server: 90s
    {{- with .Values.global.cp.routeResources.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "msg-gateway.std.labels" $params | nindent 4 }}
    app.kubernetes.io/component: msg-gateway-ingress
spec:
  ingressClassName: {{ $className | quote }}
  rules:
  - host: {{ include "msg.dp.dpUrl.host" . }}
    http:
      paths:
      - pathType: Prefix
        path: {{ .Values.global.cp.routeResources.pathPrefix }}/msg/ct/toolset/
        backend:
          service:
            name: "{{ $svcname}}"
            port:
              number: {{ int $params.msggw.ports.gatewayApiPort | default 8376 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ $basename }}-restd"
  namespace: {{ .Release.Namespace }}
  annotations:
    ingress.kubernetes.io/path-rewrite: '{{ .Values.global.cp.routeResources.pathPrefix }}/msg/ct/restd/(.*) /\1'
    {{- with .Values.global.cp.routeResources.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "msg-gateway.std.labels" $params | nindent 4 }}
    app.kubernetes.io/component: msg-gateway-ingress
spec:
  ingressClassName: {{ $className | quote }}
  rules:
  - host: {{ include "msg.dp.dpUrl.host" . }}
    http:
      paths:
      - pathType: Prefix
        path: {{ .Values.global.cp.routeResources.pathPrefix }}/msg/ct/restd/
        backend:
          service:
            name: "{{ $svcname}}"
            port:
              number: {{ int $params.msggw.ports.restdPort | default 9014 }}
{{- end }}

