# Check for needed default credentials (like TLS support)
#
{{- $params := include "need.msg.gateway.params" . | fromYaml -}}
{{- $basename := printf "%s" $params.msggw.basename  -}}
{{- $jobname := printf "%s-preinstall-%s" $basename (randAlphaNum 4 | lower) -}}

# Additional HELPER VARIABLE DEFINITIONS
#
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ $jobname }}"
  labels:
    {{- include "msg-gateway.std.labels" $params | nindent 4 }}
    tib-msg-jobname: {{ $params.msggw.basename }}-preinstall
    app.kubernetes.io/component: msg-gateway-preinstall
    app.kubernetes.io/name: "{{ $params.msggw.basename }}-preinstall"
  namespace: "{{ .Release.Namespace }}"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 0
  #4hr limit -  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 14400
  template:
    metadata:
      name: "{{ $jobname }}"
      namespace: "{{ .Release.Namespace }}"
      labels:
        {{- include "msg-gateway.std.labels" $params | nindent 8 }}
        {{ include "msg.dp.net.kubectl" . | indent 8}}
        app.kubernetes.io/component: msg-gateway-preinstall
        app.kubernetes.io/name: "{{ $params.msggw.basename }}-preinstall"
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      {{- if ne "none" $params.dp.pullSecret }}
      imagePullSecrets:
      - name: {{ $params.dp.pullSecret }}
      {{- end }}
      serviceAccountName: "{{ $params.dp.serviceAccount }}"
      {{ include "msg.dp.security.pod" $params | nindent 6 }}
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      containers:
      - name: "main"
        {{ $dpAdminUser := printf "gems-%s" $params.dp.name }}
        {{ $dpAdminPwd := printf "pw%s" (randAlphaNum 32) }}
        {{ $dpViewUser := printf "gems-view-%s" $params.dp.name }}
        {{ $dpViewPwd := printf "pw%s" (randAlphaNum 32) }}
        {{- $stsname := printf "sts/%s" $basename -}}
        {{- $jobLabel := printf "-l=tib-msg-jobname=%s-preinstall" $params.msggw.basename -}}
        command: ['/compliance/check_eua', 'bash', '-c' ]
        args:
        - |
          # Prevent downgrades ;
          {{ include "msg.rollback.protection" (dict "v" .Chart.Version "cr" $stsname ) | nindent 10 }}
          # Cleanup old hook jobs
          {{ include "msg.oldjob.cleanup" ( $jobLabel ) | nindent 10 }}
          echo "Checking for tibadmin secret ... "
          secretName="{{ $basename }}-tibadmin"
          source "/opt/tibco/pod-tools/bin/preinstall.bash" 
          # Create secrets: tp-msggw-mcp-credentials, $basename-tibadmin, tp-msggw-ems-credentials
          # $basename-tibadmin secret is now deprecated, scheduled for future removal.
          labels=()
          literals=()
          files=()
          # Labels are shared across all secrets 
          labels+=("tib-dp-release: {{ .Release.Name }}")
          labels+=("tib-msg-group-name: {{ $params.msggw.basename }}")
          labels+=("app.kubernetes.io/component: msg-gateway")

          # TODO: Schedule phase-out of $basename-tibadmin secret
          # tibadmin : Add legacy secret settings for backward compatibility with older versions
          literals=()
          literals+=("EMS_ADMIN_USER {{ $dpAdminUser }}")
          literals+=("EMS_ADMIN_PASSWORD {{ $dpAdminPwd }}")
          literals+=("DP_ADMIN_USER {{ $dpAdminUser }}")
          literals+=("DP_ADMIN_PASSWORD {{ $dpAdminPwd }}")
          literals+=("DP_VIEW_USER {{ $dpViewUser }}")
          literals+=("DP_VIEW_PASSWORD {{ $dpViewPwd }}")
          createSecretIfMissing $secretName literals files labels "{{ .Release.Namespace }}"
          # New Gems EMS DP secret yaml format
          # tp-msg-dp-credentials: same labels
          # Migrate any existing credentials to new secret format
          DP_ADMIN_USER=${DP_ADMIN_USER:-"{{ $dpAdminUser }}"}
          DP_ADMIN_PASSWORD=${DP_ADMIN_PASSWORD:-"{{ $dpAdminPwd }}"}
          DP_VIEW_USER=${DP_VIEW_USER:-"{{ $dpViewUser }}"}
          DP_VIEW_PASSWORD=${DP_VIEW_PASSWORD:-"{{ $dpViewPwd }}"}
          # MCP secret
          literals=()
          literals+=("EMS_VIEW_USER $DP_VIEW_USER")
          literals+=("EMS_VIEW_PASSWORD $DP_VIEW_PASSWORD")
          createSecretIfMissing "tp-msggw-mcp-credentials" literals files labels "{{ .Release.Namespace }}"
          literals=()
          # K8DPs use fluentbit export of ftlserver logs
          # CTDPs use emslog exporter
          # loggingDurable: tibco-gems-{{ $params.dp.instanceId }}
          cat <<! > /tmp/gems.creds.yaml
          ems:
            adminUser: $DP_ADMIN_USER
            adminPassword: $DP_ADMIN_PASSWORD
            viewUser: $DP_VIEW_USER
            viewPassword: $DP_VIEW_PASSWORD
            loggingDurable: ""
          !
          files+=("gems.credentials.yaml /tmp/gems.creds.yaml")
          createSecretIfMissing "tp-msggw-ems-credentials" literals files labels "{{ .Release.Namespace }}"
          rtc=$?
          # sleep 600
          exit $rtc
        image: "{{ $params.msggw.image }}"
        resources:
          {{ $params.job.resources | toYaml | nindent 10 }}
        imagePullPolicy: "{{ $params.dp.pullPolicy }}"
        {{ include "msg.dp.security.container" $params | nindent 8 }}
        envFrom:
          - secretRef:
              name: "{{ $basename }}-tibadmin"
              optional: true
        env:
        # CAUTION! Setting Names here overrides envFrom values
        {{ include "msg.dp.stdenv" $params | indent  8 }}
        - name: ACCEPT_EUA
          value: "y"
        volumeMounts:
          - name: tmp-vol
            mountPath: /tmp
      volumes:
        - name: tmp-vol
          emptyDir: {}
