# Name of chart
name: on-premises-third-party
# label indicating which project this pipeline belongs to (Don't change)
partOf: TIBCO Control Plane

global:
  tibco:
    # Container registry configuration
    containerRegistry:
      # Registry URL where container images are hosted
      # Example: "your-registry.com" or "docker.io"
      url: ""

      # Username for authenticating with the container registry
      # Required for private registries
      username: ""

      # Password for authenticating with the container registry
      # Required for private registries (consider using secrets)
      password: ""

      # Base repository path within the registry
      # Container images will be pulled from this repository
      repository: tibco-platform-docker-dev

  # Default storage class for persistent volumes
  # Leave empty to use the cluster's default storage class
  # Example: "fast-ssd", "standard", "gp2"
  storageClass: ""

# PostgreSQL chart Configuration
postgresql:
  # Enable or disable PostgreSQL deployment
  # Set to false if using an external PostgreSQL instance
  enabled: true

  global:
    imageRegistry: ""
    imagePullSecrets:
    - tibco-container-registry-credentials

  # PostgreSQL container image configuration
  image:
    repository: tibco-platform-docker-dev/common-postgresql
    tag: 16.4.0-debian-12-r14

  # PostgreSQL exporter container image configuration
  metrics:
    image:
      repository: tibco-platform-docker-dev/common-postgres-exporter
      tag: 0.15.0-debian-12-r43

  # PostgreSQL ssl container image configuration
  volumePermissions:
    image:
      repository: tibco-platform-docker-dev/common-os-shell
      tag: 12-debian-12-r30

# Redis chart Configuration
redis:
  # Enable or disable Redis deployment
  # Set to false if using an external Redis instance
  enabled: false

  # Use a single Redis node (no replication / sentinel) for the on-prem third-party tier,
  # mirroring the single-instance PostgreSQL above.
  architecture: standalone

  global:
    imageRegistry: ""
    imagePullSecrets:
    - tibco-container-registry-credentials
    # Allow the mirrored internal images (common-redis*) below — Bitnami's image
    # verification (chart >= ~19) otherwise rejects non-bitnami repositories.
    security:
      allowInsecureImages: true

  # Redis container image configuration
  image:
    repository: tibco-platform-docker-dev/common-redis
    tag: 7.4.3-debian-12-r0

  # Redis exporter container image configuration
  metrics:
    image:
      repository: tibco-platform-docker-dev/common-redis-exporter
      tag: 1.70.0-debian-12-r2

  # Redis volume-permissions (os-shell) image configuration
  volumePermissions:
    image:
      repository: tibco-platform-docker-dev/common-os-shell
      tag: 12-debian-12-r43
