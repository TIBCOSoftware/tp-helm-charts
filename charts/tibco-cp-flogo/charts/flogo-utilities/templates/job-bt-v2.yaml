{{ if and .Values.buildtypesExtract (semverCompare ">=1.35-0" .Capabilities.KubeVersion.GitVersion) .Values.useImageVolumes }}
{{- $dot := . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flogo-utilities.fullname" $dot }}-buildtype-extract-v2-{{ randAlphaNum 4 | lower }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flogo-utilities.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600  # Cleanup of jobs from key/value store after 100 sec
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "flogo-utilities.selectorLabels" . | nindent 8 }}
        {{- include "flogo-utilities.networkPolicyLabels" . | nindent 8 }}
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Never
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if (include "flogo-utilities.container-registry.secret" $dot) }}
      imagePullSecrets:
        - name: {{ include "flogo-utilities.container-registry.secret" $dot }}
      {{- end }}
      containers:
      {{- range $index, $image := .Values.flogoBuildtypeImages }}
      {{- if $image.delete_image  }}
      - name: {{ $image.name }}-{{ $image.tag | replace "." "-" | lower }}-delete
        image: {{ include "flogo-utilities.image.registry" $dot }}{{"/"}}{{ include "flogo-utilities.infra.image.repository" $dot }}{{"/"}}{{ $.Values.debug.image.name }}:{{ $.Values.debug.image.tag }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        {{- with $.Values.probes.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $.Values.securityContext }}
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 10 }}
        {{- end }}
        {{- if $.Values.global.tibco.enableResourceConstraints }}
        resources:
          {{- toYaml $.Values.scripts.resources | nindent 10 }}
        {{- end }}
        command:
          - "sh"
          - "-c"
          - |
            path=/usr/share/nginx/html/{{ $image.target_location }}/{{ $image.tag }}
            rm -rf "${path}"
            echo "Deleted buildtype from location: $path"
        volumeMounts:
          - name: store-vol
            mountPath: {{ $.Values.volumes.plugins.mountPath }}
            subPath: {{ $.Values.volumes.plugins.subPath }}
          - name: tmp-vol
            mountPath: /tmp
      {{- end }}
      {{- if $image.extract_image  }}
      # v2: the buildtype image is mounted read-only as a native image volume and
      # its contents are copied to the shared store. No container image extractor.
      - name: {{ $image.name }}-{{ randAlphaNum 5 | lower }}
        image: {{ include "flogo-utilities.image.registry" $dot }}{{"/"}}{{ include "flogo-utilities.infra.image.repository" $dot }}{{"/"}}{{ $.Values.debug.image.name }}:{{ $.Values.debug.image.tag }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        {{- with $.Values.probes.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $.Values.securityContext }}
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 10 }}
        {{- end }}
        {{- if $.Values.global.tibco.enableResourceConstraints }}
        resources:
          {{- toYaml $.Values.buildtype.resources | nindent 10 }}
        {{- end }}
        command:
          - "sh"
          - "-c"
          - |
            target=/usr/share/nginx/html/{{ $image.target_location }}/{{ $image.tag }}
            rm -rf "${target}"
            mkdir -p "${target}"
            echo "Extracting buildtype {{ $image.name }} with tag {{ $image.tag }}"
            cp -r /tmp/{{ $image.name }}/{{ $image.tag }}{{ $image.path }}/* "${target}/"
            echo "Extraction of buildtype completed at: $target"
        volumeMounts:
          - name: store-vol
            mountPath: {{ $.Values.volumes.plugins.mountPath }}
            subPath: {{ $.Values.volumes.plugins.subPath }}
          - name: {{ $image.name | lower }}-{{ $image.tag | replace "." "-" | lower }}-img-vol
            mountPath: /tmp/{{ $image.name }}/{{ $image.tag }}
      {{- end }}
      {{- end }}
      volumes:
      - name: store-vol
        persistentVolumeClaim:
          claimName: {{ include "flogo-utilities.pvc-name" $dot }}
      - emptyDir: {}
        name: tmp-vol
      {{- range $index, $image := .Values.flogoBuildtypeImages }}
      {{- if $image.extract_image  }}
      - name: {{ $image.name | lower }}-{{ $image.tag | replace "." "-" | lower }}-img-vol
        image:
          reference: {{ include "flogo-utilities.image.registry" $dot }}{{"/"}}{{ include "flogo-utilities.flogo.image.repository" $dot }}{{"/"}}{{ $image.name }}:{{ $image.tag }}
          pullPolicy: IfNotPresent
      {{- end }}
      {{- end }}
{{- end }}
