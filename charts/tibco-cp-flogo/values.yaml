global:
  tibco:
    idleSessionTimeoutInSeconds: "14400"
    containerRegistry:
      url: ""
      username: ""
      password: ""
      repository: ""
      imagePullSecretName: ""
      customCertSecret: ""
    controlPlaneInstanceId: ""
    enableResourceConstraints: true
    useSingleNamespace: true
    serviceAccount: ""
    # The fluentbit configuration section.
    # It specifies that the fluentbit should not run as a non-root user and the user ID should be 0 (root).
    # Privilege escalation is not allowed for security reasons.
    # Additionally, it drops all capabilities, which is a common security practice to minimize potential risks.
    # GitHub issue: https://github.com/fluent/fluent-bit/issues/872#issuecomment-827763207, https://github.com/kyma-project/kyma/pull/11657/files
    logging:
      fluentbit:
        enabled: true
        image:
          name: "common-fluentbit"
          registry: ""
          repo: ""
          tag: 5.1.0
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 150Mi
    proxy:
      httpProxy: ""
      httpsProxy: ""
      noProxy: ""
  external:
    storage:
      pvcName: "control-plane-pvc"
    environment: ""

# Sub charts
flogo-recipes:
  enabled: true
  flogoprovisioner:
    image:
      tag: "1138-platform-1.20.0"
    # Alphabetical; mirrored in flogo-recipes.
    config:
      APP_HELMCHART_VERSION: "1.20.8"
      APP_INIT_CPU_LIMIT: "200m"
      APP_INIT_CPU_REQUEST: "100m"
      APP_INIT_IMAGE_TAG: "81"
      APP_INIT_MEMORY_LIMIT: "400Mi"
      APP_INIT_MEMORY_REQUEST: "100Mi"
      FLOGO_APP_BASE_IMAGE_TAG: "2.26.7-b632"
      # Flogo app-build Job config; override per install.
      # CPU limit blank = uncapped (faster builds); the memory limit OOM-kills an oversized
      # build instead of starving neighbors. Blank would uncap it.
      FLOGO_APP_BUILD_CPU_LIMIT: ""
      FLOGO_APP_BUILD_CPU_REQUEST: "2000m"
      FLOGO_APP_BUILD_MAX_QUEUED_SECONDS: "600"
      FLOGO_APP_BUILD_MEMORY_LIMIT: "4Gi"
      FLOGO_APP_BUILD_MEMORY_REQUEST: "1.5Gi"
      FLOGO_APP_BUILD_TIMEOUT_SECONDS: "300"
      FLOGO_APP_BUILDER_IMAGE_TAG: "1001-platform-1.20.0"
      INFRA_CP_PROXY_IMAGE_TAG: "358"
    resources:
      requests:
        cpu: 500m
        memory: 700Mi
      limits:
        cpu: "1"
        memory: 1024Mi

flogo-webserver:
  enabled: true

flogo-utilities:
  enabled: true
