################################################################################
# Chart Version to Schema Version Mapping
#
# This file maps each released tibco-cp-base chart version to the expected
# database schema version for each service. Only services whose schema version
# changed in that release are listed under each version.
################################################################################

versions:
  "1.13.0":
    pengine: 3
    idm: 6
    tscutd: 16
    tasdataserver: 6
    monitoringdb: 3
    tasdomainserver: 3
    defaultidp: 2
    tscorch: 1
    tscscheduler: 1

  "1.14.0":
    pengine: 4
    idm: 7
    tscutd: 17

  "1.15.0":
    tscutd: 18
    monitoringdb: 6

  "1.16.0":
    tscutd: 19
    tasdataserver: 7

  "1.17.0":
    tscutd: 20

  "1.18.0":
    pengine: 5
    tscutd: 21

  "1.19.0":
    tscutd: 22
    idm: 8

  "1.20.0":
    idm: 9
    tscutd: 23

  # tscscheduler: -1 signals that the service has been removed (CPS-2661).
  # resolve_target_schema_version treats -1 as "service deleted" and skips it.
  "1.21.0":
    tscscheduler: -1
    tscutd: 24
    idm: 10

# PCP-19871 (orch-mon merge): tscutd 25 is 25-up.sql, which adds the monitoring columns and the
# MON_* tables. manageDbSchema resolves the target from THIS file, so leaving it at 24 would make
# 25-up.sql silently never run and the check-sql-schema-version init containers block forever.
# 25 rather than 24 because main owns 24-up.sql for PCP-20702; the migrate_finops.sh gate in
# tp-cp-core/templates/jobs.yaml is keyed >=1.22.0 to match.
#
# monitoringdb: -1 retires the monitoring database (PCP-23723), following the PCP-6689 pattern
# used for tscscheduler: resolve_target_schema_version returns empty, so manageDbSchema skips it
# before any bootstrap or SQL runs. Nothing is dropped — on upgrade the database is simply left
# orphaned but intact, which is what makes a rollback survivable, since an older core-cp-scripts
# image resolves monitoringdb to 6 again and finds its data still there. That is why there is no
# drop script.
  "1.22.0":
    # PCP-23170: pengine 6 is 6-up.sql, which adds the Application Operator role rows.
    pengine: 6
    tscutd: 25
    monitoringdb: -1
